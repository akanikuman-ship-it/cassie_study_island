<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="錯題本">
<meta name="theme-color" content="#FBF6EE">
<title>Cassie 錯題本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23F4A6B8'/%3E%3Cellipse cx='32' cy='42' rx='9' ry='6' fill='%23E07A93'/%3E%3Ccircle cx='29' cy='42' r='1.8' fill='%23743246'/%3E%3Ccircle cx='35' cy='42' r='1.8' fill='%23743246'/%3E%3Cpath d='M10 20h44l-6-9H16z' fill='%238A6A4A'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF6EE; --paper:#FFFFFF; --ink:#2B2522; --ink2:#6B615A; --line:#E8DFD3;
  --pig:#E8879F; --pig-d:#C25C78; --pig-l:#FCE5EC;
  --ok:#2F8F5B; --ok-l:#E3F4EA; --bad:#C9433A; --bad-l:#FBE6E3;
  --c1:#C25C78; --c2:#C98A1C; --c3:#3C7DB8;
  --chip:#F3ECE2; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1A18; --paper:#29231F; --ink:#F2ECE6; --ink2:#B7ABA1; --line:#3D3530;
    --pig:#E8879F; --pig-d:#F0A3B7; --pig-l:#3B2A2F;
    --ok:#6CC995; --ok-l:#1F3328; --bad:#F08A80; --bad-l:#3D2522;
    --c1:#F0A3B7; --c2:#E8B65A; --c3:#7DB4E6; --chip:#352E29; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1A18; --paper:#29231F; --ink:#F2ECE6; --ink2:#B7ABA1; --line:#3D3530;
  --pig:#E8879F; --pig-d:#F0A3B7; --pig-l:#3B2A2F;
  --ok:#6CC995; --ok-l:#1F3328; --bad:#F08A80; --bad-l:#3D2522;
  --c1:#F0A3B7; --c2:#E8B65A; --c3:#7DB4E6; --chip:#352E29; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header.top h1{font-size:22px;margin:0;letter-spacing:.02em}
header.top .sub{color:var(--ink2);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:180px;border:0;background:none;padding:6px 4px;border-radius:12px;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--pig-d);background:var(--pig-l)}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
h2{font-size:20px;margin:18px 0 10px}
h3{font-size:17px;margin:14px 0 8px}
.muted{color:var(--ink2)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--pig-d);border-color:var(--pig-d);color:#fff}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 14px;min-height:40px;font-size:15px}
.chip.on{background:var(--pig-d);border-color:var(--pig-d);color:#fff}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.tag.c-概念不懂{background:color-mix(in srgb,var(--c1) 16%,transparent);color:var(--c1)}
.tag.c-讀題漏看{background:color-mix(in srgb,var(--c2) 18%,transparent);color:var(--c2)}
.tag.c-粗心{background:color-mix(in srgb,var(--c3) 16%,transparent);color:var(--c3)}
.tag.done{background:var(--ok-l);color:var(--ok)}
label.f{display:block;font-size:14px;color:var(--ink2);margin:12px 0 4px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.t{min-height:90px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* fractions */
.fr{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .1em}
.fr .w{margin-right:.08em}
.fr .nd{display:inline-flex;flex-direction:column;align-items:center;font-size:.82em;line-height:1.1}
.fr .nd span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em}

/* pig */
.pig{display:flex;gap:12px;align-items:flex-start}
.pig svg{flex:none;width:56px;height:56px}
.bubble{background:var(--pig-l);border-radius:16px;border-top-left-radius:4px;padding:10px 14px;flex:1}
.bubble b{color:var(--pig-d)}

/* practice */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero svg{width:96px;height:96px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--chip);border-radius:12px;padding:8px 14px;font-size:15px}
.stat b{font-size:20px;margin-right:2px}
.qcard{margin-top:14px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.prog{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--pig);border-radius:99px;transition:width .3s}
.qtext{font-size:21px;line-height:1.75;margin:4px 0 16px}
.look{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--pig-d);background:var(--pig-l);border-radius:999px;padding:3px 12px;margin-bottom:8px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.ten{grid-template-columns:repeat(5,1fr)}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:14px 16px;min-height:56px;text-align:left;font-size:19px;display:flex;gap:12px;align-items:center}
.opt .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:15px;color:var(--ink2)}
.opt.big{justify-content:center;font-size:30px;min-height:72px}
.opt.sel{border-color:var(--pig-d);background:var(--pig-l)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt:disabled{cursor:default}
.numin{display:flex;gap:10px;align-items:center}
.numin input{font-size:26px;letter-spacing:.06em;max-width:320px;min-width:0;flex:1}
.numin span,.numin .btn{white-space:nowrap;flex:none}
.result{margin-top:16px}
.answerbox{border-radius:14px;padding:12px 16px;margin-top:10px}
.answerbox.ok{background:var(--ok-l)}
.answerbox.bad{background:var(--bad-l)}
.bigans{font-size:34px;font-weight:600;letter-spacing:.06em}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chat{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.msg{margin:8px 0;padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap}
.msg.me{margin-left:auto;background:var(--chip)}
.msg.pg{background:var(--pig-l)}
.fig{width:100%;max-width:560px;display:block;margin:4px 0 14px;color:var(--ink)}

/* book */
.statbars{display:grid;gap:8px;margin-top:8px}
.sb{display:grid;grid-template-columns:5.5em 1fr 2.5em;gap:10px;align-items:center;font-size:15px}
.sb .bar{height:12px;background:var(--chip);border-radius:99px;overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:99px}
.items{display:grid;gap:12px;margin-top:14px}
.item .q{font-size:18px;line-height:1.7;margin:6px 0 10px}
.item .ol{margin:0 0 10px;padding-left:0;list-style:none;display:grid;gap:4px;font-size:16px;color:var(--ink2)}
.ab{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.ab dt{color:var(--ink2)}
.ab dd{margin:0}
.ab .stu{color:var(--bad)}
.ab .cor{color:var(--ok);font-weight:600}
.exp{background:var(--chip);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15.5px;white-space:pre-wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
details.more summary{cursor:pointer;color:var(--ink2);font-size:14px;margin-top:8px}
.empty{text-align:center;padding:40px 10px;color:var(--ink2)}

/* cards */
.deckrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:12px 0}
.deck{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 14px;text-align:left;min-height:56px}
.deck b{display:block;font-size:17px}
.deck span{font-size:13.5px;color:var(--ink2)}
.deck.on{border-color:var(--pig-d);background:var(--pig-l)}
#c-frame{width:100%;border:0;display:block;min-height:400px;border-radius:14px;background:var(--paper)}
/* worked examples */
.exnav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.exnav::-webkit-scrollbar{display:none}
.exnav button{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14.5px;min-height:38px}
.exnav button.on{background:var(--pig-d);border-color:var(--pig-d);color:#fff}
.exnav button.done::after{content:" ✓";color:var(--ok)}
.exnav button.on.done::after{color:#fff}
.excard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.paper{border:2px solid var(--ink);border-radius:6px;padding:14px 16px;background:var(--bg);font-size:20px;line-height:1.8;position:relative}
.paper::before{content:"考題";position:absolute;top:-12px;left:12px;background:var(--paper);padding:0 8px;font-size:13px;color:var(--ink2);letter-spacing:.1em}
.paper b{color:var(--pig-d)}
.sv{display:block;max-width:100%;height:auto;margin:8px auto;color:var(--ink);max-height:300px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;margin-top:16px;animation:pop .3s ease}
@keyframes pop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}}
.step .no{width:36px;height:36px;border-radius:50%;background:var(--pig-d);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.step .tx{font-size:19px;line-height:1.75;min-width:0}
.step mark,.paper mark{background:none;color:inherit;border:2.5px solid var(--c1);border-radius:999px;padding:0 6px}
.step b,.tx b{color:var(--pig-d)}
.r{color:var(--bad)}
.exbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.exans{margin-top:18px;background:var(--ok-l);border-radius:14px;padding:12px 16px}
.exans .k{font-size:14px;color:var(--ink2)}
.exans .v{font-size:26px;font-weight:700;color:var(--ok)}
.extip{margin-top:10px;background:color-mix(in srgb,var(--c2) 15%,transparent);border-radius:12px;padding:10px 14px;font-size:16.5px}
.extry{margin-top:20px;border-top:2px dashed var(--line);padding-top:14px}
.extry h3{margin:0 0 8px;font-size:18px;color:var(--pig-d)}
.cmp{font-size:30px;letter-spacing:.12em;display:grid;gap:4px;justify-content:center;margin:8px 0}
.cmp .g{color:var(--ok)} .cmp .hl{background:color-mix(in srgb,var(--c2) 35%,transparent);border-radius:4px}
.big{font-size:24px;text-align:center;margin:10px 0}
.dots{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:6px 0}
.dots .lbl{width:6.5em;font-size:15px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ok)}
.dots i.x{background:var(--bad);outline:3px solid color-mix(in srgb,var(--bad) 30%,transparent)}
table.ktab{border-collapse:collapse;margin:8px auto;font-size:16.5px;min-width:min(100%,360px)}
table.ktab td,table.ktab th{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.ktab th{font-weight:500;color:var(--ink2);font-size:14px}
table.ktab tr.on td{background:color-mix(in srgb,var(--c2) 22%,transparent);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.chips2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:18px}
.chips2 span{background:var(--chip);border-radius:999px;padding:6px 14px}
/* settings */
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
.stylebtns{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.stylebtn{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 14px;min-height:44px;display:flex;gap:8px;align-items:center}
.stylebtn .dot{width:12px;height:12px;border-radius:50%}
.stylebtn.on{border-color:var(--pig-d);background:var(--pig-l)}
.subjrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.cand{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--bg)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.photo-view img{max-width:100%;border-radius:12px;margin-top:8px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex}
.modal .sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><use href="#pigface"/></svg>
    <div><h1>Cassie 的錯題本</h1><div class="sub" id="subline">四上</div></div>
  </header>

  <!-- 練習 -->
  <section class="view" id="v-practice">
    <div id="p-home"></div>
    <div id="p-run" hidden></div>
  </section>

  <!-- 錯題本 -->
  <section class="view" id="v-book">
    <div class="chips" id="b-subj"></div>
    <div class="card" style="margin-top:12px">
      <div class="row">
        <select class="t" id="b-unit" style="max-width:220px"></select>
        <select class="t" id="b-state" style="max-width:160px">
          <option value="todo">待練習</option><option value="done">已克服</option><option value="all">全部</option>
        </select>
        <input class="t" id="b-q" placeholder="搜尋題目" style="flex:1;min-width:140px">
      </div>
      <div class="chips" id="b-cause" style="margin-top:10px"></div>
      <div class="statbars" id="b-stats"></div>
    </div>
    <div class="items" id="b-items"></div>
  </section>

  <!-- 新增 -->
  <section class="view" id="v-cards">
    <div class="chips" id="c-subj"></div>
    <div class="deckrow" id="c-decks"></div>
    <div id="c-steps" hidden></div>
    <iframe id="c-frame" title="重點卡" loading="eager"></iframe>
  </section>

  <section class="view" id="v-add">
    <h2>上傳考卷照片</h2>
    <div class="card">
      <div class="grid2">
        <div><label class="f">科目</label><select class="t" id="a-subj"></select></div>
        <div><label class="f">考卷名稱</label><input class="t" id="a-exam" placeholder="例：國語第七課平時考"></div>
      </div>
      <label class="f">照片（可一次選多張，最好是錯題的近照）</label>
      <input type="file" id="a-files" accept="image/*" multiple class="t">
      <div class="thumbs" id="a-thumbs"></div>
      <div class="actions">
        <button class="btn pri" id="a-run">AI 辨識錯題</button>
        <button class="btn" id="a-manual">手動新增一題</button>
      </div>
      <p class="small muted" id="a-msg">需要先在「設定」填入 Gemini API Key。AI 會先找出老師打叉或訂正的題目，你確認、修改後再存入。</p>
    </div>
    <div id="a-cands"></div>
  </section>

  <!-- 設定 -->
  <section class="view" id="v-set">
    <h2>AI 智能助理配置</h2>
    <div class="card">
      <div class="grid2">
        <div>
          <label class="f">Gemini API Key</label>
          <div class="keyrow"><input class="t" id="s-key" type="password" autocomplete="off" placeholder="貼上 API Key"><button class="btn sm" id="s-eye" type="button">顯示</button></div>
          <div class="small muted" style="margin-top:4px">只存在這台裝置的瀏覽器，不會放進備份檔。</div>
        </div>
        <div>
          <label class="f">模型名稱</label>
          <select class="t" id="s-model">
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
          </select>
          <div class="row" style="margin-top:6px"><button class="btn sm" id="s-test">測試連線</button><span class="small muted" id="s-testmsg"></span></div>
        </div>
      </div>
      <label class="f" style="margin-top:18px"><b>快速套用教學風格</b>（點按鈕切換要編輯的指令）</label>
      <div class="stylebtns">
        <button class="stylebtn" data-p="expert"><span class="dot" style="background:#D9483B"></span>精簡專家模式（家長診斷用）</button>
        <button class="stylebtn" data-p="pig"><span class="dot" style="background:#3BA55C"></span>豬探長引導模式（Cassie 練習用）</button>
      </div>
      <label class="f" id="s-plabel">AI 教師自定義人格指令（System Prompt）</label>
      <textarea class="t" id="s-prompt" style="min-height:260px"></textarea>
      <div class="row" style="margin-top:6px"><span class="small muted">最終以輸入框的內容作為 AI 的行為準則。</span><span class="sp"></span><button class="btn sm" id="s-reset">還原預設</button></div>
    </div>

    <h2>年級與版本</h2>
    <div class="card">
      <div class="grid2" style="margin-bottom:8px"><div><label class="f">年級學期</label><input class="t" id="s-grade"></div></div>
      <label class="f">科目與出版社（之後有自然平時考，在這裡加一科就能用）</label>
      <div id="s-subjs"></div>
      <button class="btn sm" id="s-addsubj">＋ 新增科目</button>
    </div>

  async put(k,v){const db=await this.open(); if(!db) return false; return new Promise(r=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)})},
  async get(k){const db=await this.open(); if(!db) return null; return new Promise(r=>{const q=db.transaction('p').objectStore('p').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})},
  async del(k){const db=await this.open(); if(!db) return; db.transaction('p','readwrite').objectStore('p').delete(k)},
  async all(){const db=await this.open(); if(!db) return {}; return new Promise(r=>{const out={};const c=db.transaction('p').objectStore('p').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else r(out)};c.onerror=()=>r(out)})},
  async clear(){const db=await this.open(); if(!db) return; db.transaction('p','readwrite').objectStore('p').clear()}
};

/* ===== 例題步驟：圖解工具 ===== */
const SV={ink:'currentColor',teal:'#2A9D8F',red:'#E0584B',blue:'#4A86C8',gold:'#E8A33A',fill:'rgba(42,157,143,.35)'};
const _P=(cx,cy,r,d)=>[cx+r*Math.cos(d*Math.PI/180), cy-r*Math.sin(d*Math.PI/180)];
const _f=n=>(+n).toFixed(1);
function _arc(cx,cy,r,a0,a1,col,w,dash){const st=a1>a0?3:-3;const pts=[];for(let a=a0;st>0?a<=a1:a>=a1;a+=st)pts.push(_P(cx,cy,r,a));pts.push(_P(cx,cy,r,a1));
  return `<polyline fill="none" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="7 5"':''} stroke-linecap="round" points="${pts.map(p=>_f(p[0])+','+_f(p[1])).join(' ')}"/>`;}
function _head(x,y,dir,col,s=11){const a=dir*Math.PI/180,b1=a+2.6,b2=a-2.6;return `<polygon fill="${col}" points="${_f(x)},${_f(y)} ${_f(x+s*Math.cos(b1))},${_f(y-s*Math.sin(b1))} ${_f(x+s*Math.cos(b2))},${_f(y-s*Math.sin(b2))}"/>`;}
const _cd=n=>90-30*n;
/* 鐘面：from 起點, to 終點, cw 順時針?, opt.count 顯示格數編號, opt.arrow 只畫方向 */
function svClock(from,to,cw,opt={}){
  const cx=120,cy=120,R=86;let s=`<svg class="sv" viewBox="0 0 240 250" role="img" aria-label="鐘面"><circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--paper)" stroke="${SV.ink}" stroke-width="3"/>`;
  for(let i=0;i<60;i++){const [x1,y1]=_P(cx,cy,R-3,90-6*i),[x2,y2]=_P(cx,cy,R-(i%5?7:12),90-6*i);s+=`<line x1="${_f(x1)}" y1="${_f(y1)}" x2="${_f(x2)}" y2="${_f(y2)}" stroke="${SV.ink}" stroke-width="${i%5?1:2.4}"/>`;}
  for(let n=1;n<=12;n++){const [x,y]=_P(cx,cy,R-26,_cd(n));const hl=(n===from||n===to)&&opt.hl!==false;
    s+=`${hl?`<circle cx="${_f(x)}" cy="${_f(y)}" r="13" fill="${n===from?SV.blue:SV.red}" opacity=".18"/>`:''}<text x="${_f(x)}" y="${_f(y+6.5)}" font-size="19" font-weight="700" text-anchor="middle" fill="${SV.ink}">${n}</text>`;}
  const [hx,hy]=_P(cx,cy,48,_cd(from));s+=`<line x1="${cx}" y1="${cy}" x2="${_f(hx)}" y2="${_f(hy)}" stroke="${SV.blue}" stroke-width="6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="${SV.ink}"/>`;
  if(to!=null){
    const a0=_cd(from);let a1=_cd(to);if(cw){while(a1>=a0)a1-=360;}else{while(a1<=a0)a1+=360;}
    if(opt.arrow){const a1s=cw?a0-55:a0+55;s+=_arc(cx,cy,R+14,a0,a1s,SV.red,4,true);const [ex,ey]=_P(cx,cy,R+14,a1s);s+=_head(ex,ey,cw?a1s-90:a1s+90,SV.red,14);}
    else{s+=_arc(cx,cy,R+14,a0,a1,SV.red,4,true);const [ex,ey]=_P(cx,cy,R+14,a1);s+=_head(ex,ey,cw?a1-90:a1+90,SV.red,14);}
    if(opt.count){const n=Math.round(Math.abs(a1-a0)/30);for(let k=1;k<=n;k++){const mid=a0+(cw?-1:1)*(30*k-15);const [x,y]=_P(cx,cy,R+30,mid);
      s+=`<circle cx="${_f(x)}" cy="${_f(y)}" r="10" fill="${SV.gold}"/><text x="${_f(x)}" y="${_f(y+4.5)}" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff">${k}</text>`;}}
  }
  return s.replace('viewBox="0 0 240 250"','viewBox="-12 -12 264 264"')+'</svg>';
}

/* ---------- figure (segment diagram) ---------- */
function figSVG(f){
  if(!f) return '';
  const W=560,H=176,x0=40,x1=W-40,y=86;
  const X=i=>x0+(x1-x0)*f.pos[i];
  let s=`<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="路線圖"><g stroke="currentColor" fill="none" stroke-width="2"><line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;
  f.pts.forEach((p,i)=>{s+=`<line x1="${X(i)}" y1="${y-7}" x2="${X(i)}" y2="${y+7}"/>`});
  f.arcs.forEach(([a,b,lab,where])=>{
    const xa=X(a),xb=X(b),mx=(xa+xb)/2;
    if(where==='bottom'){ s+=`<path d="M${xa} ${y+12} V${y+56} H${xb} V${y+12}" stroke-dasharray="4 4"/>`; }
    else{ const yy=where==='top2'?y-34:y-52; s+=`<path d="M${xa} ${y-10} V${yy} H${xb} V${y-10}" stroke-dasharray="4 4"/>`; }
  });
  s+='</g><g fill="currentColor" font-size="17" text-anchor="middle">';
  f.pts.forEach((p,i)=>{s+=`<text x="${X(i)}" y="${y+46}">${esc(p)}</text>`});
  f.arcs.forEach(([a,b,lab,where])=>{
    const mx=(X(a)+X(b))/2;
    if(where==='bottom') s+=`<text x="${mx}" y="${y+76}" font-size="15">${esc(lab)}</text>`;
    else{const yy=where==='top2'?y-34:y-52; s+=`<rect x="${mx-44}" y="${yy-13}" width="88" height="24" rx="6" fill="var(--paper)"/><text x="${mx}" y="${yy+5}" font-size="15">${esc(lab)}</text>`;}
  });
  return s+'</g></svg>';
}

/* ---------- Gemini ---------- */
async function gemini(parts,{system='',json=false,history=null}={}){
  const key=getKey(); if(!key) throw new Error('還沒有設定 Gemini API Key');
  const model=DB.settings.model||'gemini-2.5-flash';
  const body={contents: history? history : [{role:'user',parts}]};
  if(system) body.system_instruction={parts:[{text:system}]};
  if(json) body.generationConfig={responseMimeType:'application/json'};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((j.error&&j.error.message)||('連線失敗 '+r.status));
  const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  if(!txt) throw new Error('AI 沒有回覆內容');
  return txt;
}

const lastT=i=>i.hist&&i.hist.length?i.hist[i.hist.length-1].t:0;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startRun(subj,n){
  const inS=i=>subj==='全部'||i.s===subj;
  const byNeed=(a,b)=>((a.streak||0)-(b.streak||0))||(lastT(a)-lastT(b));
  const wrong=shuffle(DB.items.filter(i=>!i.mastered&&inS(i))).sort(byNeed);
  const fresh=shuffle(BK.filter(i=>!i.mastered&&inS(i)));
  let W=Math.min(Math.ceil(n/2),wrong.length);
  let N=Math.min(n-W,fresh.length);
  if(W+N<n) W=Math.min(n-N,wrong.length);
  const pickW=[];const usedC={};
  for(const it of wrong){ if(pickW.length>=W) break; if(usedC[it.c]>=2) continue; pickW.push(it); usedC[it.c]=(usedC[it.c]||0)+1; }
  for(const it of wrong){ if(pickW.length>=W) break; if(!pickW.includes(it)) pickW.push(it); }
  const wc=new Set(pickW.map(i=>i.c)), ws=new Set(pickW.map(i=>i.s));
  const rank=b=>(wc.has(b.c)?0:ws.has(b.s)?1:subj==='全部'&&b.s==='自然'?2:3);
  fresh.sort((a,b)=>(rank(a)-rank(b))||byNeed(a,b));
  const pickN=[];const usedN={};
  for(const b of fresh){ if(pickN.length>=N) break; if(usedN[b.c]>=2) continue; pickN.push(b); usedN[b.c]=(usedN[b.c]||0)+1; }
  for(const b of fresh){ if(pickN.length>=N) break; if(!pickN.includes(b)) pickN.push(b); }
  if(subj==='全部'&&!pickN.some(b=>b.s==='自然')){const sci=fresh.find(b=>b.s==='自然'&&!pickN.includes(b)); if(sci&&pickN.length) pickN[pickN.length-1]=sci;}
  const all=[...pickW,...pickN];
  if(!all.length){toast('這一科的題目都克服了，太厲害了！');return}
  /* 交錯排序：相鄰的題目盡量不同觀念、不同科目，錯題和新題目輪流 */
  const order=[];const left=shuffle(all.slice());let wantBank=false;
  while(left.length){
    const p=order[order.length-1];
    const score=x=>(p&&x.c===p.c?100:0)+(p&&x.s===p.s&&subj==='全部'?10:0)+((!!x.bank)!==wantBank?1:0);
    left.sort((a,b)=>score(a)-score(b)); const x=left.shift(); order.push(x); wantBank=!x.bank;
  }
  RUN={queue:order.map(i=>({id:i.id,variant:false})),idx:0,ok:0,chat:[]};
  $('#p-home').hidden=true; $('#p-run').hidden=false; renderQ();
}

  const src=e.variant&&it.v? {...it,...it.v,isVariant:true}:{...it,isVariant:false};
  return {e,it,q:src};}

  else if(q.type==='choice'){
    const cls=q.opts.length===3&&q.opts.every(o=>o.length<=2)?'three':'';
    opts=`<div class="opts ${cls}">${q.opts.map((o,i)=>`<button class="opt ${cls?'big':''}" data-o="${esc(o)}">${cls?'':`<span class="n">${i+1}</span>`}<span>${fmt(o)}</span></button>`).join('')}</div>`;
  }
  else if(q.type==='check'){
    const ten=q.opts.length>=8&&q.opts.every(o=>o.length<=2);
    opts=`<div class="opts ${ten?'ten':''}">${q.opts.map((o,i)=>`<button class="opt ${ten?'big':''}" data-o="${esc(o)}">${ten?'':`<span class="n">☐</span>`}<span>${fmt(o)}</span></button>`).join('')}</div><div class="actions"><button class="btn pri" id="q-submit">選好了，送出</button></div>`;
  }
  else if(q.type==='num') opts=`<div class="numin"><input class="t" id="q-num" inputmode="decimal" autocomplete="off" placeholder="寫答案">${q.u?`<span style="font-size:20px">${esc(q.u)}</span>`:''}<button class="btn pri" id="q-submit">送出</button></div>`;
  else if(q.type==='write') opts=pigSay('請拿紙筆，<b>一筆一畫</b>寫寫看。寫好了再按「看答案」。')+`<div class="actions"><button class="btn pri" id="q-reveal">我寫好了，看答案</button></div>`;
  box.innerHTML=`
  <div class="row"><button class="btn sm ghost" id="q-quit">← 結束</button><span class="sp"></span><span class="muted small">第 ${RUN.idx+1} / ${total} 題</span></div>
  <div class="prog"><i style="width:${(RUN.idx/total)*100}%"></i></div>
  <div class="card qcard">
    <div class="qhead"><span class="tag">${esc(it.s)}</span>${it.bank?'<span class="tag" style="background:var(--ok-l);color:var(--ok)">新題目</span>':'<span class="tag c-概念不懂">錯題</span>'}${it.c&&CONCEPTS[it.c]?`<span class="tag">${esc(CONCEPTS[it.c])}</span>`:`<span class="tag">${esc(it.unit||'')}</span>`}${it.x?'<span class="tag" style="background:var(--pig-l);color:var(--pig-d)">比一比</span>':''}${q.isVariant?'<span class="tag" style="background:var(--pig-l);color:var(--pig-d)">換數字挑戰</span>':''}</div>
    ${isLong(q.q)?`<div class="look">🔍 仔細看一看：先找出題目在問什麼</div>`:''}
    <div class="qtext">${fmt(q.q)}</div>
    ${figSVG(q.fig)}
    <div id="q-area">${opts}</div>
    <div class="result" id="q-res"></div>
    <div class="actions" id="q-help">
      <button class="btn sm" id="q-hint">💡 豬探長的提示</button>
      ${getKey()?'<button class="btn sm" id="q-chat">🐷 問豬探長</button>':''}
    </div>
    <div id="q-chatbox"></div>
  </div>`;
  $('#q-quit').onclick=()=>{RUN=null;renderPracticeHome()};
  $('#q-hint').onclick=()=>{ $('#q-res').innerHTML=pigSay(`<b>仔細看一看，用心想一想。</b><br>${fmt(hintOf(it,q))}`); };
  if($('#q-chat')) $('#q-chat').onclick=openChat;
  const area=$('#q-area');
  if(q.type==='tf'||q.type==='choice') area.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.o,b));
  if(q.type==='check'){
    area.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(RUN.state.done) return; b.classList.toggle('sel'); const n=b.querySelector('.n'); if(n) n.textContent=b.classList.contains('sel')?'☑':'☐'; });
    $('#q-submit').onclick=()=>{const sel=[...area.querySelectorAll('.opt.sel')].map(b=>b.dataset.o); if(!sel.length){toast('至少選一個喔');return} answer(sel)};
  }
  if(q.type==='num'){ const inp=$('#q-num'); inp.focus({preventScroll:true}); inp.onkeydown=ev=>{if(ev.key==='Enter')$('#q-submit').click()};
    $('#q-submit').onclick=()=>{ if(!inp.value.trim()){toast('先寫答案喔');return} answer(inp.value) }; }
  if(q.type==='write') $('#q-reveal').onclick=revealWrite;
}
function isRight(q,v){
  if(q.type==='check'){const a=[...q.ans].sort().join('|');return [...v].sort().join('|')===a}
  if(q.type==='num'){const ok=[q.ans,...(q.acc||[])].map(normNum);return ok.includes(normNum(v))}
  return v===q.ans;
}
function answer(v,btn){
  const {e,it,q}=curQ(); const st=RUN.state; if(st.done) return;
  st.tries++;
  const right=isRight(q,v);
  const area=$('#q-area');
  if(right){
    st.done=true;
    if(btn) btn.classList.add('right');
    if(q.type==='check') area.querySelectorAll('.opt').forEach(b=>{if(q.ans.includes(b.dataset.o)) b.classList.add('right')});
    lockOpts();
    record(it,st.tries===1);
    finishCard(true);
  }else{
    if(btn){btn.classList.add('wrong');btn.disabled=true}
    if(st.tries===1){
      if(q.type==='check') area.querySelectorAll('.opt.sel').forEach(b=>{b.classList.remove('sel');const n=b.querySelector('.n');if(n)n.textContent='☐'});
      if(q.type==='num') $('#q-num').select();
      $('#q-res').innerHTML=pigSay(`嗯…還不是喔。<b>仔細看一看，用心想一想。</b><br>${fmt(hintOf(it,curQ().q))}<br>再試一次！`);
    }else{
      st.done=true; lockOpts();
      if(q.type==='tf'||q.type==='choice') area.querySelectorAll('.opt').forEach(b=>{if(b.dataset.o===q.ans) b.classList.add('right')});
      if(q.type==='check') area.querySelectorAll('.opt').forEach(b=>{if(q.ans.includes(b.dataset.o)) b.classList.add('right')});
      record(it,false);
      if(it.bank) RUN.state.added=addFromBank(it,v);
      finishCard(false);
    }
  }
}
function addFromBank(b,v){
  if(DB.items.some(i=>i.fromBank===b.id)) return false;
  const stu=Array.isArray(v)?'選了：'+v.join('、'):(b.type==='num'?String(v)+(b.u?' '+b.u:''):String(v));
  const n={id:uid(),fromBank:b.id,s:b.s,c:b.c,unit:CONCEPTS[b.c]||'',exam:'練習時答錯的新題目',date:today(),type:b.type,q:b.q,opts:b.opts,ans:b.ans,u:b.u,fig:b.fig,stu,cause:'概念不懂',exp:b.exp,hint:b.hint,hist:[],mastered:false,streak:0,photos:[]};
  DB.items.unshift(n); save(); return true;
}
function lockOpts(){ $('#q-area').querySelectorAll('.opt,#q-submit,#q-num').forEach(b=>b.disabled=true); }
function revealWrite(){
  const {it,q}=curQ();
  $('#q-area').innerHTML=`<div class="answerbox ok"><div class="muted small">正確答案</div><div class="bigans">${fmt(q.ans)}</div></div>
    <div class="exp">${fmt(it.exp||'')}</div>
    <p style="margin:14px 0 6px">和你寫的對照看看，每一筆都一樣嗎？</p>
    <div class="actions" style="margin-top:4px"><button class="btn ok" id="w-ok">我寫對了</button><button class="btn" id="w-bad">有寫錯，我再練習</button></div>`;
  $('#w-ok').onclick=()=>{record(it,true);RUN.state.done=true;finishCard(true,true)};
  $('#w-bad').onclick=()=>{record(it,false);RUN.state.done=true;finishCard(false,true)};
}
function record(it,ok){
  it.hist.push({t:Date.now(),ok});
  it.streak=ok?(it.streak||0)+1:0;
  const need=2;
  const wasM=it.mastered; it.mastered=it.streak>=need;
  if(ok) RUN.ok++;
  save();
  if(it.mastered&&!wasM) setTimeout(()=>toast('🎉 這題已克服！'),300);
}
function finishCard(ok,isWrite){
  const {e,it,q}=curQ();
  const praise=['答對了！','好厲害！','完全正確！','你有仔細看喔！'][Math.floor(Math.random()*4)];
  let html='';
  if(!isWrite){
    html+= ok? pigSay(`<b>${RUN.state.tries>1?'第二次答對了！有用心想喔。':praise}</b>${it.mastered?' 這題已經克服了！':''}`)
             : pigSay(`沒關係，我們一起看答案。<b>錯了才知道哪裡要加強！</b>${RUN.state.added?'<br>這題已經收進錯題本，下次再挑戰。':''}`);
    html+=`<div class="answerbox ${ok?'ok':'bad'}"><div class="muted small">正確答案</div><div style="font-size:20px;font-weight:600">${fmt(ansText(q))}</div></div>`;
    if(!q.isVariant&&it.exp) html+=`<div class="exp">${fmt(it.exp)}</div>`;
  }else{
    html+= pigSay(ok?`<b>${praise}</b>`:'寫錯沒關係，把正確的字再寫三次，下次就會了！');
  }
  const canVar= ok && it.v && !e.variant && !RUN.queue.some((x,i)=>i>RUN.idx&&x.id===it.id&&x.variant);
  html+=`<div class="actions">${canVar?'<button class="btn" id="q-var">換數字再挑戰一題</button>':''}<button class="btn pri" id="q-next">${RUN.idx+1>=RUN.queue.length&&!canVar?'完成':'下一題'} →</button></div>`;
  $('#q-res').innerHTML=html;
  if(e.variant&&q.isVariant){ /* show variant explanation note */ }
  $('#q-help').querySelector('#q-hint')?.remove();
  if(canVar) $('#q-var').onclick=()=>{RUN.queue.splice(RUN.idx+1,0,{id:it.id,variant:true});RUN.idx++;renderQ()};
  $('#q-next').onclick=()=>{RUN.idx++;renderQ()};
  $('#q-res').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderEnd(){
  const total=RUN.queue.length, ok=RUN.ok;
  $('#p-run').innerHTML=`<div class="card" style="margin-top:14px;text-align:center">
    <svg viewBox="0 0 64 64" width="110" height="110"><use href="#pigface"/></svg>
    <h2 style="margin-top:6px">練習完成！</h2>
    <p style="font-size:19px">這次 ${total} 題，第一次就答對 <b style="color:var(--ok)">${ok}</b> 題。</p>
    <p class="muted">答對兩次的題目會變成「已克服」。明天再來破案吧！</p>
    <div class="actions" style="justify-content:center"><button class="btn pri" id="e-home">回練習首頁</button></div></div>`;
  $('#e-home').onclick=()=>{RUN=null;renderPracticeHome()};
}
/* chat with 豬探長 */
function openChat(){
  const box=$('#q-chatbox');
  if(box.innerHTML){box.innerHTML='';return}
  box.innerHTML=`<div class="chat"><div id="c-msgs"></div>
    <div class="row" style="margin-top:8px"><input class="t" id="c-in" placeholder="跟豬探長說你的想法…" style="flex:1"><button class="btn pri" id="c-send">送出</button></div></div>`;
  const draw=()=>{$('#c-msgs').innerHTML=RUN.chat.map(m=>`<div class="msg ${m.role==='user'?'me':'pg'}">${esc(m.text)}</div>`).join('')};
  const send=async(text)=>{
    const {it,q}=curQ();
    if(text) RUN.chat.push({role:'user',text});
    draw(); $('#c-msgs').insertAdjacentHTML('beforeend','<div class="msg pg"><span class="spin"></span></div>');
    const sys=DB.settings.prompts.pig+`\n\n【這一題的資料（只給你看，不可以直接說出正確答案）】\n${ctxLine(it.s)}\n${itemBrief(q)}\nCassie 上次考試的答案：${plain(it.stu||'')}\n錯因：${it.cause||''}`;
    const hist=RUN.chat.length?RUN.chat.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]})):[{role:'user',parts:[{text:'（Cassie 打開了這一題，請你用一句話打招呼，然後問她「你覺得呢？」）'}]}];
    try{const r=await gemini(null,{system:sys,history:hist});RUN.chat.push({role:'model',text:r.trim()})}
    catch(err){RUN.chat.push({role:'model',text:'豬探長暫時連不上線：'+err.message})}
    draw(); $('#c-msgs').lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  $('#c-send').onclick=()=>{const v=$('#c-in').value.trim();if(!v)return;$('#c-in').value='';send(v)};
  $('#c-in').onkeydown=ev=>{if(ev.key==='Enter'&&!ev.isComposing)$('#c-send').click()};
  send(null);
}

/* ================= BOOK ================= */
function renderBook(){
  const ui=uiGet(); const subj=ui.bSubj&&subjNames().concat('全部').includes(ui.bSubj)?ui.bSubj:'全部';
  const cause=ui.bCause||'全部', state=ui.bState||'todo', unit=ui.bUnit||'全部';
  $('#b-subj').innerHTML=['全部',...subjNames()].map(s=>`<button class="chip ${s===subj?'on':''}" data-s="${esc(s)}">${esc(s)}（${DB.items.filter(i=>s==='全部'||i.s===s).length}）</button>`).join('');
  $('#b-subj').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{uiSet({bSubj:b.dataset.s,bUnit:'全部'});renderBook()});
  const inSubj=DB.items.filter(i=>subj==='全部'||i.s===subj);
  const units=[...new Set(inSubj.map(i=>i.unit).filter(Boolean))];
  $('#b-unit').innerHTML=['全部',...units].map(u=>`<option ${u===unit?'selected':''} value="${esc(u)}">${u==='全部'?'全部單元':esc(u)}</option>`).join('');
  $('#b-unit').onchange=e=>{uiSet({bUnit:e.target.value});renderBook()};
  $('#b-state').value=state; $('#b-state').onchange=e=>{uiSet({bState:e.target.value});renderBook()};
  $('#b-cause').innerHTML=['全部',...CAUSES].map(c=>`<button class="chip ${c===cause?'on':''}" data-c="${c}">${c==='全部'?'全部錯因':c}</button>`).join('');
  $('#b-cause').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{uiSet({bCause:b.dataset.c});renderBook()});
  // stats
  const base=inSubj.filter(i=>unit==='全部'||i.unit===unit);
  const max=Math.max(1,...CAUSES.map(c=>base.filter(i=>i.cause===c).length));
  $('#b-stats').innerHTML=`<div class="small muted" style="margin-top:10px">錯因統計（${esc(subj)}${unit!=='全部'?'・'+esc(unit):''}，共 ${base.length} 題，已克服 ${base.filter(i=>i.mastered).length} 題）</div>`+
    CAUSES.map(c=>{const n=base.filter(i=>i.cause===c).length;return `<div class="sb"><span>${c}</span><span class="bar"><i style="width:${n/max*100}%;background:${CAUSE_COLOR[c]}"></i></span><span>${n}</span></div>`}).join('');
  drawItems();
  $('#b-q').oninput=drawItems;
}
function drawItems(){

  const list=DB.items.filter(i=>(subj==='全部'||i.s===subj)&&(unit==='全部'||i.unit===unit)&&(cause==='全部'||i.cause===cause)&&(state==='all'||(state==='done')===!!i.mastered)&&(!kw||plain(i.q).includes(kw)));

  box.innerHTML=list.map(it=>{
    const okN=it.hist.filter(h=>h.ok).length, n=it.hist.length;

      <div class="row"><span class="tag">${esc(it.s)}</span><span class="tag">${esc(it.unit||'')}</span>${it.c&&CONCEPTS[it.c]&&CONCEPTS[it.c]!==it.unit?`<span class="tag">${esc(CONCEPTS[it.c])}</span>`:''}<span class="tag c-${esc(it.cause)}">${esc(it.cause||'未分類')}</span>${it.mastered?'<span class="tag done">已克服</span>':''}<span class="sp"></span><span class="small muted">${esc(it.date||'')}</span></div>

      <dl class="ab"><dt>她的答案</dt><dd class="stu">${fmt(it.stu||'—')}</dd><dt>正確答案</dt><dd class="cor">${fmt(ansText(it))}</dd></dl>
      ${it.exp?`<div class="exp">${fmt(it.exp)}</div>`:''}

      <details class="more"><summary>更多：提示、考卷、練習紀錄${it.v?'、換數字題':''}</summary>
        <div class="small" style="margin-top:6px"><b>豬探長提示：</b>${fmt(it.hint||'—')}</div>
        <div class="small"><b>考卷：</b>${esc(it.exam||'—')}</div>
        <div class="small"><b>練習：</b>${n?`${n} 次，答對 ${okN} 次，目前連續答對 ${it.streak||0} 次`:'還沒練習'}</div>
        ${it.v?`<div class="small"><b>換數字題：</b>${fmt(it.v.q)}（答案：${fmt(ansText(it.v))}）</div>`:''}
      </details>
      <div class="toolbar">
        <select class="t" data-act="cause" style="max-width:150px;min-height:36px;padding:4px 10px">${CAUSES.map(c=>`<option ${c===it.cause?'selected':''}>${c}</option>`).join('')}</select>
        <button class="btn sm" data-act="edit">編輯</button>
        <button class="btn sm" data-act="diag">AI 診斷</button>
        ${it.photos&&it.photos.length?'<button class="btn sm" data-act="photo">看照片</button>':''}
        <button class="btn sm" data-act="toggle">${it.mastered?'改回待練習':'標記已克服'}</button>
        <span class="sp"></span>
        <button class="btn sm ghost" data-act="del" style="color:var(--bad)">刪除</button>
      </div>
    </div>`}).join('');
  box.querySelectorAll('.item').forEach(card=>{
    const it=DB.items.find(i=>i.id===card.dataset.id);
    card.querySelector('[data-act="cause"]').onchange=e=>{it.cause=e.target.value;save();renderBook()};
    card.querySelector('[data-act="edit"]').onclick=()=>openEditor(it);
    card.querySelector('[data-act="toggle"]').onclick=()=>{it.mastered=!it.mastered;if(!it.mastered)it.streak=0;save();renderBook()};
    card.querySelector('[data-act="del"]').onclick=()=>{if(confirm('確定要刪除這一題嗎？')){DB.items=DB.items.filter(x=>x!==it);(it.photos||[]).forEach(p=>idb.del(p));save();renderBook()}};
    card.querySelector('[data-act="diag"]').onclick=e=>diagnose(it,e.target);
    const ph=card.querySelector('[data-act="photo"]'); if(ph) ph.onclick=()=>showPhotos(it);
  });
}
async function diagnose(it,btn){
  if(!getKey()){toast('請先到「設定」填入 Gemini API Key');return}
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 診斷中';
  try{
    const r=await gemini([{text:`${ctxLine(it.s)}\n${itemBrief(it)}\n學生的答案：${plain(it.stu||'')}\n請診斷這一題。`}],{system:DB.settings.prompts.expert});
    it.diag=r.trim(); save(); renderBook(); toast('診斷完成，已存在題目下方');
  }catch(err){toast(err.message);btn.disabled=false;btn.textContent='AI 診斷'}
}
async function showPhotos(it){
  const imgs=await Promise.all((it.photos||[]).map(p=>idb.get(p)));

  $('#m-close').onclick=closeModal;
}

  <div class="grid2">

    <div><label class="f">她的答案</label><textarea class="t" id="${pfx}stu" style="min-height:60px">${esc(it.stu||'')}</textarea></div>
  </div>
  <div class="grid2"><div><label class="f">單位（填數字題用，例如 元、度）</label><input class="t" id="${pfx}u" value="${esc(it.u||'')}"></div><div><label class="f">考卷名稱</label><input class="t" id="${pfx}exam" value="${esc(it.exam||'')}"></div></div>
  <label class="f">說明（給家長看的精簡解析）</label><textarea class="t" id="${pfx}exp" style="min-height:70px">${esc(it.exp||'')}</textarea>
  <label class="f">豬探長提示（不能說出答案）</label><textarea class="t" id="${pfx}hint" style="min-height:60px">${esc(it.hint||'')}</textarea>`;
}
function readEditor(pfx,base){
  const g=k=>document.getElementById(pfx+k).value.trim();
  const type=g('type'); const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  let opts=lines(g('opts')); let ans=g('ans');
  if(type==='tf'){ans=/✗|x|X|×|錯|叉/.test(ans)?'✗':'○';opts=undefined}
  if(type==='check') ans=lines(ans);
  if(type==='num'||type==='write') opts=undefined;
  const it={...base,s:g('s'),unit:g('unit'),type,cause:g('cause'),q:g('q'),opts,ans,stu:g('stu'),u:g('u')||undefined,exam:g('exam'),exp:g('exp'),hint:g('hint')};
  if(!it.q) return [null,'題目不能空白'];
  if((type==='choice'||type==='check')&&(!opts||opts.length<2)) return [null,'選擇題至少要有兩個選項'];
  if(type==='choice'&&!opts.includes(ans)) return [null,'正確答案要和其中一個選項文字完全一樣'];
  if(type==='check'&&!ans.every(a=>opts.includes(a))) return [null,'勾選題的每個正確答案都要和選項文字一樣'];
  if(!it.ans||(Array.isArray(it.ans)&&!it.ans.length)) return [null,'請填正確答案'];
  return [it,null];
}
function openEditor(it){
  openModal(`<div class="row"><h3 style="margin:0">${it?'編輯錯題':'新增錯題'}</h3><span class="sp"></span><button class="btn sm" id="m-close">取消</button></div>${editorHTML(it||{s:subjNames()[0],type:'choice',cause:CAUSES[0]},'e-')}
    <div class="actions"><button class="btn pri" id="m-save">儲存</button></div>`);
  $('#m-close').onclick=closeModal;
  $('#m-save').onclick=()=>{
    const base=it||{id:uid(),date:today(),hist:[],mastered:false,streak:0,photos:[]};
    const [n,err]=readEditor('e-',base); if(err){toast(err);return}
    if(it){Object.assign(it,n)}else DB.items.unshift(n);
    save(); closeModal(); toast('已儲存'); if($('#v-book').classList.contains('on')) renderBook();
  };
}

d{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}\ntable.rank td.c{text-align:center;font-family:var(--f-display);font-size:16px;color:var(--teal);white-space:nowrap}\ntable.rank td.x{color:var(--red);font-size:13px;white-space:nowrap}\nol.q.cols{columns:2;column-gap:24px}\nol.q.cols li{break-inside:avoid}\n@media (max-width:640px){ol.q.cols{columns:1}}\n.qh{font-family:var(--f-display);font-size:17px;margin:14px 0 2px;color:var(--teal)}\n.figrow{display:flex;gap:18px;flex-wrap:wrap}\n.figrow figure{margin:0;flex:1;min-width:200px}\n.figrow figcaption{font-size:14.5px}\n<\/style>\n<div class=\"wrap\">\n<header class=\"top\">\n  <h1>翰林數學 四上 期中必考重點<\/h1>\n  <p>從三份考卷（期中複習卷、學習卷「期中成績考查（1）（2）」、校用卷「期中成績考查」）找出最常出現的題型，再加上 Cassie 平時考錯過的地方。先看必考排行，再讀重點卡，最後寫模擬考卷。<\/p>\n  <nav class=\"units\"><a href=\"#u0\">必考排行<\/a><a href=\"#u1\">大數<\/a><a href=\"#u2\">乘法<\/a><a href=\"#u3\">角度<\/a><a href=\"#u4\">分數<\/a><a href=\"#u5\">公里<\/a><a href=\"#u6\">模擬考卷<\/a><\/nav>\n<\/header>\n\n<section class=\"unit\" id=\"u0\">\n<div class=\"uhead\"><span class=\"no\">先看這頁<\/span><h2>必考排行<\/h2><span class=\"note\">每份考卷都考的排前面；紅字是 Cassie 錯過的<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card wide\"><div class=\"bar\"><\/div><div class=\"in\">\n    <table class=\"rank top\">\n      <tr><th>題型<\/th><th>考卷怎麼考<\/th><th>出現<\/th><th>Cassie<\/th><\/tr>\n      <tr><td><b>鐘面轉動幾度<\/b><\/td><td>從某數字順時針或逆時針轉到另一數字；判斷「一格 30 度」「轉一個平角到哪裡」<\/td><td class=\"c\">4／4<\/td><td class=\"x\">錯過 6 題<\/td><\/tr>\n      <tr><td><b>假分數↔帶分數、比大小<\/b><\/td><td>互換 6～10 小題；帶分數和假分數比大小；數線找分數<\/td><td class=\"c\">4／4<\/td><td class=\"x\">錯過 7 題<\/td><\/tr>\n      <tr><td><b>公里公尺應用題<\/b><\/td><td>路線圖相加、還剩多少（向公里借 1000）、兩段相差<\/td><td class=\"c\">4／4<\/td><td class=\"x\">錯過 3 題<\/td><\/tr>\n      <tr><td><b>大數讀寫、位值<\/b><\/td><td>「記作」「讀作」；某個數字代表多少；按順序填數列<\/td><td class=\"c\">4／4<\/td><td class=\"x\">錯過 6 題<\/td><\/tr>\n      <tr><td><b>量角、角的種類<\/b><\/td><td>量出角度再判斷銳角、鈍角；畫指定角度；兩角相加或相差<\/td><td class=\"c\">4／4<\/td><td class=\"x\">錯過 4 題<\/td><\/tr>\n      <tr><td><b>乘法直式<\/b><\/td><td>三位數 × 二位數、末尾有 0（275×24、336×250）<\/td><td class=\"c\">4／4<\/td><td class=\"x\">錯過 2 題<\/td><\/tr>\n      <tr><td><b>乘法湊整<\/b><\/td><td>90×51 看成 90×50 加 1 個 90；108×199 比 108×200 少 1 個 108<\/td><td class=\"c\">4／4<\/td><td class=\"x\">錯過 2 題<\/td><\/tr>\n      <tr><td><b>長度比大小、選單位<\/b><\/td><td>8005m ＝ 8km5m；填公里、公尺或公分<\/td><td class=\"c\">4／4<\/td><td class=\"x\">錯過 2 題<\/td><\/tr>\n      <tr><td><b>五位數加減直式<\/b><\/td><td>直式計算，含連續退位；萬為單位的加減<\/td><td class=\"c\">4／4<\/td><td><\/td><\/tr>\n      <tr><td><b>看圖求 ∠A<\/b><\/td><td>直線上（180 減）、一圈（360 減）、直角加角<\/td><td class=\"c\">3／4<\/td><td class=\"x\">錯過 1 題<\/td><\/tr>\n      <tr><td><b>錢、表格應用題<\/b><\/td><td>幾張千元加幾張百元；營收表求合計與相差<\/td><td class=\"c\">3／4<\/td><td class=\"x\">錯過 3 題<\/td><\/tr>\n    <\/table>\n    <p class=\"small\" style=\"font-size:12.5px;color:var(--ink2);margin:8px 0 0\">「出現」是在四份期中卷中出現的次數：期中複習卷、學習卷期中（1）、學習卷期中（2）、校用卷期中成績考查。<\/p>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u1\">\n<div class=\"uhead\"><span class=\"no\">重點卡 1–2<\/span><h2>一億以內的數、加減<\/h2><span class=\"note\">第 1 單元<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>讀寫：<b>四位一節<\/b>，中間的 0 要讀<\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <table class=\"pv\"><tr><th>千萬<\/th><th>百萬<\/th><th>十萬<\/th><th>萬<\/th><th>千<\/th><th>百<\/th><th>十<\/th><th>個<\/th><\/tr>\n      <tr><td class=\"wan\">4<\/td><td class=\"wan\">6<\/td><td class=\"wan\">0<\/td><td class=\"wan\">9<\/td><td class=\"cut\">0<\/td><td>7<\/td><td>0<\/td><td>2<\/td><\/tr><\/table>\n    <div class=\"box\">4609｜0702 → 四千六百零九萬<b>零七百零二<\/b>（「零七零二」是錯的）<\/div>\n    <ul class=\"pts\">\n      <li>「六千零三萬零四十五」→ 6003｜0045 → <b>60030045<\/b>（八位數）<\/li>\n      <li>「4703162」中的 7 在十萬位 → 代表 <b>700000<\/b><\/li>\n      <li>「3890 萬再加 1 個十萬」→ 3900 萬 → 39000000<\/li>\n    <\/ul>\n    <div class=\"tip\">寫完數一數位數：「幾千萬」一定是<b>八位數<\/b>。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>數列、比大小、加減直式<\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <ul class=\"pts\">\n      <li>數列先找<b>哪一位在變<\/b>、一次變多少：882670 → 881670 → 880670 → <b>879670<\/b>（千位往下借）<\/li>\n      <li>比大小：先比位數，再從最高位一位一位比<\/li>\n      <li>「三千七百萬零六」→ 37000006，比 3700006 <b>多一位<\/b><\/li>\n      <li>加減直式：位數對齊，連續退位要記得劃掉、補 10<\/li>\n      <li>萬為單位：379 萬 ＋ 26 萬 8000 ＝ 405 萬 8000<\/li>\n    <\/ul>\n    <div class=\"tip\">錢：30 張千元 ＋ 12 張百元 ＝ 30000 ＋ <b>1200<\/b> ＝ 31200<\/div>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u2\">\n<div class=\"uhead\"><span class=\"no\">重點卡 3<\/span><h2>乘法<\/h2><span class=\"note\">第 2 單元<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>直式和末尾 0：<b>先乘，再補 0<\/b><\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <svg viewBox=\"0 0 250 170\" aria-label=\"336 乘 250 直式\">\n      <g font-size=\"21\" text-anchor=\"end\" fill=\"currentColor\" style=\"font-variant-numeric:tabular-nums\">\n        <text x=\"170\" y=\"26\">3 3 6<\/text><text x=\"170\" y=\"52\">×　2 5 0<\/text>\n        <line x1=\"70\" y1=\"62\" x2=\"180\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"2\"/>\n        <text x=\"157\" y=\"88\">1 6 8 0<\/text><text x=\"144\" y=\"114\">6 7 2<\/text>\n        <line x1=\"70\" y1=\"124\" x2=\"180\" y2=\"124\" stroke=\"currentColor\" stroke-width=\"2\"/>\n        <text x=\"170\" y=\"150\" fill=\"#2A9D8F\" font-weight=\"700\">8 4 0 0 0<\/text><\/g>\n      <g font-size=\"11.5\" fill=\"#7D8C90\"><text x=\"186\" y=\"88\">336×5（先不看 0）<\/text><text x=\"186\" y=\"114\">336×2<\/text><text x=\"186\" y=\"150\">最後補 1 個 0<\/text><\/g>\n    <\/svg>\n    <ul class=\"pts\">\n      <li>225×4 ＝ 900 → 225×40 ＝ 9000 → 225×400 ＝ 90000<\/li>\n      <li>「5000×20」＝ 100000 → 答案有 <b>5<\/b> 個 0（5×2＝10 又多一個 0）<\/li>\n    <\/ul>\n    <div class=\"tip\">算完把答案和算式結果<b>一位一位對<\/b>，0 的個數要數清楚。<\/div>\n  <\/div><\/article>\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3 延伸<\/div>\n    <h3>湊整：<b>多 1 個加，少 1 個減<\/b><\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <div class=\"box mono\">46×51 ＝ 46×50 ＋ <b>46<\/b> ＝ 2300 ＋ 46 ＝ 2346<\/div>\n    <div class=\"box mono\">108×199 ＝ 108×200 － <b>108<\/b>（少 1 個 108）<\/div>\n    <div class=\"box mono\">275×38 ＝ 275×8 ＋ 275×<b>30<\/b> ＝ 2200 ＋ 8250<\/div>\n    <div class=\"tip\">加減的是「被乘的那個數」（46、108），<b>不是<\/b> 51 或 199。<br>直式第二行是 ×30，不是 ×3（學習卷「小多」就是錯在這裡）。<\/div>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u3\">\n<div class=\"uhead\"><span class=\"no\">重點卡 4–6<\/span><h2>角度<\/h2><span class=\"note\">第 3 單元<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 4<\/div>\n    <h3>鐘面：<b>一大格 30°<\/b>，先圈方向<\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯最多<\/span><\/div>\n    <div class=\"two\"><div id=\"clk1\"><\/div><div id=\"clk2\"><\/div><\/div>\n    <ul class=\"pts\">\n      <li><b>順時針<\/b>：和時鐘指針一樣的方向；<b>逆時針<\/b>：相反方向<\/li>\n      <li>從 11 逆時針轉到 4：11→10→…→4，7 格 ＝ <b>210°<\/b><\/li>\n      <li>從 12 順時針轉到 2：2 格 ＝ <b>60°<\/b><\/li>\n      <li>轉一個<b>平角<\/b>（180°）＝ 6 格：從 5 順時針轉 6 格到 <b>11<\/b><\/li>\n    <\/ul>\n    <div class=\"tip\">用手指在鐘面上一格一格數，<b>不要只用兩個數字相減<\/b>（方向不同答案就不同）。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 5<\/div>\n    <h3>量角器和角的種類<\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <div id=\"prot\"><\/div>\n    <ul class=\"pts\">\n      <li>量角器內圈、外圈都是 <b>0°～180°<\/b><\/li>\n      <li>中心點對頂點、0 度線對一邊，<b>從哪圈 0 開始就看哪圈<\/b><\/li>\n      <li>銳角 ＜ 90° ＝ 直角 ＜ 鈍角 ＜ 180° ＝ 平角；周角 360°<\/li>\n      <li>量完先估：看起來比直角小，就不可能是 140°<\/li>\n    <\/ul>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 6<\/div>\n    <h3>看圖求 ∠A：<b>直線 180、一圈 360<\/b><\/h3>\n    <div class=\"src\"><span>學習卷<\/span><span>校用卷<\/span><\/div>\n    <div id=\"sum\"><\/div>\n    <ul class=\"pts\">\n      <li>和 ∠B 拼成一直線：∠A ＝ 180 － ∠B<\/li>\n      <li>和 ∠D 拼成一圈：∠A ＝ 360 － ∠D<\/li>\n      <li>直角加 ∠C：∠A ＝ 90 ＋ ∠C<\/li>\n      <li>三個角拼成一圈：∠A ＝ 360 － 另外兩個角<\/li>\n    <\/ul>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u4\">\n<div class=\"uhead\"><span class=\"no\">重點卡 7–8<\/span><h2>假分數與帶分數<\/h2><span class=\"note\">第 4 單元<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 7<\/div>\n    <h3>互換：<b>除法和乘法<\/b><\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <div class=\"box\">假 → 帶：<span class=\"fr\"><span class=\"nd\"><span>83<\/span><span>10<\/span><\/span><\/span> → 83 ÷ 10 ＝ 8 … 3 → <span class=\"fr\">8<span class=\"nd\"><span>3<\/span><span>10<\/span><\/span><\/span><\/div>\n    <div class=\"box\">帶 → 假：<span class=\"fr\">7<span class=\"nd\"><span>5<\/span><span>6<\/span><\/span><\/span> → 7 × 6 ＋ 5 ＝ 47 → <span class=\"fr\"><span class=\"nd\"><span>47<\/span><span>6<\/span><\/span><\/span><\/div>\n    <ul class=\"pts\">\n      <li>剛好除盡 → 整數：<span class=\"fr\"><span class=\"nd\"><span>81<\/span><span>9<\/span><\/span><\/span> ＝ 9、<span class=\"fr\"><span class=\"nd\"><span>18<\/span><span>8<\/span><\/span><\/span> 不是整數 ＝ 2<span class=\"fr\"><span class=\"nd\"><span>2<\/span><span>8<\/span><\/span><\/span><\/li>\n      <li><span class=\"fr\"><span class=\"nd\"><span>9<\/span><span>9<\/span><\/span><\/span>、<span class=\"fr\"><span class=\"nd\"><span>7<\/span><span>4<\/span><\/span><\/span> 是<b>假分數<\/b>；真分數是分子比分母小<\/li>\n      <li>和 3 一樣大：<span class=\"fr\"><span class=\"nd\"><span>6<\/span><span>2<\/span><\/span><\/span>（分子是分母的 3 倍）<\/li>\n    <\/ul>\n    <div class=\"tip\">分母不變。乘完<b>一定要加分子<\/b>。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 8<\/div>\n    <h3>比大小和數線：<b>換成同一種<\/b><\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <div id=\"nl\"><\/div>\n    <ul class=\"pts\">\n      <li>帶分數 vs 假分數：<span class=\"fr\">2<span class=\"nd\"><span>3<\/span><span>9<\/span><\/span><\/span> ＝ <span class=\"fr\"><span class=\"nd\"><span>21<\/span><span>9<\/span><\/span><\/span> ＞ <span class=\"fr\"><span class=\"nd\"><span>20<\/span><span>9<\/span><\/span><\/span><\/li>\n      <li>整數 vs 假分數：6 ＝ <span class=\"fr\"><span class=\"nd\"><span>48<\/span><span>8<\/span><\/span><\/span> ＜ <span class=\"fr\"><span class=\"nd\"><span>49<\/span><span>8<\/span><\/span><\/span><\/li>\n      <li>兩個帶分數：<b>先比整數<\/b>，一樣再比分子<\/li>\n      <li>應用題「誰吃得多」：換成同一種再比，答案寫<b>人名<\/b><\/li>\n    <\/ul>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u5\">\n<div class=\"uhead\"><span class=\"no\">重點卡 9–10<\/span><h2>公里<\/h2><span class=\"note\">第 5 單元<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 9<\/div>\n    <h3>換算和選單位：<b>1 公里 ＝ 1000 公尺<\/b><\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <ul class=\"pts mono\">\n      <li>8005 m ＝ 8 km 5 m（不是 800 km 5 m）<\/li>\n      <li>8 公里 40 公尺 ＝ 80<b>4<\/b>0 公尺；8 公里 4 公尺 ＝ 800<b>4<\/b> 公尺<\/li>\n      <li>112 公里 5 公尺 ＝ 112005 公尺 ＞ 11205 公尺<\/li>\n    <\/ul>\n    <table class=\"rank\">\n      <tr><th>用公分<\/th><th>用公尺<\/th><th>用公里<\/th><\/tr>\n      <tr><td>身高、書櫃、尺、地磚<\/td><td>操場一圈、大樓、山高<\/td><td>城市到城市、河流、馬拉松<\/td><\/tr>\n    <\/table>\n    <div class=\"tip\">臺北 101 高 508 <b>公尺<\/b>，不是公里（常考的單位錯誤）。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 10<\/div>\n    <h3>應用題：<b>公里對公里、公尺對公尺<\/b><\/h3>\n    <div class=\"src\"><span>複習卷<\/span><span>學習卷<\/span><span>校用卷<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <svg viewBox=\"0 0 280 110\" aria-label=\"公里公尺借位直式\">\n      <g font-size=\"13\" fill=\"#7D8C90\"><text x=\"60\" y=\"14\">公里<\/text><text x=\"150\" y=\"14\">公尺<\/text><\/g>\n      <g font-size=\"12\" fill=\"#E0584B\"><text x=\"68\" y=\"32\">2<\/text><text x=\"146\" y=\"32\">1600<\/text><\/g>\n      <g font-size=\"20\" fill=\"currentColor\" style=\"font-variant-numeric:tabular-nums\">\n        <text x=\"66\" y=\"56\">3<\/text><text x=\"146\" y=\"56\">600<\/text>\n        <text x=\"40\" y=\"82\">－<\/text><text x=\"146\" y=\"82\">900<\/text>\n        <line x1=\"40\" y1=\"90\" x2=\"200\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n        <text x=\"66\" y=\"108\" fill=\"#2A9D8F\">2<\/text><text x=\"146\" y=\"108\" fill=\"#2A9D8F\">700<\/text><\/g>\n      <line x1=\"62\" y1=\"52\" x2=\"80\" y2=\"38\" stroke=\"#E0584B\" stroke-width=\"2\"/>\n      <text x=\"210\" y=\"56\" font-size=\"11.5\" fill=\"#E0584B\">公尺不夠減<\/text><text x=\"210\" y=\"72\" font-size=\"11.5\" fill=\"#E0584B\">向公里借 1<\/text><text x=\"210\" y=\"88\" font-size=\"11.5\" fill=\"#E0584B\">＝1000 公尺<\/text>\n    <\/svg>\n    <ul class=\"pts\">\n      <li>「經過…再到」→ 兩段<b>相加<\/b><\/li>\n      <li>「還要走多遠」「相差多少」→ <b>相減<\/b><\/li>\n      <li>「A 比 B 少 1 公里 200 公尺」→ 先想誰多：問 A 就減<\/li>\n    <\/ul>\n    <div class=\"tip\">直接走比繞路<b>短<\/b>，所以要用繞路的距離減掉。<\/div>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u6\">\n<div class=\"uhead\"><span class=\"no\">模擬考卷<\/span><h2>期中模擬考<\/h2><span class=\"note\">依四份期中卷常見題型改寫<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card quiz wide\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"qh\">一、選擇題<\/div>\n    <ol class=\"q cols\">\n      <li>（　）40 張 1000 元和 15 張 100 元，共有多少元？①40015 ②40150 ③41500 ④401500<\/li>\n      <li>（　）「6083215」中，8 代表多少？①8000 ②80000 ③800000 ④8000000<\/li>\n      <li>（　）「3000×40」的答案有幾個 0？①3 個 ②4 個 ③5 個 ④6 個<\/li>\n      <li>（　）已知 57×40＝2280，哪一個算式可算出 57×41？①2280＋57 ②2280－57 ③2280＋41 ④2280－41<\/li>\n      <li>（　）下面哪一個和「4」一樣大？①4/4 ②8/4 ③16/4 ④12/4<\/li>\n      <li>（　）哪一個和「6 公里 50 公尺」一樣長？①6500m ②6050m ③6005m ④5060m<\/li>\n      <li>（　）哪一個長度單位是<b>錯誤<\/b>的？①一本書厚 2 公分 ②臺北到高雄約 350 公尺 ③教室長 9 公尺 ④操場一圈 200 公尺<\/li>\n      <li>（　）量角器內圈和外圈的刻度範圍是？①0°～90° ②0°～100° ③0°～180° ④0°～360°<\/li>\n    <\/ol>\n    <div class=\"qh\">二、填填看<\/div>\n    <ol class=\"q cols\" start=\"9\">\n      <li>「七千零四萬六百」記作（　　　　　）。<\/li>\n      <li>52083006 讀作（　　　　　　　　　　）。<\/li>\n      <li>「4380 萬再加 1 個十萬」是（　　）萬，記作（　　　　　）。<\/li>\n      <li>按順序填：905300、904300、（　　　）、（　　　）。<\/li>\n      <li>34×199 比 34×200 少（　）個 34；34×199＝（　　）。<\/li>\n      <li>80×61 可以看成 80×60 和 1 個（　）合起來，是（　　）。<\/li>\n      <li>250×40＝（　　　），250×400＝（　　　）。<\/li>\n      <li>量角器外圈刻度 20 和外圈刻度 95 的兩條線，夾角是（　）度。<\/li>\n      <li>時針從 1「順時針」轉到 6，轉了（　）度；從 1「逆時針」轉到 6，轉了（　）度。<\/li>\n      <li>分針從 12 順時針轉了一個平角，會停在數字（　）。<\/li>\n    <\/ol>\n    <div class=\"qh\">三、寫成直式算算看<\/div>\n    <ol class=\"q cols\" start=\"19\">\n      <li>64083 ＋ 29758<\/li>\n      <li>70215 － 38647<\/li>\n      <li>486 × 37<\/li>\n      <li>305 × 240<\/li>\n      <li>2468 萬 3500 － 1379 萬 6800<\/li>\n    <\/ol>\n    <div class=\"qh\">四、看圖求 ∠A<\/div>\n    <div class=\"figrow\" id=\"angq\"><\/div>\n    <div class=\"qh\">五、假分數與帶分數<\/div>\n    <ol class=\"q cols\" start=\"27\">\n      <li>29/6 ＝（　　）　　47/9 ＝（　　）<\/li>\n      <li>6 又 3/8 ＝（　　）　　9 又 2/5 ＝（　　）<\/li>\n      <li>比大小填 ＞、＜、＝：3 又 4/7 ○ 26/7<\/li>\n      <li>比大小：5 ○ 41/8<\/li>\n      <li>比大小：47/9 ○ 5 又 2/9<\/li>\n      <li>7/4、2 又 1/4、13/4 中，哪一個比 2 大、比 3 小？<\/li>\n    <\/ol>\n    <div class=\"qh\">六、是非題（鐘面，對的畫○，錯的畫✕）<\/div>\n    <ol class=\"q cols\" start=\"33\">\n      <li>（　）和鐘面指針旋轉方向相反，叫做逆時針方向。<\/li>\n      <li>（　）鐘面上指針轉一大格是 30 度。<\/li>\n      <li>（　）指針從 5 順時針轉到 8，轉了 60 度。<\/li>\n      <li>（　）指針從 3 順時針轉到 9，剛好轉了一個平角。<\/li>\n    <\/ol>\n    <div class=\"qh\">七、應用題（寫算式和答案）<\/div>\n    <ol class=\"q\" start=\"37\">\n      <li>小美跑了 4 公里 250 公尺，比小強<b>少<\/b>跑 860 公尺。小強跑了幾公里幾公尺？<\/li>\n      <li>步道全長 6 公里，弟弟已經走了 2 公里 480 公尺，還要走幾公里幾公尺？<\/li>\n      <li>甲地到乙地 38 公里 450 公尺，乙地到丙地 27 公里 800 公尺。從甲地經過乙地到丙地，共幾公里幾公尺？兩段路相差幾公里幾公尺？<\/li>\n      <li>公司 7 月營收 168 萬 2400 元，8 月營收 231 萬 9800 元。兩個月共收入幾元？8 月比 7 月多幾元？<\/li>\n      <li>一顆鳳梨賣 75 元，農場有 268 顆，全部賣完可以賣得幾元？<\/li>\n      <li>大雄吃了 2 又 4/9 盒餅乾，小夫吃了 23/9 盒，誰吃得比較多？<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>③<\/li><li>②<\/li><li>②（120000）<\/li><li>①<\/li><li>③<\/li><li>②<\/li><li>②（應是公里）<\/li><li>③<\/li>\n      <li>70040600<\/li><li>五千二百零八萬三千零六<\/li><li>4390 萬，43900000<\/li><li>903300、902300<\/li><li>1；6766<\/li><li>80；4880<\/li><li>10000；100000<\/li><li>75<\/li><li>150；210<\/li><li>6<\/li>\n      <li>93841<\/li><li>31568<\/li><li>17982<\/li><li>73200<\/li><li>1088 萬 6700<\/li>\n      <li>62°（180－118）<\/li><li>220°（360－140）<\/li><li>125°（90＋35）<\/li>\n      <li>4 又 5/6；5 又 2/9<\/li><li>51/8；47/5<\/li><li>＜（25/7）<\/li><li>＜（40/8）<\/li><li>＝<\/li><li>2 又 1/4<\/li>\n      <li>○<\/li><li>○<\/li><li>✕（3 格＝90 度）<\/li><li>○<\/li>\n      <li>4250＋860＝5110，5 公里 110 公尺（小強比較多，用加）<\/li><li>6000－2480＝3520，3 公里 520 公尺<\/li>\n      <li>66 公里 250 公尺；相差 10 公里 650 公尺<\/li><li>400 萬 2200 元；多 63 萬 7400 元<\/li><li>75×268＝20100 元<\/li><li>2 又 4/9＝22/9＜23/9，小夫<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<footer>依翰林版四年級上學期數學期中複習卷、學習卷期中成績考查（1）（2）、校用卷期中成績考查（第 1～5 單元）整理，模擬考題為改寫自編。<\/footer>\n<\/div>\n\n<script>\n(function(){\n  const C={ink:'currentColor',teal:'#2A9D8F',red:'#E0584B',blue:'#4A86C8'};\n  const P=(cx,cy,r,d)=>[cx+r*Math.cos(d*Math.PI/180), cy-r*Math.sin(d*Math.PI/180)];\n  const f=n=>n.toFixed(1);\n  function arc(cx,cy,r,a0,a1,col,w,dash){const st=a1>a0?3:-3;const pts=[];for(let a=a0;st>0?a<=a1:a>=a1;a+=st)pts.push(P(cx,cy,r,a));pts.push(P(cx,cy,r,a1));\n    return `<polyline fill=\"none\" stroke=\"${col}\" stroke-width=\"${w}\" ${dash?'stroke-dasharray=\"7 5\"':''} points=\"${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}\"/>`;}\n  function head(x,y,dir,col){const a=dir*Math.PI/180,b1=a+2.6,b2=a-2.6,s=10;return `<polygon fill=\"${col}\" points=\"${f(x)},${f(y)} ${f(x+s*Math.cos(b1))},${f(y-s*Math.sin(b1))} ${f(x+s*Math.cos(b2))},${f(y-s*Math.sin(b2))}\"/>`;}\n  const cd=n=>90-30*n;\n  function clock(from,to,cw,label){\n    const cx=80,cy=80,R=56;let s=`<svg viewBox=\"0 0 160 186\" aria-label=\"${label}\"><circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\" fill=\"none\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n    for(let n=1;n<=12;n++){const [x,y]=P(cx,cy,R-13,cd(n));s+=`<text x=\"${f(x)}\" y=\"${f(y+4.5)}\" font-size=\"12\" text-anchor=\"middle\" fill=\"${C.ink}\">${n}<\/text>`;}\n    const [hx,hy]=P(cx,cy,32,cd(from));s+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${f(hx)}\" y2=\"${f(hy)}\" stroke=\"${C.blue}\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"${cx}\" cy=\"${cy}\" r=\"3\" fill=\"${C.ink}\"/>`;\n    const a0=cd(from);let a1=cd(to);\n    if(cw){while(a1>a0)a1-=360;} else {while(a1<a0)a1+=360;}\n    s+=arc(cx,cy,R+10,a0,a1,C.red,2.5,true);const [ex,ey]=P(cx,cy,R+10,a1);s+=head(ex,ey,cw?a1-90:a1+90,C.red);\n    s+=`<text x=\"80\" y=\"180\" font-size=\"13\" text-anchor=\"middle\" fill=\"${C.red}\">${label}<\/text><\/svg>`;return s;}\n  document.getElementById('clk1').innerHTML=clock(11,4,false,'11 逆時針到 4：7 格');\n  document.getElementById('clk2').innerHTML=clock(11,4,true,'11 順時針到 4：5 格');\n\n  (function(){const cx=150,cy=140,R=125;let s=`<svg viewBox=\"0 0 300 165\" aria-label=\"量角器\">`;\n    s+=`<path d=\"M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy} Z\" fill=\"rgba(42,157,143,.08)\" stroke=\"${C.ink}\" stroke-width=\"1.8\"/>`;\n    for(let d=0;d<=180;d+=5){const L=d%10?5:9;const [x1,y1]=P(cx,cy,R,d),[x2,y2]=P(cx,cy,R-L,d);s+=`<line x1=\"${f(x1)}\" y1=\"${f(y1)}\" x2=\"${f(x2)}\" y2=\"${f(y2)}\" stroke=\"${C.ink}\" stroke-width=\"${d%10?.6:1.1}\"/>`;\n      if(d%30===0){const [x,y]=P(cx,cy,R-19,d);s+=`<text x=\"${f(x)}\" y=\"${f(y+4)}\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${C.ink}\">${180-d}<\/text>`;\n        const [a,b]=P(cx,cy,R-38,d);s+=`<text x=\"${f(a)}\" y=\"${f(b+3.5)}\" font-size=\"9\" text-anchor=\"middle\" fill=\"${C.blue}\">${d}<\/text>`;}}\n    const [rx,ry]=P(cx,cy,R+12,180-130);s+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${cx-R-12}\" y2=\"${cy}\" stroke=\"${C.red}\" stroke-width=\"3\"/><line x1=\"${cx}\" y1=\"${cy}\" x2=\"${f(rx)}\" y2=\"${f(ry)}\" stroke=\"${C.red}\" stroke-width=\"3\"/>`;\n    s+=arc(cx,cy,26,50,180,C.red,2)+`<text x=\"${cx-40}\" y=\"${cy-30}\" font-size=\"12\" fill=\"${C.red}\">130°（鈍角）<\/text><circle cx=\"${cx}\" cy=\"${cy}\" r=\"3\" fill=\"${C.ink}\"/>`;\n    s+=`<text x=\"150\" y=\"160\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"${C.ink}\">一邊對齊左邊 0 → 看黑字外圈<\/text>`;\n    document.getElementById('prot').innerHTML=s+'<\/svg>';})();\n\n  function lineAngle(B,label,showA){const cx=110,cy=90;let s=`<svg viewBox=\"0 0 220 120\" aria-label=\"${label}\"><line x1=\"10\" y1=\"${cy}\" x2=\"210\" y2=\"${cy}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n    const [x,y]=P(cx,cy,80,B);s+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${f(x)}\" y2=\"${f(y)}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n    s+=arc(cx,cy,20,0,B,C.blue,2)+arc(cx,cy,26,B,180,C.red,2);\n    const [bx,by]=P(cx,cy,38,B/2),[ax,ay]=P(cx,cy,42,(B+180)/2);\n    s+=`<text x=\"${f(bx)}\" y=\"${f(by+4)}\" font-size=\"13\" fill=\"${C.blue}\" text-anchor=\"middle\">${label}<\/text><text x=\"${f(ax)}\" y=\"${f(ay+4)}\" font-size=\"14\" fill=\"${C.red}\" text-anchor=\"middle\">A<\/text><\/svg>`;return s;}\n  function roundAngle(D,label){const cx=110,cy=70;let s=`<svg viewBox=\"0 0 220 140\" aria-label=\"一圈\"><line x1=\"${cx}\" y1=\"${cy}\" x2=\"10\" y2=\"${cy}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n    const [x,y]=P(cx,cy,90,180-D);s+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${f(x)}\" y2=\"${f(y)}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n    s+=arc(cx,cy,20,180-D,180,C.blue,2)+arc(cx,cy,26,180,360+180-D,C.red,2);\n    const [bx,by]=P(cx,cy,40,180-D/2),[ax,ay]=P(cx,cy,42,180+(360-D)/2);\n    s+=`<text x=\"${f(bx)}\" y=\"${f(by+4)}\" font-size=\"13\" fill=\"${C.blue}\" text-anchor=\"middle\">${label}<\/text><text x=\"${f(ax)}\" y=\"${f(ay+4)}\" font-size=\"14\" fill=\"${C.red}\" text-anchor=\"middle\">A<\/text><\/svg>`;return s;}\n  function rightPlus(Cdeg){const cx=110,cy=100;let s=`<svg viewBox=\"0 0 220 120\" aria-label=\"直角加角\"><line x1=\"20\" y1=\"${cy}\" x2=\"200\" y2=\"${cy}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/><line x1=\"${cx}\" y1=\"${cy}\" x2=\"${cx}\" y2=\"10\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n    const [x,y]=P(cx,cy,90,90-Cdeg);s+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${f(x)}\" y2=\"${f(y)}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n    s+=`<polyline points=\"${cx-12},${cy} ${cx-12},${cy-12} ${cx},${cy-12}\" fill=\"none\" stroke=\"${C.ink}\" stroke-width=\"1.5\"/>`;\n    s+=arc(cx,cy,24,90-Cdeg,90,C.blue,2)+arc(cx,cy,46,90-Cdeg,180,C.red,2);\n    const [bx,by]=P(cx,cy,36,90-Cdeg/2);s+=`<text x=\"${f(bx)}\" y=\"${f(by+4)}\" font-size=\"12\" fill=\"${C.blue}\" text-anchor=\"middle\">C<\/text><text x=\"${cx-56}\" y=\"${cy-38}\" font-size=\"14\" fill=\"${C.red}\">A<\/text><\/svg>`;return s;}\n  document.getElementById('sum').innerHTML=`<div class=\"two\"><div>${lineAngle(112,'B')}<div style=\"font-size:12.5px;text-align:center\">∠B＝112° → ∠A＝68°<\/div><\/div><div>${rightPlus(35)}<div style=\"font-size:12.5px;text-align:center\">∠C＝35° → ∠A＝125°<\/div><\/div><\/div>`;\n  document.getElementById('angq').innerHTML=\n    `<figure>${lineAngle(118,'B')}<figcaption>24. ∠B＝118°，∠A＝（　　）度<\/figcaption><\/figure>`+\n    `<figure>${roundAngle(140,'D')}<figcaption>25. ∠D＝140°，∠A＝（　　）度<\/figcaption><\/figure>`+\n    `<figure>${rightPlus(35)}<figcaption>26. ∠C＝35°，∠A＝（　　）度<\/figcaption><\/figure>`;\n\n  (function(){const x0=14,x1=286,y=34,X=v=>x0+(x1-x0)*v/3;let s=`<svg viewBox=\"0 0 300 80\" aria-label=\"數線\"><line x1=\"${x0}\" y1=\"${y}\" x2=\"${x1}\" y2=\"${y}\" stroke=\"${C.ink}\" stroke-width=\"2\"/>`;\n    for(let i=0;i<=15;i++){const v=i/5;s+=`<line x1=\"${f(X(v))}\" y1=\"${y-(i%5?4:8)}\" x2=\"${f(X(v))}\" y2=\"${y+(i%5?4:8)}\" stroke=\"${C.ink}\" stroke-width=\"${i%5?1:2}\"/>`;if(i%5===0)s+=`<text x=\"${f(X(v))}\" y=\"${y+22}\" font-size=\"12\" text-anchor=\"middle\" fill=\"${C.ink}\">${v}<\/text>`;}\n    [[1+2/5,'1 2/5'],[2+1/5,'2 1/5'],[2+3/5,'13/5']].forEach(([v,l])=>{s+=`<circle cx=\"${f(X(v))}\" cy=\"${y}\" r=\"4\" fill=\"${C.red}\"/><text x=\"${f(X(v))}\" y=\"${y-12}\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"${C.red}\">${l}<\/text>`;});\n    s+=`<text x=\"150\" y=\"74\" font-size=\"11\" text-anchor=\"middle\" fill=\"${C.ink}\">一大格分成 5 小格，一小格是 1/5；越右邊越大<\/text>`;\n    document.getElementById('nl').innerHTML=s+'<\/svg>';})();\n})();\n<\/script>\n<\/body><\/html>"}, {"id": "m-unit", "s": "數學", "name": "單元重點卡", "sub": "第 1～5 單元＋各單元小考", "html": "<!doctype html><html lang=\"zh-Hant\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><style>body{margin:0}<\/style><\/head><body><title>翰林數學四上重點卡<\/title>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n/* Layout: 練習簿方格紙底，每單元一列直式重點卡，最後一張是小考卷 */\n:root{\n  --bg:#EEF2EF; --grid:#DCE5E0; --card:#FFFFFF; --ink:#1F2B33; --ink2:#5A6A70;\n  --teal:#13776F; --teal-l:#E2F1EE; --gold:#E8A33A; --gold-l:#FFF3DC; --red:#C9473B; --blue:#2E66A8;\n  --line:#D5DFDB;\n  --f-display:\"Huninn\",\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  --f-body:\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#121A19; --grid:#1B2624; --card:#1D2826; --ink:#E7EFEC; --ink2:#A3B3AF;\n  --teal:#5FC4B8; --teal-l:#173733; --gold:#F0B65A; --gold-l:#3A2E19; --red:#F08377; --blue:#83B2EA; --line:#2E3D3A; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#121A19; --grid:#1B2624; --card:#1D2826; --ink:#E7EFEC; --ink2:#A3B3AF;\n  --teal:#5FC4B8; --teal-l:#173733; --gold:#F0B65A; --gold-l:#3A2E19; --red:#F08377; --blue:#83B2EA; --line:#2E3D3A; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}\n.wrap{max-width:1240px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\nheader.top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);margin:0;letter-spacing:.02em;text-wrap:balance}\nheader.top p{margin:6px 0 0;color:var(--ink2);max-width:62ch}\nnav.units{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}\nnav.units a{font-family:var(--f-display);text-decoration:none;color:var(--teal);background:var(--card);border:1.5px solid var(--teal);border-radius:999px;padding:5px 14px;font-size:15px}\nnav.units a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\nsection.unit{margin-top:34px}\n.uhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}\n.uhead .no{font-family:var(--f-display);color:#fff;background:var(--teal);border-radius:10px;padding:2px 12px;font-size:18px}\n.uhead h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}\n.uhead .note{color:var(--ink2);font-size:14px}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px;align-items:start}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}\n.card .bar{height:8px;background:var(--teal)}\n.card.quiz .bar{background:var(--gold)}\n.card .in{padding:14px 16px 16px}\n.tag{font-size:12px;color:var(--teal);letter-spacing:.08em}\n.quiz .tag{color:var(--gold)}\n.card h3{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.35;margin:2px 0 4px;text-wrap:balance}\n.card h3 b{color:var(--teal);font-weight:400}\n.sub{color:var(--ink2);font-size:13.5px;margin:0 0 10px}\n.tip{background:var(--gold-l);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:10px}\n.tip b{color:var(--red)}\n.box{background:var(--teal-l);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}\n.big{font-family:var(--f-display);font-size:24px;text-align:center;letter-spacing:.04em;margin:4px 0}\n.pv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px 0;font-size:14px}\n.pv th{font-weight:500;color:var(--ink2);font-size:12px;padding:2px 0}\n.pv td{text-align:center;font-family:var(--f-display);font-size:22px;border:1.5px solid var(--line);padding:2px 0}\n.pv .cut{border-left:3px solid var(--red)}\n.pv .wan{background:var(--teal-l)}\nul.pts{margin:6px 0;padding-left:1.2em}\nul.pts li{margin:3px 0}\n.wrong{color:var(--red);text-decoration:line-through}\n.ok{color:var(--teal);font-weight:700}\nsvg{display:block;max-width:100%;height:auto;margin:6px auto}\nsvg text{font-family:var(--f-body)}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.mono{font-variant-numeric:tabular-nums}\nol.q{margin:4px 0 8px;padding-left:1.4em}\nol.q li{margin:7px 0;font-size:15px}\n.blank{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--ink2);margin:0 2px}\ndetails{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}\nsummary{cursor:pointer;color:var(--teal);font-weight:700;font-size:14.5px}\ndetails ol{padding-left:1.4em;margin:6px 0 0;font-size:14.5px}\n.fr{display:inline-flex;align-items:center;vertical-align:middle;font-variant-numeric:tabular-nums}\n.fr .nd{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;line-height:1.05;margin-left:.08em}\n.fr .nd span:first-child{border-bottom:1.4px solid currentColor;padding:0 .12em}\nfooter{color:var(--ink2);font-size:13px;margin-top:40px}\n@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}\n<\/style>\n\n<div class=\"wrap\">\n<header class=\"top\">\n  <h1>翰林數學 四上 重點卡<\/h1>\n  <p>第 1～5 單元（期中考範圍），每單元先看重點卡，最後一張是小考卷，寫完再點「看答案」。黃底是容易錯的地方。<\/p>\n  <nav class=\"units\">\n    <a href=\"#u1\">1 一億以內的數<\/a><a href=\"#u2\">2 乘法<\/a><a href=\"#u3\">3 角度<\/a><a href=\"#u4\">4 假分數與帶分數<\/a><a href=\"#u5\">5 公里<\/a>\n  <\/nav>\n<\/header>\n\n<!-- ===== 1 ===== -->\n<section class=\"unit\" id=\"u1\">\n<div class=\"uhead\"><span class=\"no\">第 1 單元<\/span><h2>一億以內的數<\/h2><span class=\"note\">讀、寫、比大小、換算<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>四位一節：<b>先切一刀<\/b>再讀<\/h3>\n    <p class=\"sub\">從右邊數四位畫一條線，左邊是「萬」那一節。<\/p>\n    <table class=\"pv\"><tr><th>千萬<\/th><th>百萬<\/th><th>十萬<\/th><th>萬<\/th><th>千<\/th><th>百<\/th><th>十<\/th><th>個<\/th><\/tr>\n      <tr><td class=\"wan\">8<\/td><td class=\"wan\">7<\/td><td class=\"wan\">1<\/td><td class=\"wan\">0<\/td><td class=\"cut\">6<\/td><td>0<\/td><td>4<\/td><td>9<\/td><\/tr><\/table>\n    <div class=\"box\">8710｜6049 → <b>八千七百一十萬六千零四十九<\/b><\/div>\n    <div class=\"tip\">數字有<b>八位<\/b>才是「幾千萬」。寫成 8716049 只有七位，就錯了。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>中間的 0：<b>連續的 0 只讀一次<\/b><\/h3>\n    <ul class=\"pts\">\n      <li>50604090 → 5060｜4090 → 五千零六十萬四千零九十<\/li>\n      <li>「三千零五萬六百零八」→ 3005｜0608 → <b>30050608<\/b>（後面一節要湊滿四位）<\/li>\n      <li>每一節最後的 0 不讀：30000000 讀三千萬<\/li>\n    <\/ul>\n    <div class=\"tip\">「9 個十」是 <b>90<\/b>：9 寫在十位，個位補 0。<br><span class=\"wrong\">31636009<\/span>　<span class=\"ok\">31636090<\/span><\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>比大小：<b>先比位數<\/b>，再從最高位比<\/h3>\n    <div class=\"box mono\">48220000 ＞ 48□90000<\/div>\n    <ul class=\"pts\">\n      <li>前面 48 一樣，比第三位<\/li>\n      <li><b>先試和對方一樣的數字<\/b>：□＝2 → 48290000 比較大，不行<\/li>\n      <li>所以 □ 只能填 <b>0、1<\/b><\/li>\n    <\/ul>\n    <div class=\"tip\">□ 填和對方一樣的數字時，<b>還要再比下一位<\/b>，不能直接猜。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 4<\/div>\n    <h3>換算：<b>1 億 = 10000 萬<\/b><\/h3>\n    <ul class=\"pts mono\">\n      <li>1 億 ＝ 10000 個萬 ＝ 1000 個十萬 ＝ 100 個百萬<\/li>\n      <li>1000 個萬 ＝ 1000 萬（<b>不是<\/b> 1 億）<\/li>\n      <li>100 個千 ＝ 1000 個百 ＝ 100000<\/li>\n    <\/ul>\n    <div class=\"box\">找規律：號碼 1～2000，最後兩位是 68<br>68、168、268……1968 → 百位 0～19，共 <b>20<\/b> 個<\/div>\n    <div class=\"tip\">錢合起來：20 張千元＋20 張百元 ＝ 20000＋<b>2000<\/b> ＝ 22000<\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第 1 單元 小考<\/h3>\n    <ol class=\"q\">\n      <li>「六千零三萬五百」寫成數字是 <span class=\"blank\"><\/span>。<\/li>\n      <li>30708060 讀作 <span
