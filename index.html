 class=\"blank\" style=\"min-width:9em\"><\/span>。<\/li>\n      <li>4 個千萬、12 個萬和 7 個十，合起來是 <span class=\"blank\"><\/span>。<\/li>\n      <li>1 億是 <span class=\"blank\"><\/span> 個百萬。<\/li>\n      <li>59□30000 ＜ 59640000，□ 可以填哪些數字？<\/li>\n      <li>號碼 1～1200，最後兩位是 45 的有幾張？<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>60030500（6003｜0500）<\/li><li>三千零七十萬八千零六十<\/li><li>40120070<\/li><li>100<\/li>\n      <li>0～6（□＝6 時 59630000 還是比較小）<\/li><li>12 張（45、145……1145）<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<!-- ===== 2 ===== -->\n<section class=\"unit\" id=\"u2\">\n<div class=\"uhead\"><span class=\"no\">第 2 單元<\/span><h2>乘法<\/h2><span class=\"note\">直式、末尾有 0、湊整<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>直式乘法：<b>分兩行再加<\/b><\/h3>\n    <svg viewBox=\"0 0 240 190\" aria-label=\"36 乘 187 直式\">\n      <g font-size=\"22\" text-anchor=\"end\" fill=\"currentColor\" style=\"font-variant-numeric:tabular-nums\">\n        <text x=\"170\" y=\"28\">1 8 7<\/text><text x=\"170\" y=\"56\">×　 3 6<\/text>\n        <line x1=\"70\" y1=\"66\" x2=\"180\" y2=\"66\" stroke=\"currentColor\" stroke-width=\"2\"/>\n        <text x=\"170\" y=\"92\">1 1 2 2<\/text><text x=\"157\" y=\"120\">5 6 1<\/text>\n        <line x1=\"70\" y1=\"130\" x2=\"180\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/>\n        <text x=\"170\" y=\"158\" fill=\"#2A9D8F\" font-weight=\"700\">6 7 3 2<\/text><\/g>\n      <g font-size=\"12\" fill=\"#7D8C90\"><text x=\"188\" y=\"92\">187×6<\/text><text x=\"188\" y=\"120\">187×30（往左一格）<\/text><\/g>\n    <\/svg>\n    <div class=\"tip\">算完把答案和選項<b>一位一位對<\/b>：<span class=\"wrong\">6372<\/span>　<span class=\"ok\">6732<\/span><\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>末尾有 0：<b>先乘前面，再補 0<\/b><\/h3>\n    <div class=\"box mono\">3000 × 3 → 3 × 3 ＝ 9，補三個 0 → <b>9000<\/b><\/div>\n    <div class=\"box mono\">250 × 40 → 25 × 4 ＝ 100，補兩個 0 → <b>10000<\/b><\/div>\n    <div class=\"tip\">寫答案時數一數 0 的個數：算式是 9000，答案不能寫成 <span class=\"wrong\">900<\/span>。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>湊整：<b>多 1 個就加，少 1 個就減<\/b><\/h3>\n    <ul class=\"pts mono\">\n      <li>500 × 99 ＝ 500 × 100 － 500 ＝ 49500<\/li>\n      <li>600 × 101 ＝ 60000 ＋ 600 ＝ 60600<\/li>\n      <li>已知 29×501＝14529 → 29×500 ＝ 14529 <b>－ 29<\/b><\/li>\n    <\/ul>\n    <div class=\"box\">好朋友數：25 × 4 ＝ 100、125 × 8 ＝ 1000<br>25 × 37 × 4 → 先算 25×4 ＝ 100 → 3700<\/div>\n    <div class=\"tip\">先想「差了幾個 29」，<b>不是<\/b>差了 501。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第 2 單元 小考<\/h3>\n    <ol class=\"q\">\n      <li>48 × 125 ＝ <span class=\"blank\"><\/span><\/li>\n      <li>已知 26 × 401 ＝ 10426，26 × 400 ＝ <span class=\"blank\"><\/span><\/li>\n      <li>不用直式：600 × 99 ＝ <span class=\"blank\"><\/span><\/li>\n      <li>2500 × 4 ＝ <span class=\"blank\"><\/span><\/li>\n      <li>一箱飲料 24 瓶，訂了 135 箱，共幾瓶？<\/li>\n      <li>7208 × 5 ＝ <span class=\"blank\"><\/span><\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>6000<\/li><li>10400（少 1 個 26）<\/li><li>59400（60000－600）<\/li><li>10000<\/li><li>3240 瓶<\/li><li>36040<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<!-- ===== 3 ===== -->\n<section class=\"unit\" id=\"u3\">\n<div class=\"uhead\"><span class=\"no\">第 3 單元<\/span><h2>角度<\/h2><span class=\"note\">量角器、鐘面、角度加減<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>五種角：<b>和 90° 比一比<\/b><\/h3>\n    <div id=\"angles\"><\/div>\n    <div class=\"box\">直角 90°、平角 180°、周角 360°<br>比 90° 小是銳角；在 90° 和 180° 之間是鈍角<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>量角器：<b>從哪圈的 0 開始，就看哪圈<\/b><\/h3>\n    <div id=\"prot\"><\/div>\n    <ul class=\"pts\">\n      <li><b>中心點<\/b>對準頂點，<b>0 度線<\/b>對齊一邊<\/li>\n      <li>圖中一邊對齊右邊 0（內圈）→ 讀內圈 <b>65°<\/b>，不是外圈 115°<\/li>\n      <li>兩邊都不在 0：同一圈相減，例如外圈 120－35 ＝ 85°<\/li>\n    <\/ul>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>鐘面：<b>一大格 30°<\/b>，先圈方向<\/h3>\n    <div class=\"two\"><div id=\"clk1\"><\/div><div id=\"clk2\"><\/div><\/div>\n    <div class=\"box mono\">時針 4 → 12<br>順時針 8 格 ＝ <b>240°<\/b>；逆時針 4 格 ＝ <b>120°<\/b><\/div>\n    <div class=\"tip\">同樣兩個數字，<b>方向不同答案就不同<\/b>。用手指在鐘面上數格子。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 4<\/div>\n    <h3>角度加減：<b>拼起來、拆開來<\/b><\/h3>\n    <div id=\"sum\"><\/div>\n    <div class=\"box mono\">∠x ＝ 360 － 90 － 120 ＝ <b>150°<\/b>（鈍角）<\/div>\n    <div class=\"box mono\">直線上：∠y ＝ 180 － 55 ＝ <b>125°<\/b><\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第 3 單元 小考<\/h3>\n    <ol class=\"q\">\n      <li>時針從 2「順時針」轉到 7，轉了幾度？<\/li>\n      <li>時針從 2「逆時針」轉到 7，轉了幾度？<\/li>\n      <li>分針從 12 轉到 4，轉了幾度？<\/li>\n      <li>量角器外圈刻度 25 和外圈刻度 110 的兩條線，夾角幾度？<\/li>\n      <li>一個周角減一個平角，再減 65°，是幾度？是什麼角？<\/li>\n      <li>一個直角加一個平角，是幾度？<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>150°（5 格）<\/li><li>210°（7 格）<\/li><li>120°<\/li><li>85°<\/li><li>115°，鈍角<\/li><li>270°<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<!-- ===== 4 ===== -->\n<section class=\"unit\" id=\"u4\">\n<div class=\"uhead\"><span class=\"no\">第 4 單元<\/span><h2>假分數與帶分數<\/h2><span class=\"note\">分數種類、互換、比大小<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>三種分數：<b>看分子和分母<\/b><\/h3>\n    <div id=\"bars\"><\/div>\n    <ul class=\"pts\">\n      <li>真分數：分子 ＜ 分母，例 <span class=\"fr\"><span class=\"nd\"><span>3<\/span><span>5<\/span><\/span><\/span><\/li>\n      <li>假分數：分子 <b>≧<\/b> 分母，例 <span class=\"fr\"><span class=\"nd\"><span>5<\/span><span>5<\/span><\/span><\/span>、<span class=\"fr\"><span class=\"nd\"><span>7<\/span><span>5<\/span><\/span><\/span><\/li>\n      <li>帶分數：整數＋真分數，例 <span class=\"fr\">1<span class=\"nd\"><span>2<\/span><span>5<\/span><\/span><\/span><\/li>\n    <\/ul>\n    <div class=\"tip\"><span class=\"fr\"><span class=\"nd\"><span>5<\/span><span>5<\/span><\/span><\/span> 等於 1，但它的寫法是<b>假分數<\/b>。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>互換：<b>除法和乘法<\/b><\/h3>\n    <div class=\"box\">假 → 帶：26 ÷ 12 ＝ 2 … 2<br>商是整數、餘數是分子 → <span class=\"fr\">2<span class=\"nd\"><span>2<\/span><span>12<\/span><\/span><\/span><\/div>\n    <div class=\"box\">帶 → 假：<span class=\"fr\">3<span class=\"nd\"><span>8<\/span><span>11<\/span><\/span><\/span> → 3 × 11 ＋ 8 ＝ 41 → <span class=\"fr\"><span class=\"nd\"><span>41<\/span><span>11<\/span><\/span><\/span><\/div>\n    <div class=\"tip\">分母不變。乘完<b>記得加分子<\/b>：<span class=\"wrong\">14/11<\/span>　<span class=\"ok\">41/11<\/span><\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>比大小：<b>換成同一種<\/b>再比<\/h3>\n    <div class=\"box mono\"><span class=\"fr\"><span class=\"nd\"><span>13<\/span><span>9<\/span><\/span><\/span> ○ <span class=\"fr\">2<span class=\"nd\"><span>1<\/span><span>9<\/span><\/span><\/span> → <span class=\"fr\"><span class=\"nd\"><span>13<\/span><span>9<\/span><\/span><\/span> ＜ <span class=\"fr\"><span class=\"nd\"><span>19<\/span><span>9<\/span><\/span><\/span><\/div>\n    <ul class=\"pts\">\n      <li>兩個帶分數：<b>先比整數<\/b>，整數大的就大<\/li>\n      <li>整數一樣，再比分數部分<\/li>\n      <li>問「剩下」：吃得少的，剩下的多<\/li>\n    <\/ul>\n    <div class=\"tip\">□/8 換成帶分數，整數是 5 → 至少 5 個 1 ＝ 40/8，還要再多 → □ 是 41～47。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第 4 單元 小考<\/h3>\n    <ol class=\"q\">\n      <li><span class=\"fr\"><span class=\"nd\"><span>7<\/span><span>7<\/span><\/span><\/span> 是哪一種分數？<\/li>\n      <li><span class=\"fr\"><span class=\"nd\"><span>29<\/span><span>4<\/span><\/span><\/span> 換成帶分數。<\/li>\n      <li><span class=\"fr\">5<span class=\"nd\"><span>2<\/span><span>7<\/span><\/span><\/span> 換成假分數。<\/li>\n      <li>比大小：<span class=\"fr\"><span class=\"nd\"><span>23<\/span><span>5<\/span><\/span><\/span> ○ <span class=\"fr\">4<span class=\"nd\"><span>2<\/span><span>5<\/span><\/span><\/span><\/li>\n      <li>□/6 換成帶分數後整數是 2，□ 可以是哪些數？<\/li>\n      <li>是非：<span class=\"fr\">3<span class=\"nd\"><span>1<\/span><span>8<\/span><\/span><\/span> 比 <span class=\"fr\">2<span class=\"nd\"><span>7<\/span><span>8<\/span><\/span><\/span> 小。<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>假分數<\/li><li>7 又 1/4<\/li><li>37/7<\/li><li>＞（4 又 2/5 ＝ 22/5）<\/li><li>13、14、15、16、17<\/li><li>✗（先比整數，3 ＞ 2）<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<!-- ===== 5 ===== -->\n<section class=\"unit\" id=\"u5\">\n<div class=\"uhead\"><span class=\"no\">第 5 單元<\/span><h2>公里<\/h2><span class=\"note\">換算、比大小、應用題<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>長度階梯：<b>公里到公尺 ×1000<\/b><\/h3>\n    <svg viewBox=\"0 0 280 150\" aria-label=\"長度單位階梯\">\n      <g fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"2.5\">\n        <path d=\"M10 30 H80 V60 H150 V90 H215 V120 H275\"/><\/g>\n      <g font-size=\"15\" fill=\"currentColor\">\n        <text x=\"14\" y=\"22\">公里<\/text><text x=\"86\" y=\"52\">公尺<\/text><text x=\"156\" y=\"82\">公分<\/text><text x=\"221\" y=\"112\">毫米<\/text><\/g>\n      <g font-size=\"12\" fill=\"#E0584B\"><text x=\"40\" y=\"52\">×1000<\/text><text x=\"112\" y=\"82\">×100<\/text><text x=\"178\" y=\"112\">×10<\/text><\/g>\n    <\/svg>\n    <div class=\"box mono\">5 公里 325 公尺 ＝ 5325 公尺<br>7 公里 8 公尺 ＝ 70<b>0<\/b>8 公尺（要補 0）<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>「比…多」：<b>先想誰比較多<\/b><\/h3>\n    <div class=\"box\">哥哥 5 公里 300 公尺，<b>比妹妹多<\/b> 1 公里 800 公尺<br>→ 妹妹比較少 → <b>減<\/b>：5300 － 1800 ＝ 3500 公尺<\/div>\n    <div class=\"box\">弟弟 2 公里 750 公尺，<b>比姊姊少<\/b> 650 公尺<br>→ 姊姊比較多 → <b>加<\/b>：2750 ＋ 650 ＝ 3400 公尺<\/div>\n    <div class=\"tip\">看到「比」不要直接加。公尺不夠減，向公里借 1（＝1000 公尺）。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>重疊路段：<b>重複的要減掉<\/b><\/h3>\n    <div id=\"seg\"><\/div>\n    <div class=\"box mono\">甲到丁 ＝ 124 ＋ 152 － 30 ＝ <b>246<\/b> 公里<\/div>\n    <div class=\"tip\">乙到丙那段在兩條虛線裡都有，<b>被算了兩次<\/b>。直接三個相加是 <span class=\"wrong\">306<\/span>。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第 5 單元 小考<\/h3>\n    <ol class=\"q\">\n      <li>4 公里 60 公尺 ＝ <span class=\"blank\"><\/span> 公尺<\/li>\n      <li>比大小：8 公里 5 公尺 ○ 8050 公尺<\/li>\n      <li>6 公里 200 公尺 － 2 公里 700 公尺 ＝ ？<\/li>\n      <li>小玲走了 1 公里 400 公尺，比小芳少走 600 公尺。小芳走了多遠？<\/li>\n      <li>大橋 3 公里 100 公尺，比小橋長 1 公里 300 公尺。小橋多長？<\/li>\n      <li>甲—乙—丙—丁在同一條路上，甲到丙 70 公里、乙到丁 90 公里、乙到丙 15 公里。甲到丁多遠？<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>4060<\/li><li>＜（8005 ＜ 8050）<\/li><li>3 公里 500 公尺<\/li><li>2 公里（小芳比較多，用加）<\/li><li>1 公里 800 公尺（小橋比較短，用減）<\/li><li>145 公里（70＋90－15）<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<footer>依翰林版四年級上學期第 1～5 單元整理，題目為自編練習題。<\/footer>\n<\/div>\n\n<script>\n(function(){\n  const C={ink:'currentColor',teal:'#2A9D8F',red:'#E0584B',blue:'#4A86C8'};\n  const P=(cx,cy,r,d)=>[cx+r*Math.cos(d*Math.PI/180), cy-r*Math.sin(d*Math.PI/180)];\n  const f=n=>n.toFixed(1);\n  function arc(cx,cy,r,a0,a1,col,w,dash){let s='';const st=a1>a0?3:-3;const pts=[];for(let a=a0;st>0?a<=a1:a>=a1;a+=st)pts.push(P(cx,cy,r,a));pts.push(P(cx,cy,r,a1));\n    return `<polyline fill=\"none\" stroke=\"${col}\" stroke-width=\"${w}\" ${dash?'stroke-dasharray=\"7 5\"':''} points=\"${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}\"/>`;}\n  function head(x,y,dir,col){const a=dir*Math.PI/180,b1=a+2.6,b2=a-2.6,s=10;return `<polygon fill=\"${col}\" points=\"${f(x)},${f(y)} ${f(x+s*Math.cos(b1))},${f(y-s*Math.sin(b1))} ${f(x+s*Math.cos(b2))},${f(y-s*Math.sin(b2))}\"/>`;}\n  const cd=n=>90-30*n;\n  function clock(from,to,cw,label){\n    const cx=80,cy=80,R=56;let s=`<svg viewBox=\"0 0 160 186\" aria-label=\"${label}\"><circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\" fill=\"none\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n    for(let n=1;n<=12;n++){const [x,y]=P(cx,cy,R-13,cd(n));s+=`<text x=\"${f(x)}\" y=\"${f(y+4.5)}\" font-size=\"12\" text-anchor=\"middle\" fill=\"${C.ink}\">${n}<\/text>`;}\n    const [hx,hy]=P(cx,cy,32,cd(from));s+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${f(hx)}\" y2=\"${f(hy)}\" stroke=\"${C.blue}\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"${cx}\" cy=\"${cy}\" r=\"3\" fill=\"${C.ink}\"/>`;\n    const a0=cd(from);let a1=cd(to);\n    if(cw){while(a1>a0)a1-=360;} else {while(a1<a0)a1+=360;}\n    s+=arc(cx,cy,R+10,a0,a1,C.red,2.5,true);const [ex,ey]=P(cx,cy,R+10,a1);s+=head(ex,ey,cw?a1-90:a1+90,C.red);\n    s+=`<text x=\"80\" y=\"180\" font-size=\"13\" text-anchor=\"middle\" fill=\"${C.red}\">${label}<\/text><\/svg>`;return s;}\n  document.getElementById('clk1').innerHTML=clock(4,12,true,'順時針 8 格');\n  document.getElementById('clk2').innerHTML=clock(4,12,false,'逆時針 4 格');\n\n  // angles\n  (function(){let s='<svg viewBox=\"0 0 300 150\" aria-label=\"五種角\">';\n    const items=[[30,'銳角',40,45],[90,'直角',115,45],[135,'鈍角',200,45]];\n    items.forEach(([d,n,x,y])=>{const ox=x-15,oy=y+50;s+=`<line x1=\"${ox}\" y1=\"${oy}\" x2=\"${ox+60}\" y2=\"${oy}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n      const [ex,ey]=P(ox,oy,55,d);s+=`<line x1=\"${ox}\" y1=\"${oy}\" x2=\"${f(ex)}\" y2=\"${f(ey)}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;\n      s+= d===90?`<polyline points=\"${ox+12},${oy} ${ox+12},${oy-12} ${ox},${oy-12}\" fill=\"none\" stroke=\"${C.teal}\" stroke-width=\"2\"/>`:arc(ox,oy,15,0,d,C.teal,2);\n      s+=`<text x=\"${ox+20}\" y=\"${oy+22}\" font-size=\"13\" text-anchor=\"middle\" fill=\"${C.ink}\">${n}<\/text>`;});\n    s+=`<line x1=\"20\" y1=\"138\" x2=\"140\" y2=\"138\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/><circle cx=\"80\" cy=\"138\" r=\"2.5\" fill=\"${C.ink}\"/>${arc(80,138,14,0,180,C.teal,2)}<text x=\"160\" y=\"142\" font-size=\"13\" fill=\"${C.ink}\">平角 180°（一條直線）<\/text>`;\n    document.getElementById('angles').innerHTML=s+'<\/svg>';})();\n\n  // protractor\n  (function(){const cx=150,cy=140,R=125;let s=`<svg viewBox=\"0 0 300 165\" aria-label=\"量角器\">`;\n    s+=`<path d=\"M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy} Z\" fill=\"rgba(19,119,111,.07)\" stroke=\"${C.ink}\" stroke-width=\"1.8\"/>`;\n    for(let d=0;d<=180;d+=5){const L=d%10?5:9;const [x1,y1]=P(cx,cy,R,d),[x2,y2]=P(cx,cy,R-L,d);s+=`<line x1=\"${f(x1)}\" y1=\"${f(y1)}\" x2=\"${f(x2)}\" y2=\"${f(y2)}\" stroke=\"${C.ink}\" stroke-width=\"${d%10?.6:1.1}\"/>`;\n      if(d%30===0){const [x,y]=P(cx,cy,R-19,d);s+=`<text x=\"${f(x)}\" y=\"${f(y+4)}\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${C.ink}\">${180-d}<\/text>`;\n        const [a,b]=P(cx,cy,R-38,d);s+=`<text x=\"${f(a)}\" y=\"${f(b+3.5)}\" font-size=\"9\" text-anchor=\"middle\" fill=\"${C.blue}\">${d}<\/text>`;}}\n    const [rx,ry]=P(cx,cy,R+12,65);s+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${cx+R+12}\" y2=\"${cy}\" stroke=\"${C.red}\" stroke-width=\"3\"/><line x1=\"${cx}\" y1=\"${cy}\" x2=\"${f(rx)}\" y2=\"${f(ry)}\" stroke=\"${C.red}\" stroke-width=\"3\"/>`;\n    s+=arc(cx,cy,26,0,65,C.red,2)+`<text x=\"${cx+30}\" y=\"${cy-14}\" font-size=\"12\" fill=\"${C.red}\">65°<\/text><circle cx=\"${cx}\" cy=\"${cy}\" r=\"3\" fill=\"${C.ink}\"/>`;\n    s+=`<text x=\"150\" y=\"160\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"${C.ink}\">黑字外圈從左邊 0 開始，藍字內圈從右邊 0 開始<\/text>`;\n    document.getElementById('prot').innerHTML=s+'<\/svg>';})();\n\n  // angle sum\n  (function(){const cx=140,cy=80;let s=`<svg viewBox=\"0 0 280 160\" aria-label=\"角度合成\">`;\n    [0,90,210].forEach(d=>{const [x,y]=P(cx,cy,72,d);s+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${f(x)}\" y2=\"${f(y)}\" stroke=\"${C.ink}\" stroke-width=\"2.5\"/>`;});\n    s+=`<polyline points=\"${cx+12},${cy} ${cx+12},${cy-12} ${cx},${cy-12}\" fill=\"none\" stroke=\"${C.ink}\" stroke-width=\"1.6\"/>`;\n    s+=arc(cx,cy,22,90,210,C.blue,2)+`<text x=\"${cx-62}\" y=\"${cy-12}\" font-size=\"13\" fill=\"${C.blue}\">120°<\/text>`;\n    s+=arc(cx,cy,18,210,360,C.red,2)+`<text x=\"${cx+4}\" y=\"${cy+40}\" font-size=\"14\" fill=\"${C.red}\">∠x<\/text>`;\n    document.getElementById('sum').innerHTML=s+'<\/svg>';})();\n\n  // fraction bars\n  (function(){let s=`<svg viewBox=\"0 0 360 96\" aria-label=\"分數條\">`;\n    const FILL='rgba(42,157,143,.55)';\n    const row=(y,parts,fill,label)=>{let t='';for(let i=0;i<parts;i++){t+=`<rect x=\"${64+i*28}\" y=\"${y}\" width=\"28\" height=\"20\" fill=\"${i<fill?FILL:'none'}\" stroke=\"${C.ink}\" stroke-width=\"1.2\"/>`;}return t+`<text x=\"0\" y=\"${y+15}\" font-size=\"12.5\" fill=\"${C.ink}\">${label}<\/text>`;};\n    s+=row(4,5,3,'3/5 真')+row(36,5,5,'5/5 假')+row(68,5,5,'7/5 假');\n    for(let i=0;i<2;i++)s+=`<rect x=\"${214+i*28}\" y=\"68\" width=\"28\" height=\"20\" fill=\"${FILL}\" stroke=\"${C.ink}\" stroke-width=\"1.2\"/>`;\n    for(let i=2;i<5;i++)s+=`<rect x=\"${214+i*28}\" y=\"68\" width=\"28\" height=\"20\" fill=\"none\" stroke=\"${C.ink}\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>`;\n    document.getElementById('bars').innerHTML=s+'<\/svg>';})();\n\n  // segments\n  (function(){const x0=20,x1=260,y=70;const pos=[0,.38,.5,1],X=i=>x0+(x1-x0)*pos[i];let s=`<svg viewBox=\"0 0 280 130\" aria-label=\"重疊路段圖\"><g stroke=\"${C.ink}\" stroke-width=\"2\" fill=\"none\"><line x1=\"${x0}\" y1=\"${y}\" x2=\"${x1}\" y2=\"${y}\"/>`;\n    [0,1,2,3].forEach(i=>s+=`<line x1=\"${X(i)}\" y1=\"${y-5}\" x2=\"${X(i)}\" y2=\"${y+5}\"/>`);\n    s+=`<path d=\"M${X(0)} ${y-8} V${y-44} H${X(2)} V${y-8}\" stroke-dasharray=\"5 4\" stroke=\"${C.blue}\"/><path d=\"M${X(1)} ${y-8} V${y-26} H${X(3)} V${y-8}\" stroke-dasharray=\"5 4\" stroke=\"${C.teal}\"/><path d=\"M${X(1)} ${y+8} V${y+22} H${X(2)} V${y+8}\" stroke=\"${C.red}\"/><\/g>`;\n    s+=`<g font-size=\"12\" text-anchor=\"middle\" fill=\"${C.ink}\">${['甲','乙','丙','丁'].map((n,i)=>`<text x=\"${X(i)}\" y=\"${y+40}\">${n}<\/text>`).join('')}<\/g>`;\n    s+=`<text x=\"${(X(0)+X(2))/2}\" y=\"${y-48}\" font-size=\"12\" text-anchor=\"middle\" fill=\"${C.blue}\">124 公里<\/text><text x=\"${(X(1)+X(3))/2+30}\" y=\"${y-30}\" font-size=\"12\" text-anchor=\"middle\" fill=\"${C.teal}\">152 公里<\/text><text x=\"${(X(1)+X(2))/2}\" y=\"${y+56}\" font-size=\"12\" text-anchor=\"middle\" fill=\"${C.red}\">30 公里（算兩次）<\/text>`;\n    document.getElementById('seg').innerHTML=s+'<\/svg>';})();\n})();\n<\/script>\n<\/body><\/html>"}, {"id": "s-mid", "s": "社會", "name": "期中必考重點", "sub": "三份考卷常考題＋模擬考", "html": "<!doctype html><html lang=\"zh-Hant\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><style>body{margin:0}<\/style><\/head><body><title>康軒社會期中必考重點<\/title>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n/* Layout: 練習簿方格紙底，每單元一列直式重點卡，最後一張是小考卷 */\n:root{\n  --bg:#EEF2EF; --grid:#DCE5E0; --card:#FFFFFF; --ink:#1F2B33; --ink2:#5A6A70;\n  --teal:#13776F; --teal-l:#E2F1EE; --gold:#E8A33A; --gold-l:#FFF3DC; --red:#C9473B; --blue:#2E66A8;\n  --line:#D5DFDB;\n  --f-display:\"Huninn\",\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  --f-body:\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#121A19; --grid:#1B2624; --card:#1D2826; --ink:#E7EFEC; --ink2:#A3B3AF;\n  --teal:#5FC4B8; --teal-l:#173733; --gold:#F0B65A; --gold-l:#3A2E19; --red:#F08377; --blue:#83B2EA; --line:#2E3D3A; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#121A19; --grid:#1B2624; --card:#1D2826; --ink:#E7EFEC; --ink2:#A3B3AF;\n  --teal:#5FC4B8; --teal-l:#173733; --gold:#F0B65A; --gold-l:#3A2E19; --red:#F08377; --blue:#83B2EA; --line:#2E3D3A; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}\n.wrap{max-width:1240px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\nheader.top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);margin:0;letter-spacing:.02em;text-wrap:balance}\nheader.top p{margin:6px 0 0;color:var(--ink2);max-width:62ch}\nnav.units{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}\nnav.units a{font-family:var(--f-display);text-decoration:none;color:var(--teal);background:var(--card);border:1.5px solid var(--teal);border-radius:999px;padding:5px 14px;font-size:15px}\nnav.units a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\nsection.unit{margin-top:34px}\n.uhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}\n.uhead .no{font-family:var(--f-display);color:#fff;background:var(--teal);border-radius:10px;padding:2px 12px;font-size:18px}\n.uhead h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}\n.uhead .note{color:var(--ink2);font-size:14px}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px;align-items:start}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}\n.card .bar{height:8px;background:var(--teal)}\n.card.quiz .bar{background:var(--gold)}\n.card .in{padding:14px 16px 16px}\n.tag{font-size:12px;color:var(--teal);letter-spacing:.08em}\n.quiz .tag{color:var(--gold)}\n.card h3{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.35;margin:2px 0 4px;text-wrap:balance}\n.card h3 b{color:var(--teal);font-weight:400}\n.sub{color:var(--ink2);font-size:13.5px;margin:0 0 10px}\n.tip{background:var(--gold-l);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:10px}\n.tip b{color:var(--red)}\n.box{background:var(--teal-l);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}\n.big{font-family:var(--f-display);font-size:24px;text-align:center;letter-spacing:.04em;margin:4px 0}\n.pv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px 0;font-size:14px}\n.pv th{font-weight:500;color:var(--ink2);font-size:12px;padding:2px 0}\n.pv td{text-align:center;font-family:var(--f-display);font-size:22px;border:1.5px solid var(--line);padding:2px 0}\n.pv .cut{border-left:3px solid var(--red)}\n.pv .wan{background:var(--teal-l)}\nul.pts{margin:6px 0;padding-left:1.2em}\nul.pts li{margin:3px 0}\n.wrong{color:var(--red);text-decoration:line-through}\n.ok{color:var(--teal);font-weight:700}\nsvg{display:block;max-width:100%;height:auto;margin:6px auto}\nsvg text{font-family:var(--f-body)}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.mono{font-variant-numeric:tabular-nums}\nol.q{margin:4px 0 8px;padding-left:1.4em}\nol.q li{margin:7px 0;font-size:15px}\n.blank{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--ink2);margin:0 2px}\ndetails{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}\nsummary{cursor:pointer;color:var(--teal);font-weight:700;font-size:14.5px}\ndetails ol{padding-left:1.4em;margin:6px 0 0;font-size:14.5px}\n.fr{display:inline-flex;align-items:center;vertical-align:middle;font-variant-numeric:tabular-nums}\n.fr .nd{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;line-height:1.05;margin-left:.08em}\n.fr .nd span:first-child{border-bottom:1.4px solid currentColor;padding:0 .12em}\nfooter{color:var(--ink2);font-size:13px;margin-top:40px}\n@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}\n<\/style>\n\n<style>\n.wide{grid-column:1/-1}\n.src{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 6px}\n.src span{font-size:11.5px;border:1px solid var(--teal);color:var(--teal);border-radius:999px;padding:0 8px}\n.src span.cas{border-color:var(--red);color:var(--red)}\ntable.rank{width:100%;border-collapse:collapse;font-size:14px}\ntable.rank th{font-weight:500;color:var(--ink2);font-size:12.5px;text-align:left;border-bottom:1.5px solid var(--line);padding:4px 6px}\ntable.rank td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}\ntable.rank td.c{text-align:center;font-family:var(--f-display);font-size:16px;color:var(--teal);white-space:nowrap}\ntable.rank td.x{color:var(--red);font-size:13px}\n.passage{background:var(--teal-l);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:6px 0 4px}\nol.q.cols{columns:2;column-gap:24px}\nol.q.cols li{break-inside:avoid}\n@media (max-width:640px){ol.q.cols{columns:1}}\n.qh{font-family:var(--f-display);font-size:17px;margin:14px 0 2px;color:var(--teal)}\n<\/style>\n<div class=\"wrap\">\n<header class=\"top\">\n  <h1>康軒社會 四上 期中必考重點<\/h1>\n  <p>從三份考卷（期中複習卷 A、B，評量單「第一次成績考查」）找出最常出現的題目，再加上 Cassie 平時考錯過的地方。先看必考排行，再讀重點卡，最後寫模擬考卷。<\/p>\n  <nav class=\"units\"><a href=\"#u0\">必考排行<\/a><a href=\"#u1\">地圖<\/a><a href=\"#u2\">地形與氣候<\/a><a href=\"#u3\">水資源<\/a><a href=\"#u4\">住屋與器物<\/a><a href=\"#u5\">模擬考卷<\/a><\/nav>\n<\/header>\n\n<section class=\"unit\" id=\"u0\">\n<div class=\"uhead\"><span class=\"no\">先看這頁<\/span><h2>必考排行<\/h2><span class=\"note\">三份考卷都考的排前面；紅字是 Cassie 錯過的<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card wide\"><div class=\"bar\"><\/div><div class=\"in\">\n    <table class=\"rank top\">\n      <tr><th>考點<\/th><th>三份考卷怎麼考<\/th><th>出現<\/th><th>Cassie<\/th><\/tr>\n      <tr><td><b>南北氣候不同<\/b><\/td><td>給氣溫、雨量描述，選地方（高雄、恆春、屏東）；「臺灣很小所以氣候都一樣」是錯的<\/td><td class=\"c\">3／3<\/td><td class=\"x\">錯過 5 題<\/td><\/tr>\n      <tr><td><b>三合院空間<\/b><\/td><td>稻埕多用途、正廳供奉神明祖先、兩側是護龍、先有正身再加護龍<\/td><td class=\"c\">3／3<\/td><td class=\"x\">錯過 5 題<\/td><\/tr>\n      <tr><td><b>水資源與水庫<\/b><\/td><td>海洋也是水資源、水庫蓋在上中游、功能不只灌溉、水量隨季節改變<\/td><td class=\"c\">3／3<\/td><td class=\"x\">錯過 3 題<\/td><\/tr>\n      <tr><td><b>地形判斷與生活<\/b><\/td><td>看描述選地形（一望無際的田→平原）、茶園在丘陵、平坦處有高樓都市<\/td><td class=\"c\">3／3<\/td><td class=\"x\">錯過 4 題<\/td><\/tr>\n      <tr><td><b>地圖要素<\/b><\/td><td>找某地的位置用圖例、找方位用方向標、比例尺是「縮小」的程度、圖名看主題<\/td><td class=\"c\">3／3<\/td><td class=\"x\">錯過 1 題<\/td><\/tr>\n      <tr><td><b>選對地圖、電子地圖<\/b><\/td><td>行政區圖看各區界線、可輸入地址搜尋、加減號縮放、衛星模式看到樹林房子<\/td><td class=\"c\">3／3<\/td><td class=\"x\">錯過 3 題<\/td><\/tr>\n      <tr><td><b>生活器物配對<\/b><\/td><td>菜櫥存食物、砧板切菜、灶煮飯、魚筌捕魚；材料多是木頭、竹藤<\/td><td class=\"c\">3／3<\/td><td><\/td><\/tr>\n      <tr><td><b>傳統住屋材料<\/b><\/td><td>就地取材、土埆厝怎麼蓋、雅美族地下屋躲強風、現代用鋼筋混凝土<\/td><td class=\"c\">3／3<\/td><td><\/td><\/tr>\n      <tr><td><b>保存傳統建築<\/b><\/td><td>政府和民間一起、列古蹟或聚落保存區、發展觀光；拆除改建是錯的<\/td><td class=\"c\">3／3<\/td><td><\/td><\/tr>\n      <tr><td><b>塑膠與減塑<\/b><\/td><td>塑膠輕便便宜才取代傳統器物；塑膠吸管、免洗餐具不環保<\/td><td class=\"c\">3／3<\/td><td class=\"x\">錯過 1 題<\/td><\/tr>\n      <tr><td><b>魚筌<\/b><\/td><td>竹子和藤做的、放溪裡用石頭固定、留空隙讓小魚游走<\/td><td class=\"c\">2／3<\/td><td><\/td><\/tr>\n      <tr><td><b>澎湖少雨種花生<\/b><\/td><td>氣候影響生活方式<\/td><td class=\"c\">1／3<\/td><td><\/td><\/tr>\n    <\/table>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u1\">\n<div class=\"uhead\"><span class=\"no\">重點卡 1–2<\/span><h2>地圖<\/h2><span class=\"note\">第一單元第 1 課<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>地圖要素：<b>找東西看圖例，找方向看方向標<\/b><\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><\/div>\n    <ul class=\"pts\">\n      <li><b>圖名<\/b>：依地圖的<b>主題或區域範圍<\/b>命名（不是依畫圖的人住哪裡）<\/li>\n      <li><b>圖例<\/b>：用簡單符號表示實際景物，<b>不是<\/b>裝飾。想找派出所在哪 → 看圖例<\/li>\n      <li><b>方向標<\/b>：判斷東南西北<\/li>\n      <li><b>比例尺<\/b>：實際距離在地圖上被<b>縮小<\/b>的程度（不是放大）<\/li>\n    <\/ul>\n    <div class=\"box\">題型：「找學校<b>北邊<\/b>的<b>便利商店<\/b>有幾家」→ 需要<b>方向標＋圖例<\/b><\/div>\n    <div class=\"tip\">Cassie 錯過：「比例尺可以算實際距離」是<b>對<\/b>的。比例尺<b>不能<\/b>看方向。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>選地圖、用電子地圖<\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><\/div>\n    <ul class=\"pts\">\n      <li><b>行政區圖<\/b>：各區的<b>數量、界線、分布位置<\/b>（不是景點、不是交通、不是地形）<\/li>\n      <li>找廟宇、景點位置 → <b>觀光導覽圖<\/b>；看路線 → <b>交通路線圖<\/b><\/li>\n      <li>電子地圖：輸入<b>地點或地址<\/b>搜尋；點<b>加減號<\/b>放大縮小（紙本地圖不行）<\/li>\n      <li><b>衛星模式<\/b>：看得到深綠色的樹林、灰白色密集的房子<\/li>\n    <\/ul>\n    <div class=\"tip\">Cassie 錯過：電子地圖是<b>彩色<\/b>的；想了解氣候不能看行政區圖，要看<b>氣溫圖、雨量圖<\/b>。<\/div>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u2\">\n<div class=\"uhead\"><span class=\"no\">重點卡 3–5<\/span><h2>地形與氣候<\/h2><span class=\"note\">第一單元第 2、3 課<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>地形判斷：<b>抓題目裡的關鍵詞<\/b><\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <table class=\"rank\">\n      <tr><th>看到這些詞<\/th><th>就是<\/th><\/tr>\n      <tr><td>一望無際的田、坐火車沒有起伏、魚塭、高樓林立<\/td><td><b>平原<\/b><\/td><\/tr>\n      <tr><td>坡度平緩、排水良好、種茶<\/td><td><b>丘陵<\/b><\/td><\/tr>\n      <tr><td>高聳、1000 公尺以上、高山果園<\/td><td><b>山地<\/b><\/td><\/tr>\n      <tr><td>頂部平坦、四周陡坡<\/td><td><b>台地<\/b><\/td><\/tr>\n      <tr><td>四周高、中間低平（兩邊站直、中間蹲低）<\/td><td><b>盆地<\/b><\/td><\/tr>\n    <\/table>\n    <div class=\"tip\">平原和台地的共同點是<b>地形平坦<\/b>；「四周高中間低」只有盆地。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 4<\/div>\n    <h3>南北氣候：<b>看冬天<\/b>就分得出來<\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <table class=\"rank\">\n      <tr><th><\/th><th>北部（基隆、宜蘭、新北）<\/th><th>南部（高雄、屏東、恆春）<\/th><\/tr>\n      <tr><td class=\"k\">雨<\/td><td>四季多雨，冬天也下雨<\/td><td><b>夏季多雨、冬季少雨<\/b><\/td><\/tr>\n      <tr><td class=\"k\">溫度<\/td><td>冬天較冷<\/td><td><b>四季氣溫高<\/b>，1 月也有 20°C 以上<\/td><\/tr>\n    <\/table>\n    <div class=\"box\">「6～8 月雨量很多、冬天雨很少」→ 高雄<br>「1 月平均 21°C」→ 恆春；「一月想去溫暖少雨的地方」→ 屏東<\/div>\n    <div class=\"tip\">「臺灣很小，所以各地氣候都差不多」<b>錯<\/b>。「高雄四季多雨」<b>錯<\/b>。「宜蘭冬天比屏東冷」<b>對<\/b>。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 5<\/div>\n    <h3>地形、氣候<b>影響生活方式<\/b><\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><\/div>\n    <ul class=\"pts\">\n      <li>住在不同家鄉，生活方式<b>不會<\/b>完全相同<\/li>\n      <li>丘陵、山地起伏大 → 選坡度平緩處<b>開茶園<\/b><\/li>\n      <li>平坦的地方 → 蓋房子、交通建設，可能形成都市<\/li>\n      <li>澎湖雨少 → 種<b>耐旱<\/b>的花生；九份多雨 → 屋頂用防雨的油毛氈<\/li>\n      <li>認識地形：實地觀察、空拍照片、地圖都可以（不是只能實地走）<\/li>\n      <li>觀察<b>氣溫圖和雨量圖<\/b>可以了解氣候<\/li>\n    <\/ul>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u3\">\n<div class=\"uhead\"><span class=\"no\">重點卡 6<\/span><h2>水資源<\/h2><span class=\"note\">第一單元第 3 課<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 6<\/div>\n    <h3>水資源：<b>海洋也算<\/b>，水庫蓋在上中游<\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <ul class=\"pts\">\n      <li>水資源：河川、湖泊、水庫、水圳、地下水、<b>海洋<\/b><\/li>\n      <li>「海水不能喝所以不是水資源」<b>錯<\/b><\/li>\n      <li>水庫蓋在河流的<b>上游、中游<\/b><\/li>\n      <li>水庫功能：民生用水、工業用水、灌溉、<b>發電<\/b>、休閒（不是只有灌溉）<\/li>\n      <li>河川水量<b>隨季節的降雨量<\/b>改變；河水不會全部流進海洋，有的滲到地下<\/li>\n      <li>水資源<b>會<\/b>被汙染、不能盡情使用 → 保護水資源、避免汙染是每個人的責任<\/li>\n    <\/ul>\n  <\/div><\/article>\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 6 延伸<\/div>\n    <h3>素養題：<b>嘉南大圳<\/b><\/h3>\n    <div class=\"src\"><span>成績考查<\/span><\/div>\n    <ul class=\"pts\">\n      <li>日治時期興建，主要功能是<b>農業灌溉<\/b>，讓糧食產量提升<\/li>\n      <li>現在的水圳綠道（自行車道）提供<b>休閒娛樂<\/b>，也能認識<b>歷史知識<\/b><\/li>\n      <li>河川、湖泊除了日常用水，也能提供<b>休閒<\/b>活動<\/li>\n    <\/ul>\n    <div class=\"tip\">素養題答案都在短文裡：先讀問題，再回短文找關鍵句。<\/div>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u4\">\n<div class=\"uhead\"><span class=\"no\">重點卡 7–10<\/span><h2>傳統住屋與生活器物<\/h2><span class=\"note\">第二單元第 1、2 課<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 7<\/div>\n    <h3>三合院：<b>空間和用途<\/b><\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <svg viewBox=\"0 0 300 190\" aria-label=\"三合院平面圖\">\n      <g stroke=\"currentColor\" stroke-width=\"1.8\">\n        <rect x=\"70\" y=\"16\" width=\"160\" height=\"40\" fill=\"rgba(232,163,58,.35)\"/>\n        <rect x=\"20\" y=\"16\" width=\"50\" height=\"136\" fill=\"rgba(42,157,143,.25)\"/>\n        <rect x=\"230\" y=\"16\" width=\"50\" height=\"136\" fill=\"rgba(42,157,143,.25)\"/>\n        <rect x=\"70\" y=\"56\" width=\"160\" height=\"96\" fill=\"none\" stroke-dasharray=\"4 3\"/><\/g>\n      <g font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n        <text x=\"150\" y=\"34\">正身<\/text><text x=\"150\" y=\"50\" font-size=\"11\">中間是正廳<\/text><text x=\"150\" y=\"108\">稻埕<\/text>\n        <text x=\"255\" y=\"80\">左護龍<\/text><text x=\"255\" y=\"97\" font-size=\"11\">大的住<\/text>\n        <text x=\"45\" y=\"80\">右護龍<\/text><text x=\"45\" y=\"97\" font-size=\"11\">小的住<\/text><\/g>\n      <text x=\"150\" y=\"176\" fill=\"#E0584B\" font-size=\"11\" text-anchor=\"middle\">從正廳往外看，左手邊是「左」<\/text>\n    <\/svg>\n    <ul class=\"pts\">\n      <li><b>正廳<\/b>：正身中間，供奉神明和祖先牌位、接待客人<\/li>\n      <li><b>護龍<\/b>：兩側，家人起居的臥室；左大右小<\/li>\n      <li><b>稻埕<\/b>：曬穀、乘涼聊天、孩童遊戲、請客、祭拜<\/li>\n      <li>一開始只有正身（一條龍），人口變多才加蓋護龍<\/li>\n    <\/ul>\n    <div class=\"tip\">漢人住屋<b>不是只有<\/b>ㄇ字形三合院；客人<b>不住<\/b>正身房間。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 8<\/div>\n    <h3>傳統住屋：<b>就地取材<\/b><\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><\/div>\n    <table class=\"rank\">\n      <tr><th>住屋<\/th><th>誰、怎麼蓋<\/th><\/tr>\n      <tr><td>石板屋<\/td><td>排灣族（屏東瑪家鄉），冬暖夏涼<\/td><\/tr>\n      <tr><td>地下屋<\/td><td>雅美族（達悟族），蓋得低矮半地下 → <b>躲避強風<\/b><\/td><\/tr>\n      <tr><td>土埆厝<\/td><td>漢人。石塊做基礎，稻稈＋泥土＋水做土磚<\/td><\/tr>\n      <tr><td>竹管仔厝<\/td><td>漢人。竹子當骨架，外面抹泥土<\/td><\/tr>\n      <tr><td>三合院<\/td><td>漢人。磚瓦是<b>人工燒製<\/b>的<\/td><\/tr>\n    <\/table>\n    <div class=\"box\">原住民族材料：茅草、竹子、木頭、石板<br>現代樓房：<b>鋼筋混凝土<\/b>（不是傳統材料）<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 9<\/div>\n    <h3>保存傳統建築：<b>大家一起來<\/b><\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><\/div>\n    <ul class=\"pts\">\n      <li>方法：列為<b>古蹟<\/b>、規畫<b>聚落保存區<\/b>、結合特色變觀光景點<\/li>\n      <li><b>不是<\/b>保存方法：拆除改建百貨公司、公園、西式住屋<\/li>\n      <li>是<b>政府和民間<\/b>共同的責任<\/li>\n      <li>保存老建築、推展文化特色 → 發展<b>觀光旅遊業<\/b><\/li>\n      <li>例：澎湖縣西嶼鄉二崁村，「崁」是高地，地名和<b>地形<\/b>有關<\/li>\n    <\/ul>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 10<\/div>\n    <h3>生活器物：<b>名稱、功用、材料<\/b>一起記<\/h3>\n    <div class=\"src\"><span>複習卷 A<\/span><span>複習卷 B<\/span><span>成績考查<\/span><span class=\"cas\">Cassie 錯過<\/span><\/div>\n    <table class=\"rank\">\n      <tr><th>器物<\/th><th>功用<\/th><th>材料<\/th><\/tr>\n      <tr><td>菜櫥<\/td><td>存放食物、碗盤<\/td><td>木頭<\/td><\/tr>\n      <tr><td>砧板<\/td><td>切菜時墊在下面<\/td><td>木頭<\/td><\/tr>\n      <tr><td>水桶<\/td><td>裝水<\/td><td>木頭<\/td><\/tr>\n      <tr><td>灶<\/td><td>煮飯（像現在的瓦斯爐）<\/td><td>磚、泥土<\/td><\/tr>\n      <tr><td>木杵<\/td><td>搗碎食物<\/td><td>木頭<\/td><\/tr>\n      <tr><td>魚筌<\/td><td>捕魚蝦<\/td><td><b>竹子、藤<\/b>（不是木頭）<\/td><\/tr>\n    <\/table>\n    <div class=\"box\">魚筌用法：直接放進溪裡，用石頭固定；留空隙讓小魚小蝦游出去長大<\/div>\n    <div class=\"tip\">塑膠<b>輕便又便宜<\/b>才取代傳統器物；傳統器物<b>沒有<\/b>比塑膠輕便。塑膠吸管、免洗餐具不環保，要支持減塑。<\/div>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<section class=\"unit\" id=\"u5\">\n<div class=\"uhead\"><span class=\"no\">模擬考卷<\/span><h2>期中模擬考<\/h2><span class=\"note\">依三份考卷常見題型改寫<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card quiz wide\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"qh\">一、是非題（對的畫○，錯的畫✕）<\/div>\n    <ol class=\"q cols\">\n      <li>（　）地圖的圖名，通常依地圖的主題或區域範圍來命名。<\/li>\n      <li>（　）比例尺表示實際距離在地圖上被縮小的程度。<\/li>\n      <li>（　）地圖上的圖例只是為了好看，沒有其他功能。<\/li>\n      <li>（　）看紙本地圖時，也可以點加減號放大地圖。<\/li>\n      <li>（　）臺灣的面積不大，所以各地的氣候都差不多。<\/li>\n      <li>（　）海水不能直接喝，所以海洋不算家鄉的水資源。<\/li>\n      <li>（　）水庫通常建在河流下游、靠近出海口的地方。<\/li>\n      <li>（　）澎湖雨下得比較少，居民選擇種植耐旱的花生。<\/li>\n      <li>（　）保存傳統建築只是政府的責任，民間不需要參與。<\/li>\n      <li>（　）有些家族一開始只蓋正身，家人變多才加蓋護龍。<\/li>\n      <li>（　）傳統生活器物大多比塑膠器物更輕便。<\/li>\n      <li>（　）魚筌編得很密沒有空隙，是為了把大魚小魚全部抓起來。<\/li>\n    <\/ol>\n    <div class=\"qh\">二、選擇題<\/div>\n    <ol class=\"q cols\" start=\"13\">\n      <li>（　）想在地圖上找到「學校東邊的郵局」，需要哪兩項要素？①圖名、比例尺 ②方向標、圖例 ③圖名、圖例 ④比例尺、方向標<\/li>\n      <li>（　）小宇看新北市行政區圖，可以知道什麼？①美食景點 ②捷運路線 ③各區的界線和位置 ④每月雨量<\/li>\n      <li>（　）坐火車從臺南到屏東，窗外大多是一望無際的稻田，這段路多是哪種地形？①平原 ②丘陵 ③山地 ④盆地<\/li>\n      <li>（　）表演地形時，兩邊的同學蹲低，中間的同學站直、頭上平放一本書。他們在表演哪一種地形？①盆地 ②台地 ③平原 ④丘陵<\/li>\n      <li>（　）小晴說：「我的家鄉 1 月平均氣溫超過 20°C，冬天很少下雨。」她的家鄉最可能在哪裡？①基隆 ②宜蘭 ③屏東 ④新北<\/li>\n      <li>（　）關於臺灣的氣候，哪一項<b>錯誤<\/b>？①宜蘭冬天常下雨 ②基隆四季多雨 ③高雄夏季多雨 ④屏東冬天又冷又多雨<\/li>\n      <li>（　）人們通常在河流的哪一段蓋水庫？①上游和中游 ②只有下游 ③出海口 ④上游和下游<\/li>\n      <li>（　）關於家鄉的水資源，哪一項正確？①水資源永遠用不完 ②河川水量會隨季節的雨量改變 ③水庫只能灌溉 ④河水全部流入海洋<\/li>\n      <li>（　）蘭嶼雅美族（達悟族）的地下屋蓋得比較低，是為了什麼？①躲避強風 ②防野獸 ③曬太陽 ④預防淹水<\/li>\n      <li>（　）用石塊做地基，再用稻稈、泥土和水做成土磚蓋成的房子是？①石板屋 ②竹管仔厝 ③土埆厝 ④高腳屋<\/li>\n      <li>（　）三合院正身中間、供奉神明和祖先牌位的地方是？①稻埕 ②正廳 ③護龍 ④廚房<\/li>\n      <li>（　）下列哪一項<b>不是<\/b>保存傳統建築的方法？①列為古蹟 ②規畫為聚落保存區 ③結合特色變成觀光景點 ④拆掉改蓋大賣場<\/li>\n    <\/ol>\n    <div class=\"qh\">三、配合題：把器物的功用和材料代號填進（　）<\/div>\n    <p style=\"margin:4px 0;font-size:14.5px\">功用：Ａ.捕魚蝦　Ｂ.存放食物　Ｃ.切菜時墊在下面　Ｄ.煮飯（像瓦斯爐）　　材料：甲.木頭　乙.竹子和藤　丙.磚和泥土<\/p>\n    <ol class=\"q cols\" start=\"25\">\n      <li>菜櫥：功用（　）材料（　）<\/li>\n      <li>魚筌：功用（　）材料（　）<\/li>\n      <li>灶：功用（　）材料（　）<\/li>\n      <li>砧板：功用（　）材料（　）<\/li>\n    <\/ol>\n    <div class=\"qh\">四、勾選題：關於漢人的傳統住屋，對的打✓<\/div>\n    <ol class=\"q cols\" start=\"29\">\n      <li>（　）稻埕可以曬穀，也是一家人乘涼聊天的地方<\/li>\n      <li>（　）正廳通常供奉神明和祖先牌位<\/li>\n      <li>（　）傳統住屋常用鋼筋混凝土建造<\/li>\n      <li>（　）三合院的磚瓦是人工燒製的<\/li>\n      <li>（　）客人來訪時，通常住在正身的房間<\/li>\n      <li>（　）依「左大右小」，排行大的住右護龍<\/li>\n    <\/ol>\n    <div class=\"qh\">五、素養閱讀題<\/div>\n    <div class=\"passage\">暑假時，小安一家要到臺東池上鄉遊玩。出發前，小安在電子地圖輸入民宿的地址，再點擊加減號放大查看。她切換到另一種模式，看到民宿附近有一大片綠色的田，遠處是顏色很深的高山。民宿老闆說：「這裡地形平坦、水源充足，種出來的米很有名。」<\/div>\n    <ol class=\"q\" start=\"35\">\n      <li>小安切換到哪一種模式，才看得到綠色的田和深色的高山？①衛星模式 ②飛航模式<\/li>\n      <li>池上鄉的稻田位在哪一種地形？①平原 ②丘陵<\/li>\n      <li>民宿老闆說這裡適合種稻的兩個條件是什麼？（　　）和（　　）<\/li>\n      <li>池上鄉位在臺灣的哪一部？①北部 ②東部<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>○<\/li><li>○<\/li><li>✕（圖例表示實際景物）<\/li><li>✕（電子地圖才有）<\/li><li>✕（南北氣候不同）<\/li><li>✕（海洋也是水資源）<\/li><li>✕（上中游）<\/li><li>○<\/li><li>✕（政府和民間一起）<\/li><li>○<\/li><li>✕（塑膠才輕便）<\/li><li>✕（留空隙讓小魚游走）<\/li>\n      <li>②<\/li><li>③<\/li><li>①<\/li><li>②（頂部平坦、四周低）<\/li><li>③<\/li><li>④<\/li><li>①<\/li><li>②<\/li><li>①<\/li><li>③<\/li><li>②<\/li><li>④<\/li>\n      <li>Ｂ、甲<\/li><li>Ａ、乙<\/li><li>Ｄ、丙<\/li><li>Ｃ、甲<\/li>\n      <li>✓<\/li><li>✓<\/li><li>✕<\/li><li>✓<\/li><li>✕<\/li><li>✕（大的住左護龍）<\/li>\n      <li>①<\/li><li>①<\/li><li>地形平坦、水源充足<\/li><li>②<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<footer>依康軒四上社會期中複習卷 A、B 與素養評量單「第一次成績考查（第一～二單元）」整理，模擬考題為改寫自編。<\/footer>\n<\/div>\n<\/body><\/html>"}, {"id": "s-unit", "s": "社會", "name": "單元重點卡", "sub": "第一～二單元＋各課小考", "html": "<!doctype html><html lang=\"zh-Hant\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><style>body{margin:0}<\/style><\/head><body><title>康軒社會四上重點卡<\/title>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n/* Layout: 練習簿方格紙底，每單元一列直式重點卡，最後一張是小考卷 */\n:root{\n  --bg:#EEF2EF; --grid:#DCE5E0; --card:#FFFFFF; --ink:#1F2B33; --ink2:#5A6A70;\n  --teal:#13776F; --teal-l:#E2F1EE; --gold:#E8A33A; --gold-l:#FFF3DC; --red:#C9473B; --blue:#2E66A8;\n  --line:#D5DFDB;\n  --f-display:\"Huninn\",\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  --f-body:\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#121A19; --grid:#1B2624; --card:#1D2826; --ink:#E7EFEC; --ink2:#A3B3AF;\n  --teal:#5FC4B8; --teal-l:#173733; --gold:#F0B65A; --gold-l:#3A2E19; --red:#F08377; --blue:#83B2EA; --line:#2E3D3A; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#121A19; --grid:#1B2624; --card:#1D2826; --ink:#E7EFEC; --ink2:#A3B3AF;\n  --teal:#5FC4B8; --teal-l:#173733; --gold:#F0B65A; --gold-l:#3A2E19; --red:#F08377; --blue:#83B2EA; --line:#2E3D3A; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}\n.wrap{max-width:1240px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\nheader.top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);margin:0;letter-spacing:.02em;text-wrap:balance}\nheader.top p{margin:6px 0 0;color:var(--ink2);max-width:62ch}\nnav.units{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}\nnav.units a{font-family:var(--f-display);text-decoration:none;color:var(--teal);background:var(--card);border:1.5px solid var(--teal);border-radius:999px;padding:5px 14px;font-size:15px}\nnav.units a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\nsection.unit{margin-top:34px}\n.uhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}\n.uhead .no{font-family:var(--f-display);color:#fff;background:var(--teal);border-radius:10px;padding:2px 12px;font-size:18px}\n.uhead h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}\n.uhead .note{color:var(--ink2);font-size:14px}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px;align-items:start}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}\n.card .bar{height:8px;background:var(--teal)}\n.card.quiz .bar{background:var(--gold)}\n.card .in{padding:14px 16px 16px}\n.tag{font-size:12px;color:var(--teal);letter-spacing:.08em}\n.quiz .tag{color:var(--gold)}\n.card h3{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.35;margin:2px 0 4px;text-wrap:balance}\n.card h3 b{color:var(--teal);font-weight:400}\n.sub{color:var(--ink2);font-size:13.5px;margin:0 0 10px}\n.tip{background:var(--gold-l);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:10px}\n.tip b{color:var(--red)}\n.box{background:var(--teal-l);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}\n.big{font-family:var(--f-display);font-size:24px;text-align:center;letter-spacing:.04em;margin:4px 0}\n.pv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px 0;font-size:14px}\n.pv th{font-weight:500;color:var(--ink2);font-size:12px;padding:2px 0}\n.pv td{text-align:center;font-family:var(--f-display);font-size:22px;border:1.5px solid var(--line);padding:2px 0}\n.pv .cut{border-left:3px solid var(--red)}\n.pv .wan{background:var(--teal-l)}\nul.pts{margin:6px 0;padding-left:1.2em}\nul.pts li{margin:3px 0}\n.wrong{color:var(--red);text-decoration:line-through}\n.ok{color:var(--teal);font-weight:700}\nsvg{display:block;max-width:100%;height:auto;margin:6px auto}\nsvg text{font-family:var(--f-body)}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.mono{font-variant-numeric:tabular-nums}\nol.q{margin:4px 0 8px;padding-left:1.4em}\nol.q li{margin:7px 0;font-size:15px}\n.blank{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--ink2);margin:0 2px}\ndetails{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}\nsummary{cursor:pointer;color:var(--teal);font-weight:700;font-size:14.5px}\ndetails ol{padding-left:1.4em;margin:6px 0 0;font-size:14.5px}\n.fr{display:inline-flex;align-items:center;vertical-align:middle;font-variant-numeric:tabular-nums}\n.fr .nd{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;line-height:1.05;margin-left:.08em}\n.fr .nd span:first-child{border-bottom:1.4px solid currentColor;padding:0 .12em}\nfooter{color:var(--ink2);font-size:13px;margin-top:40px}\n@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}\n<\/style>\n\n<div class=\"wrap\">\n<header class=\"top\">\n  <h1>康軒社會 四上 重點卡<\/h1>\n  <p>期中考範圍：第一單元第 1～3 課、第二單元第 1～2 課。每課先看重點卡，最後一張是小考卷。黃底是容易錯的地方。<\/p>\n  <nav class=\"units\">\n    <a href=\"#u1\">一-1 地圖<\/a><a href=\"#u2\">一-2 地形<\/a><a href=\"#u3\">一-3 氣候與水資源<\/a><a href=\"#u4\">二-1 傳統住屋<\/a><a href=\"#u5\">二-2 生活器物<\/a>\n  <\/nav>\n<\/header>\n\n<!-- ===== 一-1 ===== -->\n<section class=\"unit\" id=\"u1\">\n<div class=\"uhead\"><span class=\"no\">第一單元 第 1 課<\/span><h2>家鄉與地圖<\/h2><span class=\"note\">地圖要素、地圖種類、電子地圖<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>地圖四要素：<b>各有各的工作<\/b><\/h3>\n    <svg viewBox=\"0 0 300 150\" aria-label=\"地圖要素示意\">\n      <rect x=\"6\" y=\"6\" width=\"288\" height=\"138\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n      <text x=\"150\" y=\"26\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">新店區觀光導覽圖<\/text>\n      <text x=\"150\" y=\"40\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0584B\">↑ 圖名<\/text>\n      <g transform=\"translate(262,62)\"><polygon points=\"0,-18 6,6 0,0 -6,6\" fill=\"#2A9D8F\"/><text x=\"0\" y=\"-22\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">北<\/text><\/g>\n      <text x=\"262\" y=\"86\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0584B\">方向標<\/text>\n      <g transform=\"translate(18,118)\"><rect width=\"30\" height=\"6\" fill=\"currentColor\"/><rect x=\"30\" width=\"30\" height=\"6\" fill=\"none\" stroke=\"currentColor\"/><text y=\"20\" font-size=\"10\" fill=\"currentColor\">0<\/text><text x=\"56\" y=\"20\" font-size=\"10\" fill=\"currentColor\">2 公里<\/text><\/g>\n      <text x=\"18\" y=\"108\" font-size=\"10\" fill=\"#E0584B\">比例尺<\/text>\n      <g transform=\"translate(170,96)\" font-size=\"10\" fill=\"currentColor\"><rect x=\"0\" y=\"0\" width=\"112\" height=\"40\" rx=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\".8\"/>\n        <circle cx=\"10\" cy=\"12\" r=\"4\" fill=\"#4A86C8\"/><text x=\"18\" y=\"15\">學校<\/text><rect x=\"54\" y=\"8\" width=\"8\" height=\"8\" fill=\"#2A9D8F\"/><text x=\"66\" y=\"15\">公園<\/text>\n        <line x1=\"6\" y1=\"28\" x2=\"18\" y2=\"28\" stroke=\"#E0584B\" stroke-width=\"2\"/><text x=\"22\" y=\"31\">道路<\/text><\/g>\n      <text x=\"226\" y=\"92\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0584B\">圖例<\/text>\n    <\/svg>\n    <ul class=\"pts\">\n      <li><b>圖名<\/b>：這是什麼地圖<\/li>\n      <li><b>圖例<\/b>：符號代表什麼景物<\/li>\n      <li><b>方向標<\/b>：判斷東南西北<\/li>\n      <li><b>比例尺<\/b>：算出兩點的實際距離<\/li>\n    <\/ul>\n    <div class=\"tip\">比例尺<b>不能<\/b>看方向；地圖上<b>不會<\/b>標作者。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>想知道什麼，<b>就看哪種圖<\/b><\/h3>\n    <table class=\"pv\" style=\"font-size:14px\">\n      <tr><th style=\"text-align:left\">想知道…<\/th><th style=\"text-align:left\">看這張<\/th><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:14px;text-align:left;padding:4px 6px\">各區的名稱、界線、位置<\/td><td style=\"font-family:var(--f-body);font-size:14px;text-align:left;padding:4px 6px\"><b>行政區域圖<\/b><\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:14px;text-align:left;padding:4px 6px\">道路、捷運、鐵路怎麼走<\/td><td style=\"font-family:var(--f-body);font-size:14px;text-align:left;padding:4px 6px\"><b>交通路線圖<\/b><\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:14px;text-align:left;padding:4px 6px\">好吃好玩的景點<\/td><td style=\"font-family:var(--f-body);font-size:14px;text-align:left;padding:4px 6px\"><b>觀光導覽圖<\/b><\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:14px;text-align:left;padding:4px 6px\">冷熱、下雨多少<\/td><td style=\"font-family:var(--f-body);font-size:14px;text-align:left;padding:4px 6px\"><b>氣溫圖、雨量圖<\/b><\/td><\/tr>\n    <\/table>\n    <div class=\"tip\">想了解<b>氣候<\/b>不能看行政區域圖。不同種類的地圖，顯示的資訊不一樣。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>家鄉與電子地圖：<b>彩色、可縮放<\/b><\/h3>\n    <ul class=\"pts\">\n      <li>家鄉可以是出生地、成長地、長期生活的地方<\/li>\n      <li>新北市在臺灣<b>北部<\/b>，包圍臺北市和基隆市；花蓮縣在<b>東部<\/b><\/li>\n      <li>電子地圖是<b>彩色<\/b>的，可以搜尋地點、點加減號放大縮小<\/li>\n      <li>地圖模式看得到：街道、河川、商店、學校名稱<\/li>\n      <li>衛星模式：深綠色的地方多半是山地<\/li>\n    <\/ul>\n    <div class=\"tip\">地圖模式<b>看不到<\/b>氣候狀況、班級名稱。電子地圖<b>不是<\/b>黑白的。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第一單元第 1 課 小考<\/h3>\n    <ol class=\"q\">\n      <li>想知道搭捷運到動物園怎麼轉車，要看哪一種地圖？<\/li>\n      <li>地圖上用來判斷東南西北的是什麼？<\/li>\n      <li>是非：從比例尺可以知道地圖上的方位。（　）<\/li>\n      <li>是非：點擊電子地圖的加減號，可以放大或縮小地圖。（　）<\/li>\n      <li>想找家鄉各區的界線和位置，要看哪一種地圖？<\/li>\n      <li>是非：電子地圖的地圖模式可以看到氣候狀況。（　）<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>交通路線圖<\/li><li>方向標<\/li><li>✗（比例尺用來算實際距離）<\/li><li>○<\/li><li>行政區域圖<\/li><li>✗<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<!-- ===== 一-2 ===== -->\n<section class=\"unit\" id=\"u2\">\n<div class=\"uhead\"><span class=\"no\">第一單元 第 2 課<\/span><h2>家鄉的地形<\/h2><span class=\"note\">五種地形、居民活動<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>五種地形：<b>看形狀和高度<\/b><\/h3>\n    <svg viewBox=\"0 0 320 150\" aria-label=\"五種地形剖面\">\n      <line x1=\"4\" y1=\"118\" x2=\"316\" y2=\"118\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n      <path d=\"M4 118 H60 C80 118 86 96 104 96 C122 96 126 118 140 118 L156 118 L174 30 L192 118 H204 L212 82 H252 L260 118 L266 118 L274 72 C282 72 284 104 291 104 C298 104 300 72 308 72 L316 72 V140 H4 Z\" fill=\"rgba(42,157,143,.28)\" stroke=\"currentColor\" stroke-width=\"2\"/>\n      <g font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">\n        <text x=\"32\" y=\"112\">平原<\/text><text x=\"104\" y=\"90\">丘陵<\/text><text x=\"174\" y=\"24\">山地<\/text><text x=\"232\" y=\"76\">台地<\/text><text x=\"291\" y=\"132\" font-size=\"11\">盆地<\/text><\/g>\n      \n      <line x1=\"4\" y1=\"56\" x2=\"316\" y2=\"56\" stroke=\"#E0584B\" stroke-width=\".8\" stroke-dasharray=\"4 3\"/><text x=\"8\" y=\"52\" font-size=\"9\" fill=\"#E0584B\">1000 公尺<\/text>\n    <\/svg>\n    <ul class=\"pts\">\n      <li><b>平原<\/b>：平坦廣闊、一望無際<\/li>\n      <li><b>丘陵<\/b>：低於 1000 公尺、坡度較平緩<\/li>\n      <li><b>山地<\/b>：地勢高聳、超過 1000 公尺<\/li>\n      <li><b>台地<\/b>：頂部平坦、四周是陡坡（像桌子）<\/li>\n      <li><b>盆地<\/b>：四周高、中間低平（像臉盆）<\/li>\n    <\/ul>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>常考四個地方：<b>地形決定做什麼<\/b><\/h3>\n    <table class=\"pv\" style=\"font-size:14px\">\n      <tr><th style=\"text-align:left\">地方<\/th><th style=\"text-align:left\">地形<\/th><th style=\"text-align:left\">看到什麼<\/th><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">臺北市信義區<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">盆地<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">高樓大廈<\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">臺東縣池上鄉<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\"><b>平原<\/b><\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">一大片稻田<\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">新北市石碇區<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\"><b>丘陵<\/b><\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">種茶、製茶<\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">臺中市和平區<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\"><b>山地<\/b><\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">高山果園<\/td><\/tr>\n    <\/table>\n    <div class=\"box\">平原海岸邊：魚塭（高雄茄萣、屏東枋寮）<br>苗栗丘陵：種茶　中央山脈：山地<\/div>\n    <div class=\"tip\">茶園在<b>丘陵<\/b>，不在平原；稻田在<b>平原<\/b>，不在山地。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>情境題：<b>先圈「問的是誰」<\/b><\/h3>\n    <div class=\"box\">育安住在海邊，表哥說：「我家在高山上，附近有很多果園。」<br>問的是<b>表哥家<\/b> → 高山 → <b>臺中市和平區<\/b><\/div>\n    <ul class=\"pts\">\n      <li>地形起伏大的地方，居民活動容易受到限制<\/li>\n      <li>認識地形的方法：實地觀察、空拍照片、閱讀地圖（聽奇幻故事不行）<\/li>\n    <\/ul>\n    <div class=\"tip\">題目裡常出現兩個人，<b>答案只跟被問的那個人有關<\/b>。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第一單元第 2 課 小考<\/h3>\n    <ol class=\"q\">\n      <li>四周高、中間低平的是哪一種地形？<\/li>\n      <li>頂部平坦、四周是陡坡的是哪一種地形？<\/li>\n      <li>石碇區氣候適宜、排水良好，很多人種茶，這是哪一種地形？<\/li>\n      <li>池上鄉看得到一大片稻田，這是哪一種地形？<\/li>\n      <li>是非：平坦廣闊的平原，常可看到茶園。（　）<\/li>\n      <li>洋平家在臺中市和平區，居民的主要活動是什麼？①種茶 ②建魚塭 ③到工廠上班 ④種水果<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>盆地<\/li><li>台地<\/li><li>丘陵<\/li><li>平原<\/li><li>✗（茶園多在丘陵）<\/li><li>④<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<!-- ===== 一-3 ===== -->\n<section class=\"unit\" id=\"u3\">\n<div class=\"uhead\"><span class=\"no\">第一單元 第 3 課<\/span><h2>家鄉的氣候與水資源<\/h2><span class=\"note\">南北氣候、雨量圖、河川與水庫<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>北部和南部：<b>冬天差最多<\/b><\/h3>\n    <svg viewBox=\"0 0 300 150\" aria-label=\"北部與南部氣候比較\">\n      <g font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"90\" y=\"18\">北部（基隆、宜蘭）<\/text><text x=\"225\" y=\"18\">南部（高雄、屏東）<\/text><\/g>\n      <line x1=\"158\" y1=\"8\" x2=\"158\" y2=\"146\" stroke=\"currentColor\" stroke-width=\".8\" stroke-dasharray=\"3 3\"/>\n      <g font-size=\"12\" fill=\"currentColor\"><text x=\"4\" y=\"58\">夏<\/text><text x=\"4\" y=\"116\">冬<\/text><\/g>\n      <g fill=\"#4A86C8\"><path d=\"M60 40 q8 -14 16 0 q4 10 -8 12 q-12 -2 -8 -12z\"/><path d=\"M86 40 q8 -14 16 0 q4 10 -8 12 q-12 -2 -8 -12z\"/><path d=\"M60 98 q8 -14 16 0 q4 10 -8 12 q-12 -2 -8 -12z\"/><path d=\"M86 98 q8 -14 16 0 q4 10 -8 12 q-12 -2 -8 -12z\"/>\n        <path d=\"M200 40 q8 -14 16 0 q4 10 -8 12 q-12 -2 -8 -12z\"/><path d=\"M226 40 q8 -14 16 0 q4 10 -8 12 q-12 -2 -8 -12z\"/><\/g>\n      <circle cx=\"225\" cy=\"104\" r=\"12\" fill=\"#E8A33A\"/>\n      <g font-size=\"11\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"90\" y=\"72\">多雨<\/text><text x=\"90\" y=\"132\">也多雨、較冷<\/text><text x=\"225\" y=\"72\">多雨<\/text><text x=\"225\" y=\"132\">少雨、溫暖<\/text><\/g>\n    <\/svg>\n    <ul class=\"pts\">\n      <li>北部：<b>四季都多雨<\/b>，基隆是「雨港」；冬天較冷<\/li>\n      <li>南部：<b>夏季多雨、冬季少雨<\/b>；全年溫暖，冬天平均也超過 20°C<\/li>\n    <\/ul>\n    <div class=\"tip\">屏東的冬天<b>比<\/b>宜蘭溫暖；不同縣市的氣候可能不同。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>天氣和氣候：<b>一天和很多年<\/b><\/h3>\n    <div class=\"box\"><b>天氣<\/b>：短時間的變化，例如「今天下大雨」<br><b>氣候<\/b>：一個地區<b>長時間的天氣平均狀況<\/b><\/div>\n    <ul class=\"pts\">\n      <li>看雨量圖：找最高的那根柱子是幾月<\/li>\n      <li>雨量圖只看得出雨量，<b>看不出溫度<\/b><\/li>\n      <li>氣候會影響居民的生活方式，例如九份屋頂用防雨的油毛氈；澎湖少雨，種耐旱的花生<\/li>\n    <\/ul>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>水資源：<b>海洋也算<\/b><\/h3>\n    <div class=\"box\">家鄉的水資源：河川、湖泊、水庫、水圳、地下水、<b>海洋<\/b><\/div>\n    <ul class=\"pts\">\n      <li>海水不能直接喝，但可以捕魚、養殖、淡化，<b>一樣是水資源<\/b><\/li>\n      <li>工廠廢水<b>不是<\/b>水資源<\/li>\n      <li>河川水量隨季節和雨量改變：夏季多、冬季少（原因是降雨量）<\/li>\n      <li>河水變紅、發臭 → 多半是工廠排放廢水<\/li>\n    <\/ul>\n    <div class=\"tip\">平時考這個觀念錯了兩次：是非題和勾選題都要記得<b>海洋要選<\/b>。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 4<\/div>\n    <h3>水庫的功能：<b>不只存水<\/b><\/h3>\n    <ul class=\"pts\">\n      <li>提供民生用水、工業用水<\/li>\n      <li>灌溉農田<\/li>\n      <li><b>發電<\/b>（有些水庫）<\/li>\n      <li>休閒娛樂（環湖騎腳踏車）<\/li>\n    <\/ul>\n    <div class=\"box\">水庫建在河川的<b>上、中游<\/b>，不是下游<\/div>\n    <div class=\"tip\">保護水資源是每個人的責任；不能把垃圾丟進水庫或河岸。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第一單元第 3 課 小考<\/h3>\n    <ol class=\"q\">\n      <li>是非：基隆一年四季都多雨。（　）<\/li>\n      <li>高雄的雨量特色是什麼？<\/li>\n      <li>是非：海水太鹹，所以海洋不是家鄉的水資源。（　）<\/li>\n      <li>勾選：水庫有哪些功能？□民生用水 □灌溉 □發電 □丟垃圾<\/li>\n      <li>臺灣的河川冬季水量較少，主要原因是什麼？<\/li>\n      <li>是非：氣候是指一個地區長時間的天氣平均狀況。（　）<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>○<\/li><li>夏季多雨、冬季少雨<\/li><li>✗<\/li><li>民生用水、灌溉、發電<\/li><li>降雨量少<\/li><li>○<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<!-- ===== 二-1 ===== -->\n<section class=\"unit\" id=\"u4\">\n<div class=\"uhead\"><span class=\"no\">第二單元 第 1 課<\/span><h2>家鄉的傳統住屋<\/h2><span class=\"note\">就地取材、三合院、左大右小<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>三合院：<b>ㄇ字形<\/b><\/h3>\n    <svg viewBox=\"0 0 300 200\" aria-label=\"三合院平面圖\">\n      <g stroke=\"currentColor\" stroke-width=\"1.8\">\n        <rect x=\"70\" y=\"20\" width=\"160\" height=\"40\" fill=\"rgba(232,163,58,.35)\"/>\n        <rect x=\"20\" y=\"20\" width=\"50\" height=\"140\" fill=\"rgba(42,157,143,.25)\"/>\n        <rect x=\"230\" y=\"20\" width=\"50\" height=\"140\" fill=\"rgba(42,157,143,.25)\"/>\n        <rect x=\"70\" y=\"60\" width=\"160\" height=\"100\" fill=\"none\" stroke-dasharray=\"4 3\"/><\/g>\n      <g font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n        <text x=\"150\" y=\"45\">正廳（正身）<\/text><text x=\"150\" y=\"115\">稻埕<\/text>\n        <text x=\"255\" y=\"85\">左護龍<\/text><text x=\"255\" y=\"102\" font-size=\"11\">大的住<\/text>\n        <text x=\"45\" y=\"85\">右護龍<\/text><text x=\"45\" y=\"102\" font-size=\"11\">小的住<\/text><\/g>\n      <g fill=\"#E0584B\" font-size=\"11\" text-anchor=\"middle\"><text x=\"150\" y=\"182\">↓ 從正廳往外看：左手邊是「左」<\/text><\/g>\n    <\/svg>\n    <ul class=\"pts\">\n      <li><b>正廳<\/b>：供奉神明、祭拜祖先、接待客人<\/li>\n      <li><b>護龍<\/b>：左右兩側，家人住的房間<\/li>\n      <li><b>稻埕<\/b>：曬穀、乘涼聊天、辦喜事請客<\/li>\n      <li>竹林：防風、防盜；水池：養魚<\/li>\n    <\/ul>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>左大右小：<b>排行大的住左邊<\/b><\/h3>\n    <div class=\"box\">傳統觀念以<b>左為尊<\/b>：<br>大伯 → 左護龍<br>二叔比三叔大 → 二叔住左、三叔住右<\/div>\n    <div class=\"tip\">先想「誰比較大」，大的住<b>左<\/b>。題目寫「二叔住右、三叔住左」就是<b>錯<\/b>的。<\/div>\n    <div class=\"box\">神明和祖先牌位放在<b>正廳<\/b>，不是左邊的房子<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>就地取材：<b>當地有什麼就用什麼<\/b><\/h3>\n    <table class=\"pv\" style=\"font-size:14px\">\n      <tr><th style=\"text-align:left\">誰<\/th><th style=\"text-align:left\">傳統住屋<\/th><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">原住民族<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">石板屋（排灣族、魯凱族；冬暖夏涼）、地下屋（蘭嶼，半地下躲強風）<\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">漢人<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">土埆厝、三合院、竹管仔厝<\/td><\/tr>\n    <\/table>\n    <ul class=\"pts\">\n      <li>材料：竹子、木頭、土石、茅草、石板、磚瓦（磚瓦要人工燒製）<\/li>\n      <li><b>水泥、鋼筋不是<\/b>傳統材料<\/li>\n      <li>保存原因：文化資產、先民智慧、數量不多；政府與民間共同努力<\/li>\n      <li>三合院改建成咖啡館、書店、餐廳 → 發展<b>觀光旅遊業<\/b><\/li>\n    <\/ul>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第二單元第 1 課 小考<\/h3>\n    <ol class=\"q\">\n      <li>三合院左右兩側的房子叫什麼？<\/li>\n      <li>三合院裡可以曬穀、也可以辦喜事請客的地方是？<\/li>\n      <li>三合院中供奉神明和祖先的地方是？<\/li>\n      <li>依「左大右小」，二叔和三叔誰住左護龍？<\/li>\n      <li>下列哪一個不是傳統住屋的材料？①竹子 ②茅草 ③水泥 ④木頭<\/li>\n      <li>是非：石板屋是漢人的傳統住屋。（　）<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>護龍<\/li><li>稻埕<\/li><li>正廳<\/li><li>二叔<\/li><li>③<\/li><li>✗（是原住民族的）<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<!-- ===== 二-2 ===== -->\n<section class=\"unit\" id=\"u5\">\n<div class=\"uhead\"><span class=\"no\">第二單元 第 2 課<\/span><h2>家鄉的傳統生活器物<\/h2><span class=\"note\">器物材料、魚筌、塑膠與減塑<\/span><\/div>\n<div class=\"cards\">\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 1<\/div>\n    <h3>器物和材料：<b>配對要記熟<\/b><\/h3>\n    <table class=\"pv\" style=\"font-size:14px\">\n      <tr><th style=\"text-align:left\">器物<\/th><th style=\"text-align:left\">材料<\/th><th style=\"text-align:left\">用途<\/th><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">砧板、菜櫥<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">木頭<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">切菜切肉、放食物<\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">灶<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">磚、泥土<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">煮菜、蒸粿；餘溫悶地瓜<\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">魚筌<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">竹子、藤<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">放在溪裡抓魚蝦<\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">木杵<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">木頭<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">搗製食物<\/td><\/tr>\n      <tr><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">粽葉<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">植物葉子<\/td><td style=\"font-family:var(--f-body);font-size:13.5px;text-align:left;padding:4px 6px\">包裹食物<\/td><\/tr>\n    <\/table>\n    <div class=\"tip\">生火要用<b>木柴<\/b>；用竹子做器物是<b>就地取材<\/b>，不是政府規定。<\/div>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 2<\/div>\n    <h3>魚筌：<b>留空隙，不抓光<\/b><\/h3>\n    <svg viewBox=\"0 0 300 110\" aria-label=\"魚筌示意\">\n      <path d=\"M20 55 L70 20 H240 Q285 55 240 90 H70 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n      <g stroke=\"currentColor\" stroke-width=\"1\" opacity=\".6\">\n        <line x1=\"100\" y1=\"20\" x2=\"100\" y2=\"90\"/><line x1=\"140\" y1=\"20\" x2=\"140\" y2=\"90\"/><line x1=\"180\" y1=\"20\" x2=\"180\" y2=\"90\"/><line x1=\"220\" y1=\"20\" x2=\"220\" y2=\"90\"/>\n        <line x1=\"70\" y1=\"40\" x2=\"262\" y2=\"40\"/><line x1=\"70\" y1=\"70\" x2=\"262\" y2=\"70\"/><\/g>\n      <g fill=\"#4A86C8\"><ellipse cx=\"160\" cy=\"55\" rx=\"16\" ry=\"7\"/><polygon points=\"176,55 186,48 186,62\"/><\/g>\n      <g fill=\"#E0584B\"><ellipse cx=\"275\" cy=\"30\" rx=\"6\" ry=\"3\"/><polygon points=\"281,30 286,27 286,33\"/><\/g>\n      <text x=\"270\" y=\"16\" font-size=\"10\" fill=\"#E0584B\" text-anchor=\"middle\">小魚游走<\/text>\n    <\/svg>\n    <ul class=\"pts\">\n      <li>用天然的竹子、藤編織而成，放在溪裡用石頭固定<\/li>\n      <li>編織時<b>留空隙<\/b>，讓小魚逃走 → 不會把魚抓光，是先民的智慧<\/li>\n      <li>只能抓魚蝦，<b>不能抓山豬<\/b><\/li>\n    <\/ul>\n  <\/div><\/article>\n\n  <article class=\"card\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">重點 3<\/div>\n    <h3>傳統器物和塑膠：<b>各有優缺點<\/b><\/h3>\n    <div class=\"two\">\n      <div class=\"box\"><b>傳統器物<\/b><br>天然材料<br>用後可回歸大自然<br>有的有一種以上功能<br><span style=\"color:var(--red)\">比較重<\/span><\/div>\n      <div class=\"box\"><b>塑膠器物<\/b><br><b>輕便又便宜<\/b><br>所以大量使用<br>不易分解<br>海洋廢棄物最多<\/div>\n    <\/div>\n    <div class=\"tip\">「傳統器物大多比塑膠製品更輕便」是<b>錯的<\/b>（平時考錯過）。<\/div>\n    <div class=\"box\">減塑：用環保筷、藤編盤、木碗；少用免洗餐具和塑膠袋<\/div>\n  <\/div><\/article>\n\n  <article class=\"card quiz\"><div class=\"bar\"><\/div><div class=\"in\">\n    <div class=\"tag\">小考卷<\/div>\n    <h3>第二單元第 2 課 小考<\/h3>\n    <ol class=\"q\">\n      <li>魚筌通常用什麼材料編織？<\/li>\n      <li>編魚筌時留空隙，是為了什麼？<\/li>\n      <li>傳統的灶用什麼材料做成？<\/li>\n      <li>是非：傳統生活器物大多比塑膠製品更輕便。（　）<\/li>\n      <li>現代人大量使用塑膠器物，主要原因是什麼？<\/li>\n      <li>下列哪一個是對環境友善的行為？①隨意丟垃圾 ②使用環保筷 ③多拿塑膠袋 ④使用免洗餐具<\/li>\n    <\/ol>\n    <details><summary>看答案<\/summary><ol>\n      <li>竹子、藤<\/li><li>讓小魚逃走，不會把魚抓光<\/li><li>磚、泥土<\/li><li>✗（傳統器物比較重）<\/li><li>輕便又便宜<\/li><li>②<\/li><\/ol><\/details>\n  <\/div><\/article>\n<\/div>\n<\/section>\n\n<footer>依康軒版四年級上學期社會第一單元第 1～3 課、第二單元第 1～2 課整理，題目為自編練習題。<\/footer>\n<\/div>\n<\/body><\/html>"}];
const ALLDECKS=()=>[{id:'m-ex',s:'數學',name:'例題步驟',sub:'看考題，一步一步做',steps:1},{id:'s-ex',s:'社會',name:'例題步驟',sub:'看考題，一步一步想',steps:1},...DECKS];

let EXS={i:0,step:0,sub:null};
function exDone(){try{return JSON.parse(lsGet('ctb-exdone')||'{}')}catch(e){return {}}}
function renderSteps(sub){
  const list=EXQ.filter(e=>e.s===sub); const ui=uiGet();
  if(EXS.sub!==sub){EXS={i:Math.min(ui['ex_'+sub]||0,list.length-1),step:0,sub};}

  <div class="excard">
    <div class="row" style="margin-bottom:12px"><span class="tag">${esc(sub)}</span><span class="tag">第 ${EXS.i+1} / ${list.length} 題</span><span class="sp"></span><span class="small muted">${esc(e.g)}</span></div>
    ${pigSay('<b>仔細看一看，用心想一想。</b>先自己讀一次題目，再按「下一步」看怎麼做。')}
    <div class="paper" style="margin-top:20px">${e.q}${e.fig||''}</div>`;
  for(let k=0;k<EXS.step;k++){const st=e.steps[k];html+=`<div class="step"><div class="no">${k+1}</div><div class="tx">${st.t}${st.v||''}</div></div>`;}
  if(EXS.step<total){
    html+=`<div class="exbtns"><button class="btn pri" id="ex-next" style="font-size:18px;padding:12px 24px">${EXS.step===0?'看第 1 步':'下一步（第 '+(EXS.step+1)+' 步）'}</button>${EXS.step>0?'<button class="btn" id="ex-all">全部展開</button>':''}</div>`;
  }else{
    html+=`<div class="exans"><div class="k">答案</div><div class="v">${e.ans}</div></div>${e.tip?`<div class="extip">💡 ${e.tip}</div>`:''}`;
    if(e.try){const t=e.try;html+=`<div class="extry"><h3>換你試試</h3><div class="paper">${t.q}${t.fig||''}</div>
      <div class="opts" id="try-opts" style="margin-top:12px">${t.opts.map((o,i)=>`<button class="opt" data-o="${esc(o)}"><span class="n">${i+1}</span><span>${o}</span></button>`).join('')}</div><div id="try-res"></div></div>`;}
    html+=`<div class="exbtns"><button class="btn" id="ex-again">從第 1 步再看一次</button><span class="sp"></span>${EXS.i<list.length-1?'<button class="btn pri" id="ex-go">下一題 →</button>':''}</div>`;
  }
  html+='</div>';
  box.innerHTML=html;
  const go=i=>{EXS.i=i;EXS.step=0;uiSet({['ex_'+sub]:i});renderSteps(sub);box.scrollIntoView({block:'start'});window.scrollBy(0,-8);};
  box.querySelectorAll('#ex-nav button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  box.querySelector('#ex-nav .on')?.scrollIntoView({inline:'center',block:'nearest'});
  const nx=$('#ex-next'); if(nx) nx.onclick=()=>{EXS.step++;renderSteps(sub);const steps=box.querySelectorAll('.step');(EXS.step>=total?box.querySelector('.exans'):steps[steps.length-1])?.scrollIntoView({behavior:'smooth',block:'center'});};
  const al=$('#ex-all'); if(al) al.onclick=()=>{EXS.step=total;renderSteps(sub);};
  const ag=$('#ex-again'); if(ag) ag.onclick=()=>{EXS.step=0;renderSteps(sub);};
  const gn=$('#ex-go'); if(gn) gn.onclick=()=>go(EXS.i+1);
  const to=$('#try-opts'); if(to){let tries=0;to.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;tries++;const ok=b.dataset.o===e.try.ans;
    if(ok||tries>=2){to.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===e.try.ans)x.classList.add('right')});if(!ok)b.classList.add('wrong');
      $('#try-res').innerHTML=(ok?pigSay(`<b>${tries===1?'答對了！':'第二次答對了！'}</b> ${e.try.why}`):pigSay(`沒關係，看看正確的做法：${e.try.why}`))+(e.try.v||'');
      if(ok&&tries===1){const d=exDone();d[e.id]=1;lsSet('ctb-exdone',JSON.stringify(d));box.querySelector('#ex-nav .on')?.classList.add('done');}
    }else{b.classList.add('wrong');b.disabled=true;$('#try-res').innerHTML=pigSay('再想一想！回去看上面的步驟，用一樣的方法做。');}});}
}

function resizeImage(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('無法讀取圖片（請用 JPG 或 PNG）'));img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

- 照片看不清楚的題目請略過，不要猜。`;

function normalizeCand(a,subj,exam,photoIdx){
  const types=Object.keys(TYPE_NAME); let type=types.includes(a.type)?a.type:'write';
  let opts=Array.isArray(a.opts)?a.opts.map(String):undefined; let ans=a.ans;
  if(type==='check'&&!Array.isArray(ans)) ans=String(ans||'').split(/[、,，\n]/).map(s=>s.trim()).filter(Boolean);
  if(type!=='check') ans=String(ans??'');
  if(type==='tf') ans=/✗|x|X|×|錯/.test(ans)?'✗':'○';
  const c={id:uid(),s:subj,unit:a.unit||'',exam,date:today(),type,q:String(a.q||''),opts,ans,u:a.u||undefined,stu:String(a.stu||''),cause:CAUSES.includes(a.cause)?a.cause:CAUSES[0],exp:String(a.exp||''),hint:String(a.hint||''),hist:[],mastered:false,streak:0,photos:[],_photo:photoIdx,_keep:true};
  if(a.v&&a.v.q&&subj==='數學'){const vt=types.includes(a.v.type)?a.v.type:type;let va=a.v.ans;if(vt==='check'&&!Array.isArray(va))va=String(va||'').split(/[、,，]/).map(s=>s.trim());if(vt!=='check')va=String(va??'');c.v={type:vt,q:String(a.v.q),opts:Array.isArray(a.v.opts)&&a.v.opts.length?a.v.opts.map(String):undefined,ans:va,u:a.v.u||c.u}}
  return c;
}
function drawCands(){
  const box=$('#a-cands');
  if(!CANDS.length){box.innerHTML='';return}
  box.innerHTML=`<h2>確認 AI 找到的錯題（${CANDS.length} 題）</h2><p class="small muted">修改不對的地方，取消勾選不要的題目，再按最下面的「存入錯題本」。</p>`+
  CANDS.map((c,i)=>`<div class="cand"><label class="row" style="font-weight:600"><input type="checkbox" data-k="${i}" ${c._keep?'checked':''} style="width:22px;height:22px"> 第 ${i+1} 題</label>${editorHTML(c,'c'+i+'-')}</div>`).join('')+
  `<div class="actions"><button class="btn pri" id="a-save">存入錯題本</button><button class="btn ghost" id="a-clear">全部放棄</button></div>`;
  box.querySelectorAll('input[type=checkbox][data-k]').forEach(cb=>cb.onchange=()=>{CANDS[+cb.dataset.k]._keep=cb.checked});
  $('#a-clear').onclick=()=>{CANDS=[];drawCands()};
  $('#a-save').onclick=async()=>{
    const keep=[];
    for(let i=0;i<CANDS.length;i++){ if(!CANDS[i]._keep) continue;
      const [n,err]=readEditor('c'+i+'-',CANDS[i]); if(err){toast(`第 ${i+1} 題：${err}`);return} keep.push(n); }
    const photoIds={};
    for(const n of keep){
      const pi=n._photo;
      if(pi!=null&&PICKED[pi]){ if(!photoIds[pi]){photoIds[pi]=uid(); await idb.put(photoIds[pi],PICKED[pi].small)} n.photos=[photoIds[pi]]; }
      delete n._photo; delete n._keep; DB.items.unshift(n);
    }
    save(); CANDS=[]; PICKED=[]; $('#a-thumbs').innerHTML=''; $('#a-files').value=''; drawCands();
    toast(`已存入 ${keep.length} 題`);
  };
}

/* ================= SETTINGS ================= */
let PEDIT='expert';
function renderSettings(){
  const S=DB.settings;
  $('#s-key').value=getKey(); $('#s-model').value=S.model; $('#s-grade').value=S.grade;
  $('#s-key').onchange=e=>{lsSet(LS_KEY,e.target.value.trim());toast(e.target.value.trim()?'API Key 已存在這台裝置':'已移除 API Key')};
  $('#s-eye').onclick=()=>{const k=$('#s-key');k.type=k.type==='password'?'text':'password';$('#s-eye').textContent=k.type==='password'?'顯示':'隱藏'};
  $('#s-model').onchange=e=>{S.model=e.target.value;save()};
  $('#s-grade').onchange=e=>{S.grade=e.target.value.trim()||'四上';save();updateSub()};
  $('#s-test').onclick=async()=>{lsSet(LS_KEY,$('#s-key').value.trim());$('#s-testmsg').innerHTML='<span class="spin"></span>';
    try{const r=await gemini([{text:'請只回覆「連線成功」四個字。'}]);$('#s-testmsg').textContent='✅ '+r.trim().slice(0,20)}catch(err){$('#s-testmsg').textContent='❌ '+err.message}};
  const drawP=()=>{document.querySelectorAll('.stylebtn').forEach(b=>b.classList.toggle('on',b.dataset.p===PEDIT));
    $('#s-plabel').textContent=PEDIT==='expert'?'AI 教師自定義人格指令（家長診斷、照片辨識使用）':'AI 教師自定義人格指令（Cassie 練習時「問豬探長」使用）';
    $('#s-prompt').value=S.prompts[PEDIT]};
  document.querySelectorAll('.stylebtn').forEach(b=>b.onclick=()=>{PEDIT=b.dataset.p;drawP()});
  $('#s-prompt').oninput=e=>{S.prompts[PEDIT]=e.target.value;save()};
  $('#s-reset').onclick=()=>{S.prompts[PEDIT]=PEDIT==='expert'?PROMPT_EXPERT:PROMPT_PIG;save();drawP();toast('已還原預設')};
  drawP();
  const drawS=()=>{
    $('#s-subjs').innerHTML=S.subjects.map((s,i)=>`<div class="subjrow"><input class="t" data-i="${i}" data-f="name" value="${esc(s.name)}" placeholder="科目"><input class="t" data-i="${i}" data-f="ver" value="${esc(s.ver)}" placeholder="出版社"><button class="btn sm ghost" data-del="${i}" title="移除">✕</button></div>`).join('');
    $('#s-subjs').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
      const s=S.subjects[+inp.dataset.i]; const old=s.name; s[inp.dataset.f]=inp.value.trim();
      if(inp.dataset.f==='name'&&old&&s.name&&old!==s.name) DB.items.forEach(it=>{if(it.s===old)it.s=s.name});
      save();updateSub()});
    $('#s-subjs').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s=S.subjects[+b.dataset.del];
      if(DB.items.some(i=>i.s===s.name)){toast(`「${s.name}」還有錯題，不能移除`);return}
      S.subjects.splice(+b.dataset.del,1);save();drawS();updateSub()});
  };
  drawS();
  $('#s-addsubj').onclick=()=>{S.subjects.push({name:'自然',ver:'康軒'});save();drawS();updateSub()};
  $('#s-export').onclick=exportData;
  $('#s-import').onchange=importData;
  $('#s-wipe').onclick=async()=>{if(!confirm('確定清除全部錯題和設定？建議先匯出備份。'))return;if(!confirm('真的要清除嗎？這個動作無法復原。'))return;
    try{localStorage.removeItem(LS_DATA)}catch(e){} await idb.clear(); lsSet(LS_DATA,JSON.stringify({v:1,items:[],settings:DEFAULT_SETTINGS(),bp:{}})); load();toast('已清除');renderSettings()};
  $('#s-info').textContent=`錯題本共 ${DB.items.length} 題（已克服 ${DB.items.filter(i=>i.mastered).length} 題）；新題目 ${BK.length} 題（已克服 ${BK.filter(i=>i.mastered).length} 題）。`;
}
async function exportData(){
  const photos=await idb.all();
  const blob=new Blob([JSON.stringify({app:'cassie-ctb',exported:new Date().toISOString(),data:DB,photos})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`錯題本備份-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); toast('已匯出備份檔');
}
async function importData(e){
  const f=e.target.files[0]; if(!f) return;
  try{const j=JSON.parse(await f.text()); const d=j.data||j; if(!Array.isArray(d.items)) throw new Error('不是錯題本的備份檔');
    if(!confirm(`備份裡有 ${d.items.length} 題。匯入會取代目前的資料，確定嗎？`)) return;
    lsSet(LS_DATA,JSON.stringify({v:1,items:d.items,settings:{...DEFAULT_SETTINGS(),...d.settings},bp:d.bp||{}})); load();
    for(const [k,v] of Object.entries(j.photos||{})) await idb.put(k,v);
    save(); toast('匯入完成'); renderSettings(); updateSub();
  }catch(err){toast('匯入失敗：'+err.message)} finally{e.target.value=''}
}
function updateSub(){ $('#subline').textContent=`${DB.settings.grade}・`+DB.settings.subjects.map(s=>`${s.name}（${s.ver}）`).join(' '); }

/* ---------- boot ---------- */
load(); updateSub();
show(uiGet().view||'practice');
</script>
