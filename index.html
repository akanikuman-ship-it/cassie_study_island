<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="錯題本">
<meta name="theme-color" content="#FBF6EE">
<title>Cassie 錯題本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23F4A6B8'/%3E%3Cellipse cx='32' cy='42' rx='9' ry='6' fill='%23E07A93'/%3E%3Ccircle cx='29' cy='42' r='1.8' fill='%23743246'/%3E%3Ccircle cx='35' cy='42' r='1.8' fill='%23743246'/%3E%3Cpath d='M10 20h44l-6-9H16z' fill='%238A6A4A'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF6EE; --paper:#FFFFFF; --ink:#2B2522; --ink2:#6B615A; --line:#E8DFD3;
  --pig:#E8879F; --pig-d:#C25C78; --pig-l:#FCE5EC;
  --ok:#2F8F5B; --ok-l:#E3F4EA; --bad:#C9433A; --bad-l:#FBE6E3;
  --c1:#C25C78; --c2:#C98A1C; --c3:#3C7DB8;
  --chip:#F3ECE2; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1A18; --paper:#29231F; --ink:#F2ECE6; --ink2:#B7ABA1; --line:#3D3530;
    --pig:#E8879F; --pig-d:#F0A3B7; --pig-l:#3B2A2F;
    --ok:#6CC995; --ok-l:#1F3328; --bad:#F08A80; --bad-l:#3D2522;
    --c1:#F0A3B7; --c2:#E8B65A; --c3:#7DB4E6; --chip:#352E29; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1A18; --paper:#29231F; --ink:#F2ECE6; --ink2:#B7ABA1; --line:#3D3530;
  --pig:#E8879F; --pig-d:#F0A3B7; --pig-l:#3B2A2F;
  --ok:#6CC995; --ok-l:#1F3328; --bad:#F08A80; --bad-l:#3D2522;
  --c1:#F0A3B7; --c2:#E8B65A; --c3:#7DB4E6; --chip:#352E29; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header.top h1{font-size:22px;margin:0;letter-spacing:.02em}
header.top .sub{color:var(--ink2);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:180px;border:0;background:none;padding:6px 4px;border-radius:12px;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--pig-d);background:var(--pig-l)}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
h2{font-size:20px;margin:18px 0 10px}
h3{font-size:17px;margin:14px 0 8px}
.muted{color:var(--ink2)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--pig-d);border-color:var(--pig-d);color:#fff}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 14px;min-height:40px;font-size:15px}
.chip.on{background:var(--pig-d);border-color:var(--pig-d);color:#fff}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.tag.c-概念不懂{background:color-mix(in srgb,var(--c1) 16%,transparent);color:var(--c1)}
.tag.c-讀題漏看{background:color-mix(in srgb,var(--c2) 18%,transparent);color:var(--c2)}
.tag.c-粗心{background:color-mix(in srgb,var(--c3) 16%,transparent);color:var(--c3)}
.tag.done{background:var(--ok-l);color:var(--ok)}
label.f{display:block;font-size:14px;color:var(--ink2);margin:12px 0 4px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.t{min-height:90px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* fractions */
.fr{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .1em}
.fr .w{margin-right:.08em}
.fr .nd{display:inline-flex;flex-direction:column;align-items:center;font-size:.82em;line-height:1.1}
.fr .nd span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em}

/* pig */
.pig{display:flex;gap:12px;align-items:flex-start}
.pig svg{flex:none;width:56px;height:56px}
.bubble{background:var(--pig-l);border-radius:16px;border-top-left-radius:4px;padding:10px 14px;flex:1}
.bubble b{color:var(--pig-d)}

/* practice */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero svg{width:96px;height:96px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--chip);border-radius:12px;padding:8px 14px;font-size:15px}
.stat b{font-size:20px;margin-right:2px}
.qcard{margin-top:14px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.prog{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--pig);border-radius:99px;transition:width .3s}
.qtext{font-size:21px;line-height:1.75;margin:4px 0 16px}
.look{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--pig-d);background:var(--pig-l);border-radius:999px;padding:3px 12px;margin-bottom:8px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.ten{grid-template-columns:repeat(5,1fr)}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:14px 16px;min-height:56px;text-align:left;font-size:19px;display:flex;gap:12px;align-items:center}
.opt .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:15px;color:var(--ink2)}
.opt.big{justify-content:center;font-size:30px;min-height:72px}
.opt.sel{border-color:var(--pig-d);background:var(--pig-l)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt:disabled{cursor:default}
.numin{display:flex;gap:10px;align-items:center}
.numin input{font-size:26px;letter-spacing:.06em;max-width:320px}
.result{margin-top:16px}
.answerbox{border-radius:14px;padding:12px 16px;margin-top:10px}
.answerbox.ok{background:var(--ok-l)}
.answerbox.bad{background:var(--bad-l)}
.bigans{font-size:34px;font-weight:600;letter-spacing:.06em}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chat{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.msg{margin:8px 0;padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap}
.msg.me{margin-left:auto;background:var(--chip)}
.msg.pg{background:var(--pig-l)}
.fig{width:100%;max-width:560px;display:block;margin:4px 0 14px;color:var(--ink)}

/* book */
.statbars{display:grid;gap:8px;margin-top:8px}
.sb{display:grid;grid-template-columns:5.5em 1fr 2.5em;gap:10px;align-items:center;font-size:15px}
.sb .bar{height:12px;background:var(--chip);border-radius:99px;overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:99px}
.items{display:grid;gap:12px;margin-top:14px}
.item .q{font-size:18px;line-height:1.7;margin:6px 0 10px}
.item .ol{margin:0 0 10px;padding-left:0;list-style:none;display:grid;gap:4px;font-size:16px;color:var(--ink2)}
.ab{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.ab dt{color:var(--ink2)}
.ab dd{margin:0}
.ab .stu{color:var(--bad)}
.ab .cor{color:var(--ok);font-weight:600}
.exp{background:var(--chip);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15.5px;white-space:pre-wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
details.more summary{cursor:pointer;color:var(--ink2);font-size:14px;margin-top:8px}
.empty{text-align:center;padding:40px 10px;color:var(--ink2)}

/* settings */
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
.stylebtns{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.stylebtn{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 14px;min-height:44px;display:flex;gap:8px;align-items:center}
.stylebtn .dot{width:12px;height:12px;border-radius:50%}
.stylebtn.on{border-color:var(--pig-d);background:var(--pig-l)}
.subjrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.cand{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--bg)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.photo-view img{max-width:100%;border-radius:12px;margin-top:8px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex}
.modal .sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><use href="#pigface"/></svg>
    <div><h1>Cassie 的錯題本</h1><div class="sub" id="subline">四上・國語 社會 數學</div></div>
  </header>

  <!-- 練習 -->
  <section class="view" id="v-practice">
    <div id="p-home"></div>
    <div id="p-run" hidden></div>
  </section>

  <!-- 錯題本 -->
  <section class="view" id="v-book">
    <div class="chips" id="b-subj"></div>
    <div class="card" style="margin-top:12px">
      <div class="row">
        <select class="t" id="b-unit" style="max-width:220px"></select>
        <select class="t" id="b-state" style="max-width:160px">
          <option value="todo">待練習</option><option value="done">已克服</option><option value="all">全部</option>
        </select>
        <input class="t" id="b-q" placeholder="搜尋題目" style="flex:1;min-width:140px">
      </div>
      <div class="chips" id="b-cause" style="margin-top:10px"></div>
      <div class="statbars" id="b-stats"></div>
    </div>
    <div class="items" id="b-items"></div>
  </section>

  <!-- 新增 -->
  <section class="view" id="v-add">
    <h2>上傳考卷照片</h2>
    <div class="card">
      <div class="grid2">
        <div><label class="f">科目</label><select class="t" id="a-subj"></select></div>
        <div><label class="f">考卷名稱</label><input class="t" id="a-exam" placeholder="例：國語第七課平時考"></div>
      </div>
      <label class="f">照片（可一次選多張，最好是錯題的近照）</label>
      <input type="file" id="a-files" accept="image/*" multiple class="t">
      <div class="thumbs" id="a-thumbs"></div>
      <div class="actions">
        <button class="btn pri" id="a-run">AI 辨識錯題</button>
        <button class="btn" id="a-manual">手動新增一題</button>
      </div>
      <p class="small muted" id="a-msg">需要先在「設定」填入 Gemini API Key。AI 會先找出老師打叉或訂正的題目，你確認、修改後再存入。</p>
    </div>
    <div id="a-cands"></div>
  </section>

  <!-- 設定 -->
  <section class="view" id="v-set">
    <h2>AI 智能助理配置</h2>
    <div class="card">
      <div class="grid2">
        <div>
          <label class="f">Gemini API Key</label>
          <div class="keyrow"><input class="t" id="s-key" type="password" autocomplete="off" placeholder="貼上 API Key"><button class="btn sm" id="s-eye" type="button">顯示</button></div>
          <div class="small muted" style="margin-top:4px">只存在這台裝置的瀏覽器，不會放進備份檔。</div>
        </div>
        <div>
          <label class="f">模型名稱</label>
          <select class="t" id="s-model">
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
          </select>
          <div class="row" style="margin-top:6px"><button class="btn sm" id="s-test">測試連線</button><span class="small muted" id="s-testmsg"></span></div>
        </div>
      </div>
      <label class="f" style="margin-top:18px"><b>快速套用教學風格</b>（點按鈕切換要編輯的指令）</label>
      <div class="stylebtns">
        <button class="stylebtn" data-p="expert"><span class="dot" style="background:#D9483B"></span>精簡專家模式（家長診斷用）</button>
        <button class="stylebtn" data-p="pig"><span class="dot" style="background:#3BA55C"></span>豬探長引導模式（Cassie 練習用）</button>
      </div>
      <label class="f" id="s-plabel">AI 教師自定義人格指令（System Prompt）</label>
      <textarea class="t" id="s-prompt" style="min-height:260px"></textarea>
      <div class="row" style="margin-top:6px"><span class="small muted">最終以輸入框的內容作為 AI 的行為準則。</span><span class="sp"></span><button class="btn sm" id="s-reset">還原預設</button></div>
    </div>

    <h2>年級與版本</h2>
    <div class="card">
      <div class="grid2" style="margin-bottom:8px"><div><label class="f">年級學期</label><input class="t" id="s-grade"></div></div>
      <label class="f">科目與出版社（之後有自然平時考，在這裡加一科就能用）</label>
      <div id="s-subjs"></div>
      <button class="btn sm" id="s-addsubj">＋ 新增科目</button>
    </div>

    <h2>資料備份</h2>
    <div class="card">
      <p class="small muted" style="margin-top:0">錯題存在這台 iPad 的瀏覽器裡。清除 Safari 網站資料會一起清掉，建議每週匯出一次備份。</p>
      <div class="actions" style="margin-top:0">
        <button class="btn" id="s-export">匯出備份</button>
        <label class="btn" for="s-import">匯入備份</label><input type="file" id="s-import" accept="application/json,.json" hidden>
        <span class="sp"></span>
        <button class="btn ghost" id="s-wipe" style="color:var(--bad)">清除全部資料</button>
      </div>
      <p class="small muted" id="s-info"></p>
    </div>
  </section>
</div>

<nav class="tabs">
  <button data-v="practice"><svg viewBox="0 0 64 64"><use href="#pigface"/></svg>練習</button>
  <button data-v="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13v2H6"/><path d="M9 8h6M9 12h4"/></svg>錯題本</button>
  <button data-v="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M8 6l1.5-2h5L16 6"/><circle cx="12" cy="13" r="3.5"/></svg>新增錯題</button>
  <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="pigface" viewBox="0 0 64 64">
    <ellipse cx="14" cy="26" rx="6" ry="8" fill="#E8879F" transform="rotate(-25 14 26)"/>
    <ellipse cx="50" cy="26" rx="6" ry="8" fill="#E8879F" transform="rotate(25 50 26)"/>
    <circle cx="32" cy="37" r="21" fill="#F6B3C3"/>
    <ellipse cx="32" cy="44" rx="9.5" ry="6.5" fill="#E8879F"/>
    <ellipse cx="28.5" cy="44" rx="1.8" ry="2.4" fill="#7A3347"/>
    <ellipse cx="35.5" cy="44" rx="1.8" ry="2.4" fill="#7A3347"/>
    <circle cx="24" cy="33" r="2.6" fill="#3A2A24"/>
    <circle cx="40" cy="33" r="2.6" fill="#3A2A24"/>
    <circle cx="40" cy="33" r="6.5" fill="none" stroke="#5B4636" stroke-width="2"/>
    <path d="M45 38l6 7" stroke="#5B4636" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M12 20c4-10 36-10 40 0z" fill="#9C7B57"/>
    <path d="M10 20h44" stroke="#7D5F42" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 12l8-5 8 5" fill="none" stroke="#7D5F42" stroke-width="2"/>
  </symbol>
</svg>

<script>
const SEED_DATE = '2026-10-30';
const EX = {
  KA: '國語期中平時複習考（第一至三課）',
  KB: '國語期中平時複習考（第四至六課）',

<script>

const PROMPT_EXPERT = `你是一位精通台灣國小教材的專業導師。
【核心準則】：
1. 嚴格對齊：必須根據使用者提供的「年級」與「出版社版本」之單元架構進行診斷。
2. 風格：精簡專家模式。語氣冷靜專業，不使用冗長贅字，直擊問題核心。
3. 診斷要求：
  ● 定位錯誤：直接指出錯誤的知識點或邏輯缺漏。
  ● 解題步驟：提供邏輯嚴密、分步驟的正確解法。
  ● 教材關聯：簡短說明此題對應該版本的哪一個重點觀念。
  ● 錯因判斷：從「概念不懂／讀題漏看／粗心」選一個，並用一句話說明理由。
4. 呈現方式：強制使用『列點』或『短句』，確保資訊密度高且易於閱讀。使用繁體中文。`;
const PROMPT_PIG = `你是「豬探長」，陪四年級的 Cassie 訂正錯題的偵探老師。口頭禪是「仔細看一看，用心想一想」。
【陪伴規則】：
1. 一次只問一個小問題，句子短、用詞簡單，使用繁體中文。
2. 先問「你覺得呢？」讓她說想法，再引導。
3. 絕對不要先說出答案。她答對了才確認，並用一兩句話說明為什麼對。
4. 題目很長時，帶她「仔細看一看」：先圈出題目在問什麼、有哪些條件；再「用心想一想」：一個選項一個選項檢查。

const LS_DATA='ctb-data-v1', LS_KEY='ctb-gemini-key', LS_UI='ctb-ui';

/* ---------- storage ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
let DB;
function load(){

  if(!d||!Array.isArray(d.items)){

function save(){ if(!lsSet(LS_DATA,JSON.stringify(DB))) toast('儲存失敗：瀏覽器空間不足或被封鎖'); }
const getKey=()=>lsGet(LS_KEY)||'';

/* IndexedDB for photos */
const idb={db:null,
  open(){return new Promise((res)=>{ if(this.db) return res(this.db);
    try{const r=indexedDB.open('ctb-photos',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('p');
      r.onsuccess=()=>{this.db=r.result;res(this.db)}; r.onerror=()=>res(null);
    }catch(e){res(null)}})},
  async put(k,v){const db=await this.open(); if(!db) return false; return new Promise(r=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)})},
  async get(k){const db=await this.open(); if(!db) return null; return new Promise(r=>{const q=db.transaction('p').objectStore('p').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})},
  async del(k){const db=await this.open(); if(!db) return; db.transaction('p','readwrite').objectStore('p').delete(k)},
  async all(){const db=await this.open(); if(!db) return {}; return new Promise(r=>{const out={};const c=db.transaction('p').objectStore('p').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else r(out)};c.onerror=()=>r(out)})},
  async clear(){const db=await this.open(); if(!db) return; db.transaction('p','readwrite').objectStore('p').clear()}
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

}
const plain=s=>String(s??'').replace(/\{([^|{}]*)\|([^|{}]+)\|([^|{}]+)\}/g,(m,w,n,d)=>(w?w+'又':'')+n+'/'+d);
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- figure (segment diagram) ---------- */
function figSVG(f){
  if(!f) return '';
  const W=560,H=176,x0=40,x1=W-40,y=86;
  const X=i=>x0+(x1-x0)*f.pos[i];
  let s=`<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="路線圖"><g stroke="currentColor" fill="none" stroke-width="2"><line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;
  f.pts.forEach((p,i)=>{s+=`<line x1="${X(i)}" y1="${y-7}" x2="${X(i)}" y2="${y+7}"/>`});
  f.arcs.forEach(([a,b,lab,where])=>{
    const xa=X(a),xb=X(b),mx=(xa+xb)/2;
    if(where==='bottom'){ s+=`<path d="M${xa} ${y+12} V${y+56} H${xb} V${y+12}" stroke-dasharray="4 4"/>`; }
    else{ const yy=where==='top2'?y-34:y-52; s+=`<path d="M${xa} ${y-10} V${yy} H${xb} V${y-10}" stroke-dasharray="4 4"/>`; }
  });
  s+='</g><g fill="currentColor" font-size="17" text-anchor="middle">';
  f.pts.forEach((p,i)=>{s+=`<text x="${X(i)}" y="${y+46}">${esc(p)}</text>`});
  f.arcs.forEach(([a,b,lab,where])=>{
    const mx=(X(a)+X(b))/2;
    if(where==='bottom') s+=`<text x="${mx}" y="${y+76}" font-size="15">${esc(lab)}</text>`;
    else{const yy=where==='top2'?y-34:y-52; s+=`<rect x="${mx-44}" y="${yy-13}" width="88" height="24" rx="6" fill="var(--paper)"/><text x="${mx}" y="${yy+5}" font-size="15">${esc(lab)}</text>`;}
  });
  return s+'</g></svg>';
}

/* ---------- Gemini ---------- */
async function gemini(parts,{system='',json=false,history=null}={}){
  const key=getKey(); if(!key) throw new Error('還沒有設定 Gemini API Key');
  const model=DB.settings.model||'gemini-2.5-flash';
  const body={contents: history? history : [{role:'user',parts}]};
  if(system) body.system_instruction={parts:[{text:system}]};
  if(json) body.generationConfig={responseMimeType:'application/json'};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((j.error&&j.error.message)||('連線失敗 '+r.status));
  const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  if(!txt) throw new Error('AI 沒有回覆內容');
  return txt;
}

}

function startRun(subj,n){
  let pool=DB.items.filter(i=>!i.mastered&&(subj==='全部'||i.s===subj));

  const last=i=>i.hist.length?i.hist[i.hist.length-1].t:0;
  pool.sort((a,b)=>((a.streak||0)-(b.streak||0))||(last(a)-last(b))||(Math.random()-.5));
  RUN={queue:pool.slice(0,n).map(i=>({id:i.id,variant:false})),idx:0,ok:0,chat:[]};
  $('#p-home').hidden=true; $('#p-run').hidden=false; renderQ();
}
function curQ(){const e=RUN.queue[RUN.idx];const it=DB.items.find(i=>i.id===e.id);if(!it) return null;
  const src=e.variant&&it.v? {...it,...it.v,isVariant:true}:{...it,isVariant:false};
  return {e,it,q:src};}
function renderQ(){
  const box=$('#p-run');
  if(RUN.idx>=RUN.queue.length){return renderEnd()}
  const {e,it,q}=curQ(); RUN.state={tries:0,sel:[],done:false}; RUN.chat=[];
  const total=RUN.queue.length;
  let opts='';
  if(q.type==='tf') opts=`<div class="opts two">${['○','✗'].map(o=>`<button class="opt big" data-o="${o}">${o}</button>`).join('')}</div>`;
  else if(q.type==='choice'){
    const cls=q.opts.length===3&&q.opts.every(o=>o.length<=2)?'three':'';
    opts=`<div class="opts ${cls}">${q.opts.map((o,i)=>`<button class="opt ${cls?'big':''}" data-o="${esc(o)}">${cls?'':`<span class="n">${i+1}</span>`}<span>${fmt(o)}</span></button>`).join('')}</div>`;
  }
  else if(q.type==='check'){
    const ten=q.opts.length>=8&&q.opts.every(o=>o.length<=2);
    opts=`<div class="opts ${ten?'ten':''}">${q.opts.map((o,i)=>`<button class="opt ${ten?'big':''}" data-o="${esc(o)}">${ten?'':`<span class="n">☐</span>`}<span>${fmt(o)}</span></button>`).join('')}</div><div class="actions"><button class="btn pri" id="q-submit">選好了，送出</button></div>`;
  }
  else if(q.type==='num') opts=`<div class="numin"><input class="t" id="q-num" inputmode="decimal" autocomplete="off" placeholder="寫答案">${q.u?`<span style="font-size:20px">${esc(q.u)}</span>`:''}<button class="btn pri" id="q-submit">送出</button></div>`;
  else if(q.type==='write') opts=pigSay('請拿紙筆，<b>一筆一畫</b>寫寫看。寫好了再按「看答案」。')+`<div class="actions"><button class="btn pri" id="q-reveal">我寫好了，看答案</button></div>`;
  box.innerHTML=`
  <div class="row"><button class="btn sm ghost" id="q-quit">← 結束</button><span class="sp"></span><span class="muted small">第 ${RUN.idx+1} / ${total} 題</span></div>
  <div class="prog"><i style="width:${(RUN.idx/total)*100}%"></i></div>
  <div class="card qcard">
    <div class="qhead"><span class="tag">${esc(it.s)}</span><span class="tag">${esc(it.unit||'')}</span>${q.isVariant?'<span class="tag" style="background:var(--pig-l);color:var(--pig-d)">換數字挑戰</span>':''}</div>
    ${isLong(q.q)?`<div class="look">🔍 仔細看一看：先找出題目在問什麼</div>`:''}
    <div class="qtext">${fmt(q.q)}</div>
    ${figSVG(q.fig)}
    <div id="q-area">${opts}</div>
    <div class="result" id="q-res"></div>
    <div class="actions" id="q-help">
      <button class="btn sm" id="q-hint">💡 豬探長的提示</button>
      ${getKey()?'<button class="btn sm" id="q-chat">🐷 問豬探長</button>':''}
    </div>
    <div id="q-chatbox"></div>
  </div>`;
  $('#q-quit').onclick=()=>{RUN=null;renderPracticeHome()};
  $('#q-hint').onclick=()=>{ $('#q-res').innerHTML=pigSay(`<b>仔細看一看，用心想一想。</b><br>${fmt(hintOf(it,q))}`); };
  if($('#q-chat')) $('#q-chat').onclick=openChat;
  const area=$('#q-area');
  if(q.type==='tf'||q.type==='choice') area.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.o,b));
  if(q.type==='check'){
    area.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(RUN.state.done) return; b.classList.toggle('sel'); const n=b.querySelector('.n'); if(n) n.textContent=b.classList.contains('sel')?'☑':'☐'; });
    $('#q-submit').onclick=()=>{const sel=[...area.querySelectorAll('.opt.sel')].map(b=>b.dataset.o); if(!sel.length){toast('至少選一個喔');return} answer(sel)};
  }
  if(q.type==='num'){ const inp=$('#q-num'); inp.focus({preventScroll:true}); inp.onkeydown=ev=>{if(ev.key==='Enter')$('#q-submit').click()};
    $('#q-submit').onclick=()=>{ if(!inp.value.trim()){toast('先寫答案喔');return} answer(inp.value) }; }
  if(q.type==='write') $('#q-reveal').onclick=revealWrite;
}
function isRight(q,v){
  if(q.type==='check'){const a=[...q.ans].sort().join('|');return [...v].sort().join('|')===a}
  if(q.type==='num'){const ok=[q.ans,...(q.acc||[])].map(normNum);return ok.includes(normNum(v))}
  return v===q.ans;
}
function answer(v,btn){
  const {e,it,q}=curQ(); const st=RUN.state; if(st.done) return;
  st.tries++;
  const right=isRight(q,v);
  const area=$('#q-area');
  if(right){
    st.done=true;
    if(btn) btn.classList.add('right');
    if(q.type==='check') area.querySelectorAll('.opt').forEach(b=>{if(q.ans.includes(b.dataset.o)) b.classList.add('right')});
    lockOpts();
    record(it,st.tries===1);
    finishCard(true);
  }else{
    if(btn){btn.classList.add('wrong');btn.disabled=true}
    if(st.tries===1){
      if(q.type==='check') area.querySelectorAll('.opt.sel').forEach(b=>{b.classList.remove('sel');const n=b.querySelector('.n');if(n)n.textContent='☐'});
      if(q.type==='num') $('#q-num').select();
      $('#q-res').innerHTML=pigSay(`嗯…還不是喔。<b>仔細看一看，用心想一想。</b><br>${fmt(hintOf(it,curQ().q))}<br>再試一次！`);
    }else{
      st.done=true; lockOpts();
      if(q.type==='tf'||q.type==='choice') area.querySelectorAll('.opt').forEach(b=>{if(b.dataset.o===q.ans) b.classList.add('right')});
      if(q.type==='check') area.querySelectorAll('.opt').forEach(b=>{if(q.ans.includes(b.dataset.o)) b.classList.add('right')});
      record(it,false);
      finishCard(false);
    }
  }
}
function lockOpts(){ $('#q-area').querySelectorAll('.opt,#q-submit,#q-num').forEach(b=>b.disabled=true); }
function revealWrite(){
  const {it,q}=curQ();
  $('#q-area').innerHTML=`<div class="answerbox ok"><div class="muted small">正確答案</div><div class="bigans">${fmt(q.ans)}</div></div>
    <div class="exp">${fmt(it.exp||'')}</div>
    <p style="margin:14px 0 6px">和你寫的對照看看，每一筆都一樣嗎？</p>
    <div class="actions" style="margin-top:4px"><button class="btn ok" id="w-ok">我寫對了</button><button class="btn" id="w-bad">有寫錯，我再練習</button></div>`;
  $('#w-ok').onclick=()=>{record(it,true);RUN.state.done=true;finishCard(true,true)};
  $('#w-bad').onclick=()=>{record(it,false);RUN.state.done=true;finishCard(false,true)};
}
function record(it,ok){
  it.hist.push({t:Date.now(),ok});
  it.streak=ok?(it.streak||0)+1:0;
  const need=2;
  const wasM=it.mastered; it.mastered=it.streak>=need;
  if(ok) RUN.ok++;
  save();
  if(it.mastered&&!wasM) setTimeout(()=>toast('🎉 這題已克服！'),300);
}
function finishCard(ok,isWrite){
  const {e,it,q}=curQ();
  const praise=['答對了！','好厲害！','完全正確！','你有仔細看喔！'][Math.floor(Math.random()*4)];
  let html='';
  if(!isWrite){
    html+= ok? pigSay(`<b>${RUN.state.tries>1?'第二次答對了！有用心想喔。':praise}</b>${it.mastered?' 這題已經克服了！':''}`)
             : pigSay(`沒關係，我們一起看答案。<b>錯了才知道哪裡要加強！</b>`);
    html+=`<div class="answerbox ${ok?'ok':'bad'}"><div class="muted small">正確答案</div><div style="font-size:20px;font-weight:600">${fmt(ansText(q))}</div></div>`;
    if(!q.isVariant&&it.exp) html+=`<div class="exp">${fmt(it.exp)}</div>`;
  }else{
    html+= pigSay(ok?`<b>${praise}</b>`:'寫錯沒關係，把正確的字再寫三次，下次就會了！');
  }
  const canVar= ok && it.v && !e.variant && !RUN.queue.some((x,i)=>i>RUN.idx&&x.id===it.id&&x.variant);
  html+=`<div class="actions">${canVar?'<button class="btn" id="q-var">換數字再挑戰一題</button>':''}<button class="btn pri" id="q-next">${RUN.idx+1>=RUN.queue.length&&!canVar?'完成':'下一題'} →</button></div>`;
  $('#q-res').innerHTML=html;
  if(e.variant&&q.isVariant){ /* show variant explanation note */ }
  $('#q-help').querySelector('#q-hint')?.remove();
  if(canVar) $('#q-var').onclick=()=>{RUN.queue.splice(RUN.idx+1,0,{id:it.id,variant:true});RUN.idx++;renderQ()};
  $('#q-next').onclick=()=>{RUN.idx++;renderQ()};
  $('#q-res').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderEnd(){
  const total=RUN.queue.length, ok=RUN.ok;
  $('#p-run').innerHTML=`<div class="card" style="margin-top:14px;text-align:center">
    <svg viewBox="0 0 64 64" width="110" height="110"><use href="#pigface"/></svg>
    <h2 style="margin-top:6px">練習完成！</h2>
    <p style="font-size:19px">這次 ${total} 題，第一次就答對 <b style="color:var(--ok)">${ok}</b> 題。</p>
    <p class="muted">答對兩次的題目會變成「已克服」。明天再來破案吧！</p>
    <div class="actions" style="justify-content:center"><button class="btn pri" id="e-home">回練習首頁</button></div></div>`;
  $('#e-home').onclick=()=>{RUN=null;renderPracticeHome()};
}
/* chat with 豬探長 */
function openChat(){
  const box=$('#q-chatbox');
  if(box.innerHTML){box.innerHTML='';return}
  box.innerHTML=`<div class="chat"><div id="c-msgs"></div>
    <div class="row" style="margin-top:8px"><input class="t" id="c-in" placeholder="跟豬探長說你的想法…" style="flex:1"><button class="btn pri" id="c-send">送出</button></div></div>`;
  const draw=()=>{$('#c-msgs').innerHTML=RUN.chat.map(m=>`<div class="msg ${m.role==='user'?'me':'pg'}">${esc(m.text)}</div>`).join('')};
  const send=async(text)=>{
    const {it,q}=curQ();
    if(text) RUN.chat.push({role:'user',text});
    draw(); $('#c-msgs').insertAdjacentHTML('beforeend','<div class="msg pg"><span class="spin"></span></div>');
    const sys=DB.settings.prompts.pig+`\n\n【這一題的資料（只給你看，不可以直接說出正確答案）】\n${ctxLine(it.s)}\n${itemBrief(q)}\nCassie 上次考試的答案：${plain(it.stu||'')}\n錯因：${it.cause||''}`;
    const hist=RUN.chat.length?RUN.chat.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]})):[{role:'user',parts:[{text:'（Cassie 打開了這一題，請你用一句話打招呼，然後問她「你覺得呢？」）'}]}];
    try{const r=await gemini(null,{system:sys,history:hist});RUN.chat.push({role:'model',text:r.trim()})}
    catch(err){RUN.chat.push({role:'model',text:'豬探長暫時連不上線：'+err.message})}
    draw(); $('#c-msgs').lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  $('#c-send').onclick=()=>{const v=$('#c-in').value.trim();if(!v)return;$('#c-in').value='';send(v)};
  $('#c-in').onkeydown=ev=>{if(ev.key==='Enter'&&!ev.isComposing)$('#c-send').click()};
  send(null);
}

/* ================= BOOK ================= */
function renderBook(){
  const ui=uiGet(); const subj=ui.bSubj&&subjNames().concat('全部').includes(ui.bSubj)?ui.bSubj:'全部';
  const cause=ui.bCause||'全部', state=ui.bState||'todo', unit=ui.bUnit||'全部';
  $('#b-subj').innerHTML=['全部',...subjNames()].map(s=>`<button class="chip ${s===subj?'on':''}" data-s="${esc(s)}">${esc(s)}（${DB.items.filter(i=>s==='全部'||i.s===s).length}）</button>`).join('');
  $('#b-subj').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{uiSet({bSubj:b.dataset.s,bUnit:'全部'});renderBook()});
  const inSubj=DB.items.filter(i=>subj==='全部'||i.s===subj);
  const units=[...new Set(inSubj.map(i=>i.unit).filter(Boolean))];
  $('#b-unit').innerHTML=['全部',...units].map(u=>`<option ${u===unit?'selected':''} value="${esc(u)}">${u==='全部'?'全部單元':esc(u)}</option>`).join('');
  $('#b-unit').onchange=e=>{uiSet({bUnit:e.target.value});renderBook()};
  $('#b-state').value=state; $('#b-state').onchange=e=>{uiSet({bState:e.target.value});renderBook()};
  $('#b-cause').innerHTML=['全部',...CAUSES].map(c=>`<button class="chip ${c===cause?'on':''}" data-c="${c}">${c==='全部'?'全部錯因':c}</button>`).join('');
  $('#b-cause').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{uiSet({bCause:b.dataset.c});renderBook()});
  // stats
  const base=inSubj.filter(i=>unit==='全部'||i.unit===unit);
  const max=Math.max(1,...CAUSES.map(c=>base.filter(i=>i.cause===c).length));
  $('#b-stats').innerHTML=`<div class="small muted" style="margin-top:10px">錯因統計（${esc(subj)}${unit!=='全部'?'・'+esc(unit):''}，共 ${base.length} 題，已克服 ${base.filter(i=>i.mastered).length} 題）</div>`+
    CAUSES.map(c=>{const n=base.filter(i=>i.cause===c).length;return `<div class="sb"><span>${c}</span><span class="bar"><i style="width:${n/max*100}%;background:${CAUSE_COLOR[c]}"></i></span><span>${n}</span></div>`}).join('');
  drawItems();
  $('#b-q').oninput=drawItems;
}

      <dl class="ab"><dt>她的答案</dt><dd class="stu">${fmt(it.stu||'—')}</dd><dt>正確答案</dt><dd class="cor">${fmt(ansText(it))}</dd></dl>
      ${it.exp?`<div class="exp">${fmt(it.exp)}</div>`:''}

        <div class="small"><b>考卷：</b>${esc(it.exam||'—')}</div>
        <div class="small"><b>練習：</b>${n?`${n} 次，答對 ${okN} 次，目前連續答對 ${it.streak||0} 次`:'還沒練習'}</div>
        ${it.v?`<div class="small"><b>換數字題：</b>${fmt(it.v.q)}（答案：${fmt(ansText(it.v))}）</div>`:''}
      </details>
      <div class="toolbar">
        <select class="t" data-act="cause" style="max-width:150px;min-height:36px;padding:4px 10px">${CAUSES.map(c=>`<option ${c===it.cause?'selected':''}>${c}</option>`).join('')}</select>
        <button class="btn sm" data-act="edit">編輯</button>

        ${it.photos&&it.photos.length?'<button class="btn sm" data-act="photo">看照片</button>':''}
        <button class="btn sm" data-act="toggle">${it.mastered?'改回待練習':'標記已克服'}</button>

    card.querySelector('[data-act="diag"]').onclick=e=>diagnose(it,e.target);
    const ph=card.querySelector('[data-act="photo"]'); if(ph) ph.onclick=()=>showPhotos(it);

async function diagnose(it,btn){
  if(!getKey()){toast('請先到「設定」填入 Gemini API Key');return}
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 診斷中';
  try{
    const r=await gemini([{text:`${ctxLine(it.s)}\n${itemBrief(it)}\n學生的答案：${plain(it.stu||'')}\n請診斷這一題。`}],{system:DB.settings.prompts.expert});
    it.diag=r.trim(); save(); renderBook(); toast('診斷完成，已存在題目下方');
  }catch(err){toast(err.message);btn.disabled=false;btn.textContent='AI 診斷'}
}
async function showPhotos(it){

    <div><label class="f">她的答案</label><textarea class="t" id="${pfx}stu" style="min-height:60px">${esc(it.stu||'')}</textarea></div>
  </div>
  <div class="grid2"><div><label class="f">單位（填數字題用，例如 元、度）</label><input class="t" id="${pfx}u" value="${esc(it.u||'')}"></div><div><label class="f">考卷名稱</label><input class="t" id="${pfx}exam" value="${esc(it.exam||'')}"></div></div>
  <label class="f">說明（給家長看的精簡解析）</label><textarea class="t" id="${pfx}exp" style="min-height:70px">${esc(it.exp||'')}</textarea>
  <label class="f">豬探長提示（不能說出答案）</label><textarea class="t" id="${pfx}hint" style="min-height:60px">${esc(it.hint||'')}</textarea>`;
}
function readEditor(pfx,base){
  const g=k=>document.getElementById(pfx+k).value.trim();
  const type=g('type'); const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  let opts=lines(g('opts')); let ans=g('ans');
  if(type==='tf'){ans=/✗|x|X|×|錯|叉/.test(ans)?'✗':'○';opts=undefined}
  if(type==='check') ans=lines(ans);
  if(type==='num'||type==='write') opts=undefined;
  const it={...base,s:g('s'),unit:g('unit'),type,cause:g('cause'),q:g('q'),opts,ans,stu:g('stu'),u:g('u')||undefined,exam:g('exam'),exp:g('exp'),hint:g('hint')};
  if(!it.q) return [null,'題目不能空白'];
  if((type==='choice'||type==='check')&&(!opts||opts.length<2)) return [null,'選擇題至少要有兩個選項'];
  if(type==='choice'&&!opts.includes(ans)) return [null,'正確答案要和其中一個選項文字完全一樣'];
  if(type==='check'&&!ans.every(a=>opts.includes(a))) return [null,'勾選題的每個正確答案都要和選項文字一樣'];
  if(!it.ans||(Array.isArray(it.ans)&&!it.ans.length)) return [null,'請填正確答案'];
  return [it,null];
}
function openEditor(it){
  openModal(`<div class="row"><h3 style="margin:0">${it?'編輯錯題':'新增錯題'}</h3><span class="sp"></span><button class="btn sm" id="m-close">取消</button></div>${editorHTML(it||{s:subjNames()[0],type:'choice',cause:CAUSES[0]},'e-')}
    <div class="actions"><button class="btn pri" id="m-save">儲存</button></div>`);
  $('#m-close').onclick=closeModal;
  $('#m-save').onclick=()=>{
    const base=it||{id:uid(),date:today(),hist:[],mastered:false,streak:0,photos:[]};
    const [n,err]=readEditor('e-',base); if(err){toast(err);return}
    if(it){Object.assign(it,n)}else DB.items.unshift(n);
    save(); closeModal(); toast('已儲存'); if($('#v-book').classList.contains('on')) renderBook();
  };
}

/* ================= ADD (photo → AI) ================= */
let PICKED=[]; let CANDS=[];
function renderAdd(){
  $('#a-subj').innerHTML=subjNames().map(s=>`<option>${esc(s)}</option>`).join('');
  $('#a-msg').textContent=getKey()?'AI 會先找出老師打叉或訂正的題目，你確認、修改後再存入錯題本。':'需要先在「設定」填入 Gemini API Key 才能用 AI 辨識；也可以先手動新增。';
  drawCands();
}
function resizeImage(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('無法讀取圖片（請用 JPG 或 PNG）'));img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
$('#a-files').onchange=async e=>{
  PICKED=[]; $('#a-thumbs').innerHTML='';
  for(const f of e.target.files){ try{ const big=await resizeImage(f,1600,.85); const small=await resizeImage(f,1100,.72); PICKED.push({big,small}); $('#a-thumbs').insertAdjacentHTML('beforeend',`<img src="${small}" alt="">`);}catch(err){toast(err.message)} }
};
$('#a-manual').onclick=()=>openEditor(null);
$('#a-run').onclick=async()=>{
  if(!getKey()){toast('請先到「設定」填入 Gemini API Key');return}
  if(!PICKED.length){toast('請先選照片');return}
  const subj=$('#a-subj').value, exam=$('#a-exam').value.trim();
  const btn=$('#a-run'); btn.disabled=true;
  const sys=DB.settings.prompts.expert;
  const ask=`${ctxLine(subj)}
這是孩子的考卷照片。請找出「老師打叉、扣分或用紅筆訂正」的錯題，每一題輸出一個物件，只輸出 JSON 陣列：
[{"type":"choice|tf|check|num|write","q":"完整題目（含必要情境，不含題號）","opts":["選項文字"],"ans":"正確答案","u":"單位","stu":"孩子原本寫的答案","cause":"概念不懂|讀題漏看|粗心","unit":"單元或課次","exp":"給家長的精簡說明（2~3 句）","hint":"給孩子的引導提示，不能說出答案","v":{"type":"…","q":"…","opts":[],"ans":"…","u":"…"}}]
規則：
- type：選擇題 choice；是非題 tf（ans 填 ○ 或 ✗）；勾選多選題 check（ans 是陣列）；答案是一個數字的填充題 num（ans 只寫數字，單位放 u）；國字、注音、改錯字等要孩子手寫的題目 write。
- choice 和 check 的 ans 必須和 opts 裡的文字完全一樣；比大小題用 choice，opts 為 ["＞","＜","＝"]。
- 分數寫成 {整數|分子|分母}，例如 {3|1|6}；假分數寫成 {|21|6}。
- 正確答案若老師有寫就照老師的；沒有的話請你算出正確答案。
- v 只有數學題要給：同類型、換數字的新題目，答案要正確；其他科目省略 v。
- 照片看不清楚的題目請略過，不要猜。`;
  const all=[];
  for(let i=0;i<PICKED.length;i++){
    btn.innerHTML=`<span class="spin"></span> 辨識第 ${i+1}/${PICKED.length} 張`;
    try{
      const txt=await gemini([{text:ask},{inline_data:{mime_type:'image/jpeg',data:PICKED[i].big.split(',')[1]}}],{system:sys,json:true});
      let arr=JSON.parse(txt.replace(/^```json|```$/g,'').trim()); if(!Array.isArray(arr)) arr=arr.items||[];
      arr.forEach(a=>all.push(normalizeCand(a,subj,exam,i)));
    }catch(err){toast(`第 ${i+1} 張：${err.message}`)}
  }
  btn.disabled=false; btn.textContent='AI 辨識錯題';
  CANDS=CANDS.concat(all); drawCands();
  if(all.length) toast(`找到 ${all.length} 題，請確認後存入`); else toast('沒有辨識到錯題，可以改用手動新增');
};
function normalizeCand(a,subj,exam,photoIdx){
  const types=Object.keys(TYPE_NAME); let type=types.includes(a.type)?a.type:'write';
  let opts=Array.isArray(a.opts)?a.opts.map(String):undefined; let ans=a.ans;
  if(type==='check'&&!Array.isArray(ans)) ans=String(ans||'').split(/[、,，\n]/).map(s=>s.trim()).filter(Boolean);
  if(type!=='check') ans=String(ans??'');
  if(type==='tf') ans=/✗|x|X|×|錯/.test(ans)?'✗':'○';
  const c={id:uid(),s:subj,unit:a.unit||'',exam,date:today(),type,q:String(a.q||''),opts,ans,u:a.u||undefined,stu:String(a.stu||''),cause:CAUSES.includes(a.cause)?a.cause:CAUSES[0],exp:String(a.exp||''),hint:String(a.hint||''),hist:[],mastered:false,streak:0,photos:[],_photo:photoIdx,_keep:true};
  if(a.v&&a.v.q&&subj==='數學'){const vt=types.includes(a.v.type)?a.v.type:type;let va=a.v.ans;if(vt==='check'&&!Array.isArray(va))va=String(va||'').split(/[、,，]/).map(s=>s.trim());if(vt!=='check')va=String(va??'');c.v={type:vt,q:String(a.v.q),opts:Array.isArray(a.v.opts)&&a.v.opts.length?a.v.opts.map(String):undefined,ans:va,u:a.v.u||c.u}}
  return c;
}
function drawCands(){
  const box=$('#a-cands');
  if(!CANDS.length){box.innerHTML='';return}
  box.innerHTML=`<h2>確認 AI 找到的錯題（${CANDS.length} 題）</h2><p class="small muted">修改不對的地方，取消勾選不要的題目，再按最下面的「存入錯題本」。</p>`+
  CANDS.map((c,i)=>`<div class="cand"><label class="row" style="font-weight:600"><input type="checkbox" data-k="${i}" ${c._keep?'checked':''} style="width:22px;height:22px"> 第 ${i+1} 題</label>${editorHTML(c,'c'+i+'-')}</div>`).join('')+
  `<div class="actions"><button class="btn pri" id="a-save">存入錯題本</button><button class="btn ghost" id="a-clear">全部放棄</button></div>`;
  box.querySelectorAll('input[type=checkbox][data-k]').forEach(cb=>cb.onchange=()=>{CANDS[+cb.dataset.k]._keep=cb.checked});
  $('#a-clear').onclick=()=>{CANDS=[];drawCands()};
  $('#a-save').onclick=async()=>{
    const keep=[];
    for(let i=0;i<CANDS.length;i++){ if(!CANDS[i]._keep) continue;
      const [n,err]=readEditor('c'+i+'-',CANDS[i]); if(err){toast(`第 ${i+1} 題：${err}`);return} keep.push(n); }
    const photoIds={};
    for(const n of keep){
      const pi=n._photo;
      if(pi!=null&&PICKED[pi]){ if(!photoIds[pi]){photoIds[pi]=uid(); await idb.put(photoIds[pi],PICKED[pi].small)} n.photos=[photoIds[pi]]; }
      delete n._photo; delete n._keep; DB.items.unshift(n);
    }
    save(); CANDS=[]; PICKED=[]; $('#a-thumbs').innerHTML=''; $('#a-files').value=''; drawCands();
    toast(`已存入 ${keep.length} 題`);
  };
}

/* ================= SETTINGS ================= */
let PEDIT='expert';
function renderSettings(){
  const S=DB.settings;
  $('#s-key').value=getKey(); $('#s-model').value=S.model; $('#s-grade').value=S.grade;
  $('#s-key').onchange=e=>{lsSet(LS_KEY,e.target.value.trim());toast(e.target.value.trim()?'API Key 已存在這台裝置':'已移除 API Key')};
  $('#s-eye').onclick=()=>{const k=$('#s-key');k.type=k.type==='password'?'text':'password';$('#s-eye').textContent=k.type==='password'?'顯示':'隱藏'};
  $('#s-model').onchange=e=>{S.model=e.target.value;save()};
  $('#s-grade').onchange=e=>{S.grade=e.target.value.trim()||'四上';save();updateSub()};
  $('#s-test').onclick=async()=>{lsSet(LS_KEY,$('#s-key').value.trim());$('#s-testmsg').innerHTML='<span class="spin"></span>';
    try{const r=await gemini([{text:'請只回覆「連線成功」四個字。'}]);$('#s-testmsg').textContent='✅ '+r.trim().slice(0,20)}catch(err){$('#s-testmsg').textContent='❌ '+err.message}};
  const drawP=()=>{document.querySelectorAll('.stylebtn').forEach(b=>b.classList.toggle('on',b.dataset.p===PEDIT));
    $('#s-plabel').textContent=PEDIT==='expert'?'AI 教師自定義人格指令（家長診斷、照片辨識使用）':'AI 教師自定義人格指令（Cassie 練習時「問豬探長」使用）';
    $('#s-prompt').value=S.prompts[PEDIT]};
  document.querySelectorAll('.stylebtn').forEach(b=>b.onclick=()=>{PEDIT=b.dataset.p;drawP()});
  $('#s-prompt').oninput=e=>{S.prompts[PEDIT]=e.target.value;save()};
  $('#s-reset').onclick=()=>{S.prompts[PEDIT]=PEDIT==='expert'?PROMPT_EXPERT:PROMPT_PIG;save();drawP();toast('已還原預設')};
  drawP();
  const drawS=()=>{
    $('#s-subjs').innerHTML=S.subjects.map((s,i)=>`<div class="subjrow"><input class="t" data-i="${i}" data-f="name" value="${esc(s.name)}" placeholder="科目"><input class="t" data-i="${i}" data-f="ver" value="${esc(s.ver)}" placeholder="出版社"><button class="btn sm ghost" data-del="${i}" title="移除">✕</button></div>`).join('');
    $('#s-subjs').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
      const s=S.subjects[+inp.dataset.i]; const old=s.name; s[inp.dataset.f]=inp.value.trim();
      if(inp.dataset.f==='name'&&old&&s.name&&old!==s.name) DB.items.forEach(it=>{if(it.s===old)it.s=s.name});
      save();updateSub()});
    $('#s-subjs').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s=S.subjects[+b.dataset.del];
      if(DB.items.some(i=>i.s===s.name)){toast(`「${s.name}」還有錯題，不能移除`);return}
      S.subjects.splice(+b.dataset.del,1);save();drawS();updateSub()});
  };
  drawS();
  $('#s-addsubj').onclick=()=>{S.subjects.push({name:'自然',ver:'康軒'});save();drawS();updateSub()};
  $('#s-export').onclick=exportData;
  $('#s-import').onchange=importData;
  $('#s-wipe').onclick=async()=>{if(!confirm('確定清除全部錯題和設定？建議先匯出備份。'))return;if(!confirm('真的要清除嗎？這個動作無法復原。'))return;
    try{localStorage.removeItem(LS_DATA)}catch(e){} await idb.clear(); DB={v:1,items:[],settings:DEFAULT_SETTINGS()};save();toast('已清除');renderSettings()};
  $('#s-info').textContent=`目前共 ${DB.items.length} 題（已克服 ${DB.items.filter(i=>i.mastered).length} 題）。`;
}
async function exportData(){
  const photos=await idb.all();
  const blob=new Blob([JSON.stringify({app:'cassie-ctb',exported:new Date().toISOString(),data:DB,photos})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`錯題本備份-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); toast('已匯出備份檔');
}
async function importData(e){
  const f=e.target.files[0]; if(!f) return;
  try{const j=JSON.parse(await f.text()); const d=j.data||j; if(!Array.isArray(d.items)) throw new Error('不是錯題本的備份檔');
    if(!confirm(`備份裡有 ${d.items.length} 題。匯入會取代目前的資料，確定嗎？`)) return;
    DB={v:1,items:d.items,settings:{...DEFAULT_SETTINGS(),...d.settings}};
    for(const [k,v] of Object.entries(j.photos||{})) await idb.put(k,v);
    save(); toast('匯入完成'); renderSettings(); updateSub();
  }catch(err){toast('匯入失敗：'+err.message)} finally{e.target.value=''}
}
function updateSub(){ $('#subline').textContent=`${DB.settings.grade}・`+DB.settings.subjects.map(s=>`${s.name}（${s.ver}）`).join(' '); }

/* ---------- boot ---------- */
load(); updateSub();
show(uiGet().view||'practice');
</script>
