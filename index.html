<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="學習小幫手">
<meta name="theme-color" content="#FBF7F0">
<title>學習小幫手</title>
<style>
:root{
  --bg:#FBF7F0; --side:#F1ECE3; --card:#FFFFFF; --ink:#2B2622; --mute:#857B70; --line:#E7DFD3;
  --acc:#E0673B; --acc-soft:#FCE9E0; --ok:#2E9E6A; --ok-soft:#E3F4EA; --bad:#D9483B; --bad-soft:#FBE6E3; --warn:#D99A22;
  --c-國語:#D9534F; --c-數學:#3A6FD8; --c-自然:#2E9E6A; --c-社會:#E08A2E;
  --s-國語:#FDECEB; --s-數學:#EAF0FC; --s-自然:#E6F5EE; --s-社會:#FCF1E4;
  --r:18px; --sh:0 1px 2px rgba(60,40,20,.05),0 4px 16px rgba(60,40,20,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;flex:none;background:var(--side);padding:18px 12px 24px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
.brand b{font-size:18px;display:block;line-height:1.2}.brand small{color:var(--mute);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:13px;color:var(--mute);padding:14px 12px 4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-align:left;font-size:16.5px}
.nav button svg{width:22px;height:22px;flex:none;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:#E2DBCF;font-weight:600}
.nav button .badge{margin-left:auto;background:var(--acc);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:600}
.side .foot{margin-top:auto;padding-top:16px}
.modebtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:15px}
main{flex:1;min-width:0;padding:28px 36px 60px;max-width:1180px}
h1{font-size:34px;margin:0 0 4px;letter-spacing:.5px}
h2{font-size:21px;margin:28px 0 12px}
h3{font-size:18px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh)}
.muted{color:var(--mute)}.small{font-size:14px}.tiny{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:16px}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12.5px;font-weight:600;background:#F2EDE6;color:#6A6058}
.subj{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;color:#fff;font-size:14px;font-weight:700;flex:none}
.t{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea.t{min-height:120px;resize:vertical}
label.f{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2B2622;color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
/* subject tiles */
.stile{border-radius:var(--r);padding:18px;cursor:pointer;text-align:left;display:block;width:100%}
.stile .big{font-size:38px;font-weight:800;line-height:1.1;margin:8px 0 2px}
/* unit list */
.unit{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.unit>.hd{padding:16px 20px;display:flex;align-items:center;gap:10px}
.lesson{display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--line)}
.lesson .nm{flex:1}
.score{font-weight:800;font-size:20px;min-width:44px;text-align:right}
.pass{color:var(--ok)}.fail{color:var(--bad)}
/* quiz */
.qwrap{max-width:820px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:10px;background:#EAE3D8;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.qcard{background:#fff;border-radius:22px;padding:26px 28px;box-shadow:var(--sh)}
.psg{background:#F7F3EC;border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:16px;line-height:1.75;max-height:260px;overflow:auto}
.qtext{font-size:22px;line-height:1.65;font-weight:500}
.qtext .neg{color:var(--bad);font-weight:800;border-bottom:3px solid var(--bad);padding:0 1px}
.qfig{margin:14px 0 4px;max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:15px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:19px;line-height:1.5;min-height:58px}
.opt .k{width:32px;height:32px;border-radius:50%;background:#F2EDE6;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.tfrow .opt{justify-content:center;font-size:30px;min-height:76px}
.numin{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.numin input{font-size:24px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;width:220px}
.numin label{font-size:17px;color:var(--mute)}
.fb{margin-top:18px;border-radius:16px;padding:14px 18px;font-size:17px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb.tip{background:#FFF6E0}
.fb b{display:block;margin-bottom:2px}
.exp{white-space:pre-wrap}
.qact{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.qact .btn{min-width:130px;min-height:52px;font-size:17px}
.readtip{display:flex;gap:8px;align-items:flex-start;background:#FFF6E0;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:14px}
.bubbles{display:flex;flex-wrap:wrap;gap:8px}
.bub{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ok-soft);color:var(--ok)}
.bub.w{background:var(--bad-soft);color:var(--bad)}.bub.f{background:#FFF1D6;color:#B07A10}
.bigscore{font-size:96px;font-weight:800;line-height:1;color:var(--ok)}
.bigscore.fail{color:var(--bad)}
.frac{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;margin:0 2px}
.frac .w{font-size:1em;margin-right:1px}
.frac .fd{display:inline-flex;flex-direction:column;align-items:center;font-size:.72em;line-height:1.05}
.frac .fd span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.bar{height:8px;background:#EEE7DC;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.today-subj{display:flex;justify-content:space-around;text-align:center;margin:8px 0 16px}
.today-subj .subj{width:52px;height:52px;border-radius:14px;font-size:22px}
.today-subj .subj.off{background:#fff!important;border:2px dashed currentColor}
.kpi{font-size:38px;font-weight:800;line-height:1}
.kpi small{font-size:16px;font-weight:600;margin-left:2px}
.wrongitem{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:12px}
.ans-ok{color:var(--ok);font-weight:600}.ans-bad{color:var(--bad);font-weight:600}
.task{display:flex;align-items:center;gap:14px;padding:16px 18px;background:#fff;border-radius:16px;box-shadow:var(--sh);margin-bottom:12px;text-align:left;width:100%}
.task .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--acc-soft)}
.task.done .ic{background:var(--ok-soft)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;font-size:16px}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.planday{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.planday .d{width:86px;flex:none;font-weight:700}
.planday.today{background:var(--acc-soft);margin:0 -14px;padding:12px 14px;border-radius:12px}
.reserve{border:2px dashed var(--line);border-radius:var(--r);padding:40px;text-align:center;color:var(--mute)}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(40,30,20,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:20px;padding:22px;width:min(640px,100%);max-height:90vh;overflow:auto}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:20;padding:8px 10px;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;gap:6px}
  .brand{padding:0 6px 0 0}.brand small,.brand b{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;padding:8px 10px;font-size:15px}
  .side .foot{margin:0;padding:0}
  .modebtn{white-space:nowrap;padding:8px 12px}
  main{padding:18px 16px 60px}
  h1{font-size:28px}
  .qcard{padding:20px 18px}.qtext{font-size:20px}
}
</style>
</head>
<body>

  <aside class="side">
    <div class="brand"><div class="logo">C</div><div><b id="brandName">學習小幫手</b><small id="brandSub">四年級上學期</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><button class="modebtn" id="modeBtn"></button></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
'use strict';

const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dkey(new Date());
const addDays = (k, n) => { const [y,m,d] = k.split('-').map(Number); const t = new Date(y, m-1, d+n); return dkey(t); };

const SUBJ = ['國語','數學','自然','社會'];

const isNegQ = q => NEG_STRICT.test(q.q || '');

function rich(text, opt = {}){
  let h = esc(text);
  h = h.replace(/\{(\d*)\|([^|{}]+)\|([^|{}]+)\}/g, (m, w, n, d) => `<span class="frac">${w?`<span class="w">${w}</span>`:''}<span class="fd"><span>${n}</span><span>${d}</span></span></span>`);

}
/* ================= 題型 ================= */

function autoQt(q){
  const k = q.kp || '', s = q.s;
  if (s === '國語') { if (/注音|錯別字|形近字|部件|讀音/.test(k)) return '字形字音'; if (/成語/.test(k)) return '成語運用'; if (/詞語|關聯詞|一詞多義|詞義/.test(k)) return '詞語意思與關係'; if (/閱讀/.test(k)) return '閱讀理解'; if (/課文/.test(k)) return '課文理解'; return '句型與修辭'; }

const qtOf = it => it.qt || (it.bankId && QB[it.bankId] ? autoQt(QB[it.bankId]) : autoQt(it));
const PERIODS = ['期中考前', '期末'];
/* ================= 資料 ================= */

function pickJSON(t, obj){ const m = t.match(obj ? /\{[\s\S]*\}/ : /\[[\s\S]*\]/); if (!m) throw new Error('AI 回覆的格式看不懂，請再試一次'); return JSON.parse(m[0]); }
async function fetchNewsList(){
  const t = await gemini([{ text:`請讀取 ${NEWS_URL} 這個兒童國際新聞列表頁，列出頁面上最新的 12 篇文章。只輸出 JSON 陣列，不要其他文字：[{"title":"標題","url":"完整網址","summary":"一句話摘要（20 字內）"}]。url 必須是頁面上真的出現、以 https://zeroegg.tw/world/ 開頭的文章網址，不要自己編。` }], { urlCtx:true });
  const list = pickJSON(t).filter(a => a && a.title && /^https:\/\/zeroegg\.tw\/world\/[\w-]+$/.test(String(a.url || '').trim())).map(a => ({ title:String(a.title), url:String(a.url).trim(), summary:String(a.summary || '') }));
  if (!list.length) throw new Error('沒有抓到文章列表，請稍後再試');

async function makeNewsQuiz(n){
  const have = DB.reading.find(r => r.url === n.url); if (have) return have;
  const t = await gemini([{ text:`請讀取這篇給小學生看的新聞：${n.url}
讀者是國小四年級的孩子，她讀長句子時常抓不到重點。請「只根據這篇文章的內容」出 4 題四選一的閱讀理解題：
第1題：這篇新聞主要在說什麼（主旨）。
第2題：找出文中的重要事實（人、事、時、地、物）。
第3題：事情的原因或結果。
第4題：文中某個詞語或句子的意思，或從文章可以推論出什麼。
題目和選項用繁體中文、用字淺白；錯的選項要合理但看文章就能排除；不要和文章最後原本附的測驗題一樣。
只輸出 JSON，不要其他文字：{"title":"文章標題","qs":[{"q":"題目","opts":["","","",""],"ans":"必須和 opts 其中一個完全相同","exp":"一句話說明答案在文章哪一段、怎麼找到"}]}` }], { urlCtx:true });
  const j = pickJSON(t, true);
  const qs = (j.qs || []).filter(q => q.q && Array.isArray(q.opts) && q.opts.length >= 2 && q.opts.includes(q.ans)).map(q => ({ type:'choice', q:String(q.q), opts:q.opts.map(String), ans:String(q.ans), exp:String(q.exp || '') }));

}
async function dailyNews(btn){

/* ================= 家長：閱讀文章 ================= */
VIEWS['p-reading'] = el => {
  el.innerHTML = `<h1>閱讀文章</h1><p class="sub">從零蛋報國際新聞抓文章自動出題，或貼上自己找的短文。</p>
    <div class="card" style="margin-bottom:16px"><div class="row"><h3 style="margin:0;flex:1">零蛋報・國際新聞</h3><label class="small row"><input type="checkbox" id="r-auto" ${DB.settings.autoNews ? 'checked' : ''}> ${NM()} 每天自動有一篇</label></div>
      <p class="small muted">AI 會讀取 zeroegg.tw/world 的最新文章，依內容出 4 題（主旨、事實、因果、詞意或推論）。文章本身不會存進 App，${NM()} 是點連結到零蛋報網站閱讀。${getKey() ? '' : '<b style="color:var(--bad)">需要先到「AI 設定」填 API Key。</b>'}</p>
      <div class="row"><button class="btn sm pri" id="r-list" ${getKey() ? '' : 'disabled'}>抓最新文章列表</button>${DB.newsCache ? `<span class="tiny muted">上次更新 ${fmtTime(DB.newsCache.ts)}</span>` : ''}</div><div id="r-news"></div></div>
    <div class="card"><h3>貼上自己的文章</h3><label class="f">標題</label><input class="t" id="r-t"><label class="f">文章內容</label><textarea class="t" id="r-x" style="min-height:180px"></textarea>
    <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn pri" id="r-ai">${getKey() ? 'AI 出題並新增' : '需要先設定 AI'}</button></div></div>
    <h2>文章列表</h2><div class="card">${DB.reading.length ? DB.reading.slice().reverse().map(a => `<div class="li"><div style="flex:1"><b>${esc(a.title)}</b><div class="small muted">${a.source === 'zeroegg' ? '零蛋報・' : ''}${a.qs.length} 題・${a.done ? `已完成 ${a.score} 分` : '還沒做'}</div></div>${a.url ? `<a class="btn sm" href="${esc(a.url)}" target="_blank" rel="noopener">原文</a>` : ''}<button class="btn sm" data-view="${a.id}">看題目</button><button class="btn sm ghost" data-del="${a.id}" style="color:var(--bad)">刪除</button></div>`).join('') : '<div class="empty">還沒有文章。</div>'}</div>`;
  $('#r-auto').onchange = e => { DB.settings.autoNews = e.target.checked; save(); toast('已儲存'); };
  const drawNews = list => { const used = new Set(DB.reading.map(r => r.url)); $('#r-news').innerHTML = list.map((n, i) => `<div class="li"><div style="flex:1"><a href="${esc(n.url)}" target="_blank" rel="noopener"><b>${esc(n.title)}</b></a><div class="small muted">${esc(n.summary)}</div></div>${used.has(n.url) ? '<span class="small pass">已加入</span>' : `<button class="btn sm" data-ni="${i}">出題加入</button>`}</div>`).join('');
    $$('[data-ni]').forEach(b => b.onclick = async () => { b.disabled = true; b.innerHTML = '<span class="spin"></span>'; try { await makeNewsQuiz(list[+b.dataset.ni]); toast(`已加入，${NM()} 在「閱讀」看得到`); render(); } catch(e){ toast(e.message); b.disabled = false; b.textContent = '出題加入'; } }); };
  if (DB.newsCache) drawNews(DB.newsCache.list);
  $('#r-list').onclick = async () => { const b = $('#r-list'); b.disabled = true; b.innerHTML = '<span class="spin"></span> 讀取中'; try { drawNews(await fetchNewsList()); } catch(e){ toast(e.message); } b.disabled = false; b.textContent = '抓最新文章列表'; };
  $('#r-ai').onclick = async () => {
    const title = $('#r-t').value.trim(), text = $('#r-x').value.trim(); if (!title || text.length < 50) return toast('請填標題和至少 50 字的內容');
    const b = $('#r-ai'); b.disabled = true; b.innerHTML = '<span class="spin"></span> 出題中';
    try { const t = await gemini([{ text:`以下是一篇給國小四年級看的文章。請出 3 題四選一的閱讀理解題：第1題找文章中的重要事實，第2題理解原因或關係，第3題推論或主旨。題目和選項用繁體中文、用字淺白。只輸出 JSON 陣列：[{"q":"題目","opts":["","","",""],"ans":"正確選項文字（必須和 opts 其中一個完全相同）","exp":"一句話說明答案在文章哪裡"}]\n\n文章：${text}` }], { json:true });
      let arr = JSON.parse(t.replace(/^```json|```$/g, '').trim()); arr = (Array.isArray(arr) ? arr : arr.items || []).filter(q => q.q && Array.isArray(q.opts) && q.opts.includes(q.ans)).map(q => ({ type:'choice', q:q.q, opts:q.opts, ans:q.ans, exp:q.exp || '' }));
      if (!arr.length) throw new Error('AI 出的題目格式不對，請再試一次');
      DB.reading.push({ id:'r' + uid(), title, text, qs:arr, added:today() }); save(); render(); toast(`已新增，${NM()} 在「閱讀」就看得到`);
    } catch(e){ toast(e.message); b.disabled = false; b.textContent = 'AI 出題並新增'; }
  };
  $$('[data-del]').forEach(b => b.onclick = () => { if (!confirm('刪除這篇？')) return; DB.reading = DB.reading.filter(a => a.id !== b.dataset.del); save(); render(); });
  $$('[data-view]').forEach(b => b.onclick = () => { const a = DB.reading.find(x => x.id === b.dataset.view); modal(`<h3>${esc(a.title)}</h3>${a.qs.map((q, i) => `<div style="margin:12px 0"><b>${i + 1}. ${esc(q.q)}</b><div class="small muted">${q.opts.map(esc).join('　／　')}</div><div class="small">答案：<span class="ans-ok">${esc(q.ans)}</span></div></div>`).join('')}<div class="row"><span class="sp"></span><button class="btn" onclick="document.getElementById('modalRoot').innerHTML=''">關閉</button></div>`); });
};
/* ================= 家長：規則設定 ================= */
VIEWS['p-rules'] = el => {
  const S = DB.settings, t = tree();
  el.innerHTML = `<h1>規則設定</h1><p class="sub">改了會馬上套用。</p>
    <div class="grid g2"><div class="card"><h3>練習規則</h3>
      <label class="f">及格分數</label><input class="t" type="number" id="s-pass" value="${S.pass}" min="50" max="100">
      <label class="f">每回題數</label><input class="t" type="number" id="s-qlen" value="${S.qlen}" min="3" max="30">
      <label class="f">每天目標：幾回單元練習過關</label><input class="t" type="number" id="s-goal" value="${S.goal}" min="1" max="10">
      <label class="f">每次錯題練習題數</label><input class="t" type="number" id="s-wd" value="${S.wrongDaily}" min="1" max="20"></div>
    <div class="card"><h3>考試與複習計畫</h3>
      <label class="f">現在新加入的錯題算哪一段</label><select class="t" id="s-per">${PERIODS.map(p => `<option ${p === S.period ? 'selected' : ''}>${p}</option>`).join('')}</select>
      <label class="f">考試名稱</label><input class="t" id="s-en" value="${esc(S.examName)}">
      <label class="f">考試第一天</label><input class="t" type="date" id="s-ed" value="${S.examDate}">
      <label class="f">考試範圍（綜合練習和複習計畫會用到）</label>
      ${SUBJ.map(s => `<div style="margin:6px 0"><b class="small" style="color:${SC(s)}">${s}</b><div class="row small" style="gap:4px 14px">${unitOrder(s, Object.keys(t[s] || {})).map(u => `<label><input type="checkbox" data-rs="${s}" data-ru="${esc(u)}" ${(S.range[s] || []).includes(u) ? 'checked' : ''}> ${esc(u)}</label>`).join('') || '<span class="muted">沒有題目</span>'}</div></div>`).join('')}
    </div></div>`;
  const num = (id, k, lo, hi) => $(id).onchange = e => { const v = Math.max(lo, Math.min(hi, parseInt(e.target.value) || lo)); S[k] = v; e.target.value = v; save(); toast('已儲存'); };
  num('#s-pass', 'pass', 50, 100); num('#s-qlen', 'qlen', 3, 30); num('#s-goal', 'goal', 1, 10); num('#s-wd', 'wrongDaily', 1, 20);
  $('#s-per').onchange = e => { S.period = e.target.value; save(); toast('已儲存'); };
  $('#s-en').onchange = e => { S.examName = e.target.value.trim() || '考試'; save(); toast('已儲存'); };
  $('#s-ed').onchange = e => { if (e.target.value) { S.examDate = e.target.value; save(); toast('已儲存'); } };
  $$('[data-rs]').forEach(c => c.onchange = () => { const s = c.dataset.rs, u = c.dataset.ru; S.range[s] = (S.range[s] || []).filter(x => x !== u); if (c.checked) S.range[s].push(u); save(); toast('已更新範圍'); });
};
/* ================= 家長：AI 設定 ================= */
VIEWS['p-ai'] = el => {
  const S = DB.settings; let ed = UI.pe || 'kid';
  el.innerHTML = `<h1>AI 設定</h1><p class="sub">用在：拍照新增錯題、AI 診斷、孩子的「看詳細解說」、閱讀文章出題。沒有設定也能正常練習。</p>
    <div class="card"><div class="grid g2"><div><label class="f">Gemini API Key</label><div class="row" style="flex-wrap:nowrap"><input class="t" type="password" id="a-key" autocomplete="off" value="${esc(getKey())}"><button class="btn sm" id="a-eye">顯示</button></div><div class="tiny muted" style="margin-top:4px">只存在這台裝置的瀏覽器，不會放進備份檔。</div></div>
      <div><label class="f">模型</label><select class="t" id="a-model">${['gemini-2.5-flash', 'gemini-2.5-pro', 'gemini-2.5-flash-lite'].map(m => `<option ${m === S.model ? 'selected' : ''}>${m}</option>`).join('')}</select><div class="row" style="margin-top:6px"><button class="btn sm" id="a-test">測試連線</button><span class="small muted" id="a-msg"></span></div></div></div>
      <label class="f" style="margin-top:18px"><b>教學風格</b>（點按鈕切換要編輯的指令）</label>
      <div class="row"><button class="chip ${ed === 'expert' ? 'on' : ''}" data-p="expert">家長診斷（精簡專家）</button><button class="chip ${ed === 'kid' ? 'on' : ''}" data-p="kid">孩子練習（一步一步解說）</button></div>
      <textarea class="t" id="a-prompt" style="min-height:240px;margin-top:10px">${esc(S.prompts[ed])}</textarea>
      <div class="row" style="margin-top:6px"><span class="small muted">以輸入框內容作為 AI 的行為準則。</span><span class="sp"></span><button class="btn sm" id="a-reset">還原預設</button></div></div>`;
  $('#a-key').onchange = e => { lsSet(LS_KEY, e.target.value.trim()); toast(e.target.value.trim() ? 'API Key 已存在這台裝置' : '已移除 API Key'); };
  $('#a-eye').onclick = () => { const k = $('#a-key'); k.type = k.type === 'password' ? 'text' : 'password'; $('#a-eye').textContent = k.type === 'password' ? '顯示' : '隱藏'; };
  $('#a-model').onchange = e => { S.model = e.target.value; save(); };
  $('#a-test').onclick = async () => { lsSet(LS_KEY, $('#a-key').value.trim()); $('#a-msg').innerHTML = '<span class="spin"></span>'; try { const r = await gemini([{ text:'請只回覆「連線成功」四個字。' }]); $('#a-msg').textContent = '✅ ' + r.trim().slice(0, 20); } catch(e){ $('#a-msg').textContent = '❌ ' + e.message; } };
  $$('[data-p]').forEach(b => b.onclick = () => { UI.pe = b.dataset.p; render(); });
  $('#a-prompt').oninput = e => { S.prompts[ed] = e.target.value; save(); };
  $('#a-reset').onclick = () => { S.prompts[ed] = ed === 'expert' ? PROMPT_EXPERT : PROMPT_KID; save(); render(); toast('已還原預設'); };
};
/* ================= 家長：資料備份 ================= */
VIEWS['p-backup'] = el => {
  el.innerHTML = `<h1>資料備份</h1><p class="sub">所有紀錄存在這台 iPad 的瀏覽器裡。清除 Safari 網站資料會一起清掉，建議每週匯出一次。</p>
    ${DB.migrated ? `<div class="fb ok" style="margin-bottom:16px">已在 ${DB.migrated} 自動搬入舊錯題本的 ${DB.items.filter(i => i.src === '平時考').length} 題錯題。</div>` : ''}
    <div class="card"><div class="row"><button class="btn pri" id="b-ex">匯出備份</button><label class="btn" for="b-im">匯入備份</label><input type="file" id="b-im" accept="application/json,.json" hidden><span class="sp"></span><button class="btn ghost" id="b-wipe" style="color:var(--bad)">清除全部資料</button></div>
    <p class="small muted" style="margin-bottom:0">匯入支援這個 App 的備份檔，也支援舊「錯題本」匯出的備份檔（只會加入錯題，不會覆蓋紀錄）。</p>
    <p class="small muted">目前：錯題 ${DB.items.length} 題・作答紀錄 ${DB.sessions.length} 筆・閱讀 ${DB.reading.length} 篇・題庫 ${BANK.length} 題（存在這台裝置，備份檔不含題庫，請保留原本的題庫檔）。</p></div>`;
  $('#b-ex').onclick = async () => { const photos = await idb.all(); const blob = new Blob([JSON.stringify({ app:'cassie-learn', exported:new Date().toISOString(), data:DB, photos })], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `學習備份-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('已匯出'); };
  $('#b-im').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await f.text());
    if (j.app === 'cassie-learn' && j.data) { if (!confirm('匯入會取代目前所有資料，確定嗎？')) return; lsSet(LS_DATA, JSON.stringify(j.data)); load(); for (const p of (j.photos || [])) await idb.put(p).catch(() => {}); toast('已匯入'); render(); }
    else if (j.app === 'cassie-ctb' && j.data && Array.isArray(j.data.items)) { const have = new Set(DB.items.map(i => i.id)); const add = j.data.items.filter(i => !have.has(i.id)).map(i => ({ src:'平時考', ...i })); DB.items.push(...add); save(); toast(`加入 ${add.length} 題舊錯題`); render(); }
    else throw new Error('看不懂這個檔案'); } catch(err){ toast('匯入失敗：' + err.message); } };
  $('#b-wipe').onclick = () => { if (!confirm('確定清除全部資料？建議先匯出備份。')) return; if (!confirm('真的要清除嗎？這個動作無法復原。')) return; try { localStorage.removeItem(LS_DATA); } catch(e){} DB = null; load(); render(); toast('已清除'); };
};
/* ================= 啟動 ================= */
load();
(async () => { try { const j = await kv.get('bank'); if (j) applyBankFile(j); } catch(e){} render(); })();
if (MODE === 'kid' && !NAV_KID.some(n => n[0] === VIEW)) VIEW = 'today';
if (MODE === 'parent' && !NAV_PARENT.some(n => n[0] === VIEW)) VIEW = 'p-home';

</script>
</body>
</html>
