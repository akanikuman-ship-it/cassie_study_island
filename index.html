MC.split("\n").forEach(l=>{const[u,s,o,a,p]=l.split("|"),op=o.split(";"),q={u:+u,q:s,o:op,a:a-1,w:"標準答案是「"+op[a-1]+"」。"},k=/不正確|不是|不屬於/.test(s)?1:/正確/.test(s)?0:undefined;if(k!==undefined)q.k=k;if(p)q.p=p;Q.push(q)});
const FIG=`<svg viewBox="0 0 400 130" style="width:100%;max-width:480px;display:block;margin:8px 0 0" role="img" aria-label="四種水生植物示意圖：甲大萍、乙荷花、丙睡蓮、丁水蘊草"><rect y="62" width="400" height="56" fill="#bfe3f2"/><rect y="118" width="400" height="12" fill="#b9966b"/><g stroke="#2e7d4f" fill="none" stroke-width="3"><path d="M50 62v14M40 62l-5 12M60 62l5 12"/><path d="M150 118V30"/><path d="M250 118C250 90 262 78 262 62"/><path d="M340 118c-8-20 8-34 0-50M355 118c-8-20 8-34 0-44"/></g><g fill="#4caf6e"><ellipse cx="40" cy="58" rx="16" ry="6"/><ellipse cx="62" cy="58" rx="16" ry="6"/><ellipse cx="150" cy="30" rx="26" ry="7"/><ellipse cx="262" cy="60" rx="26" ry="5"/><ellipse cx="336" cy="86" rx="9" ry="4"/><ellipse cx="350" cy="98" rx="9" ry="4"/><ellipse cx="345" cy="72" rx="9" ry="4"/></g><circle cx="150" cy="18" r="8" fill="#f28aa5"/><circle cx="262" cy="55" r="5" fill="#fff" stroke="#f28aa5"/><g font-size="12" fill="#1f2a44" text-anchor="middle"><text x="50" y="127">甲 大萍</text><text x="150" y="127">乙 荷花</text><text x="250" y="127">丙 睡蓮</text><text x="345" y="127">丁 水蘊草</text></g></svg><div style="font-size:14px;margin-bottom:8px">示意圖：藍色是水，棕色是泥土</div>`;

const $=document.getElementById("app");
let pool=[],i=0,st={},score=0,sess=[];
function load(){try{return JSON.parse(localStorage.getItem("pigWrong")||"[]")}catch(e){return[]}}

function home(){

 Object.keys(U).map(k=>`<button class="unit opt" data-u="${k}">第 ${k} 單元：${U[k]}</button>`).join("")+
 `<button class="go opt" data-u="0">全部混合辦案</button><button class="opt" data-book="1">📒 看我的錯題本</button></div>`;
 $.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>start(+b.dataset.u));
 $.querySelector("[data-book]").onclick=book;
}
function start(u){pool=Q.filter(q=>!u||q.u==u).sort(()=>Math.random()-.5).slice(0,10);i=0;score=0;sess=[];ask()}

 if(i>=pool.length)return end();

 let h=`<p class="sub"><span class="tag">案件 ${i+1} / ${pool.length}</span> 第 ${q.u} 單元</p><div class="card">`;
 if(q.p)h+=`<div class="pass">${q.p}</div>`;
 if(q.img)h+=FIG;
 h+=`<div><b>${q.q}</b></div>`;
 if(gate){
  h+=`<p class="step">🔍 仔細看一看：這題要選哪一種？</p><button data-k="0">選「正確的」</button><button data-k="1">選「不正確的」</button>`;
 }else{
  if(q.k!==undefined)h+=`<p class="step">🧠 用心想一想：每個選項都檢查一遍。</p>`;
  h+=q.o.map((t,j)=>`<button class="opt ${st.tried.includes(j)?"bad":""} ${st.done&&j==q.a?"good":""}" data-o="${j}" ${st.tried.includes(j)||st.done?"disabled":""}>${"①②③④"[j]} ${t}</button>`).join("");
 }
 h+=`<div class="fb" id="fb">${msg}</div></div>`;
 $.innerHTML=h;
 $.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
  if(+b.dataset.k===q.k){st.ok1=true;draw("✅ 看清楚了！")}
  else{st.miss=true;draw("線索還沒找齊，再讀一次題目：它問的是「正確」還是「不正確」？")}});
 $.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>pick(+b.dataset.o));
}
function pick(j){
 const q=pool[i];
 if(j===q.a){
  st.done=true;
  if(!st.wrong&&!st.miss)score++;
  draw(`🎉 推理得好！${q.w}<br><button class="go" id="nx">下一題</button>`);
  document.getElementById("nx").onclick=()=>{i++;ask()};
 }else{
  st.tried.push(j);st.wrong=true;
  draw(`線索還沒找齊，我們再查一次！<br>這次的線索是哪一種？<br>`+CAUSE.map(c=>`<button data-c="${c}">${c}</button>`).join(""));
  $.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
   const r=load();r.push({q:q.q,u:q.u,c:b.dataset.c});save(r);sess.push(b.dataset.c);
   draw("📒 記進錯題本了，再選一次吧！")});
 }
}
function topCause(a){const m={};a.forEach(c=>m[c]=(m[c]||0)+1);return Object.keys(m).sort((x,y)=>m[y]-m[x])[0]}
function end(){
 const t=topCause(sess);
 $.innerHTML=`<h1>🎖 結案！</h1><div class="card"><p>一次就答對：<b>${score}</b> / ${pool.length} 題</p><p>${t?`這次最常出現的是「<b>${t}</b>」，下次我們一起想辦法改進！`:"全部一次就破案，你是最棒的偵探！"}</p><button class="go" id="h">回辦案室</button><button id="b">📒 錯題本</button></div>`;
 document.getElementById("h").onclick=home;document.getElementById("b").onclick=book;
}
function book(){

 $.innerHTML=`<h1>📒 錯題本</h1><div class="card">`+(r.length?
  `<p>最常出現：<b>${t}</b>（共 ${r.length} 筆）</p>`+r.slice(-30).reverse().map(x=>`<p>【${x.c}】第 ${x.u} 單元：${x.q}</p>`).join("")+`<button id="clr">清空錯題本</button>`
  :`<p>目前沒有錯題，繼續保持！</p>`)+`<button class="go" id="h">回辦案室</button></div>`;
 document.getElementById("h").onclick=home;
 const c=document.getElementById("clr");if(c)c.onclick=()=>{if(confirm("確定要清空嗎？")){save([]);book()}};

 for(const u in U)h+=`<h2>第 ${u} 單元：${U[u]}</h2>`+Q.filter(q=>q.u==u).map(q=>`<details class="card"><summary>${q.q}</summary>${q.p?`<div class="pass">${q.p}</div>`:""}<p>${q.o.map((t,j)=>(j==q.a?"✅ ":"▫️ ")+"①②③④"[j]+" "+t).join("<br>")}</p><p>${q.w}</p></details>`).join("");
 $.innerHTML=h;
}
document.querySelectorAll("#nav [data-n]").forEach(b=>b.onclick=()=>{({h:home,b:book,a:ans})[b.dataset.n]();scrollTo(0,0)});
home();
